# Vendor-neutral OAuth 2.0 client secret: `client_secret` in a keyed assignment
# (RFC 6749 section 2.3.1).
#
# Why this detector:
#   `client_secret` is one of the most common credential key names in existence
#   and it is vendor-neutral by construction: the OAuth spec names the field, not
#   the provider. Before this file the corpus had no owner for the neutral shape,
#   and `akamai-api-credentials` carried a bare `client_secret[=:\s"']+(...)`
#   pattern instead. That made Akamai the de-facto owner of every OAuth client
#   secret on earth: measured on benchmarks/corpora/homefield it attributed 10
#   non-Akamai secrets (blynk, helpscout, anypoint, foursquare, dwolla, wiz,
#   onelogin, miro, ...) to Akamai against 3 real Akamai hits, and it labelled
#   this repository's own Marketo fixture an Akamai secret. Anchoring Akamai to
#   its own evidence (`akamai`, `*.luna.akamaiapis.net`, `akab-`) removed the
#   false vendor claim but left the credentials themselves unowned, because the
#   generic keyword/entropy arms suppress their dominant shapes (bare 40-hex
#   digest, 48-char uppercase alnum, 44-char base64 with `/` and `=`).
#
# Why precision holds without a Tier-B opt-out:
#   The value lives in a structurally fixed slot after the `client_secret` key
#   and its separator run, and we capture ONLY that slot (group 1). This file
#   originally declared `structural_password_slot = true`, copying
#   `bearer-authorization`'s rationale that the Tier-B hash-digest arms would
#   otherwise suppress digest-shaped secrets. That was ASSUMED, not measured, and
#   an ablation disproved it: with the flag removed the findings are identical on
#   every corpus available (homefield 33 vs 33, mirror 0 vs 0) and the
#   digest-shaped case `CLIENT_SECRET = "<40 hex>"` still reports at confidence
#   1.0. The Tier-B floor never engages here because the `client_secret` keyword
#   is a named anchor, so these are not generic entropy candidates. The flag was
#   inert policy and is gone. Precision comes from the pattern itself:
#     * the value floor is `{20,}`, so `client_secret=secret` never matches;
#     * the char class excludes `<` `>` `$` `{` `}`, so `client_secret=<secret>`,
#       `client_secret=${OAUTH_SECRET}` and `client_secret={{secret}}` templates
#       never match;
#     * the `dictionary_word_placeholder` gate drops values the English bigram
#       model is confident are real words.
#
# Resolution:
#   `resolution_priority = -1` keeps every service-named client-secret detector
#   (azure, google, okta, keycloak, cognito, discord, onelogin, avaya, jumio,
#   checkmarx, ...) ranked ABOVE this neutral owner, so a vendor-attributable
#   secret is never reported as the neutral shape.
#
# Verify: no verification endpoint (the token endpoint is provider-specific).

[detector]
id = "oauth-client-secret"
name = "OAuth Client Secret"
service = "generic"
severity = "high"
ml = { match_mode = "lift", entropy_mode = "disabled", weight = 1.0, context_radius_lines = 5 }
match_confidence = { literal_prefix_weight = 0.35, context_anchor_weight = 0.20, entropy_weight = 0.20, high_entropy_partial_weight = 0.12, moderate_entropy_threshold = 3.0, moderate_entropy_weight = 0.05, low_entropy_penalty_floor = 2.0, low_entropy_min_match_length = 10, low_entropy_penalty_multiplier = 0.60, keyword_nearby_weight = 0.10, sensitive_file_weight = 0.10, companion_weight = 0.05, very_high_entropy_margin = 1.2999999999999998, named_anchor_floor = 0.55, assignment_context_multiplier = 1.0, string_literal_context_multiplier = 0.9, unknown_context_multiplier = 0.8, documentation_context_multiplier = 0.3, comment_context_multiplier = 0.4, test_context_multiplier = 0.3, encrypted_context_multiplier = 0.05, soft_context_suppression_threshold = 0.5, encrypted_context_suppression_threshold = 0.8, post_match = { placeholder_multiplier = 0.05, minimum_byte_diversity = 0.1, low_diversity_multiplier = 0.1, maximum_repeat_ratio = 0.8, degenerate_run_min_length = 10, degenerate_repeat_multiplier = 0.1, fixture_path_multiplier = 0.5, ml_context_reapply_below = 0.95 } }
keywords = ["client_secret", "CLIENT_SECRET", "clientSecret", "client-secret"]
# Every service-named client-secret detector outranks this neutral owner.
resolution_priority = -1

[[detector.patterns]]
# `client_secret` / `clientSecret` / `client-secret` / `CLIENT_SECRET`, its
# separator run, then the secret slot. `[A-Za-z0-9._~+/=\-]` is the OAuth
# credential alphabet (base64 and base64url plus padding); `<` `>` `$` `{` `}`
# are absent so template placeholders never match.
regex = '''(?i)client[_.\-]?secret[=:\s"']+([A-Za-z0-9._~+/=\-]{20,})'''
description = "OAuth 2.0 client secret in a keyed assignment"
group = 1

# No verify block (neutral detector, token endpoint is provider-specific).

[[detector.tests]]
test_positive = "client_secret = C113nt53KR3TN6N90yVuAgICxIRwsObLi0E67/N8eRN="
test_negative = "client_secret=${OAUTH_CLIENT_SECRET}"

[[detector.tests]]
test_positive = "clientSecret: \"0F12A345BB67C8D901EFG23H45IJKL67MNO89PQ12RST34UV\""
test_negative = "client_secret=secret"
