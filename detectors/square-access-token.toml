# Docs: https://developer.squareup.com/docs/build-basics/access-tokens
# Format: Square personal access token `sq0atp-` + 22 [0-9A-Za-z_-]; OAuth
#         application secret `sq0csp-` + 43 [0-9A-Za-z_-]. (Square, the
#         payments platform, distinct from Squarespace.)
# Verify: GET connect.squareup.com/v2/locations with Authorization: Bearer
# Prefix: sq0atp- / sq0csp- (distinctive, no context anchor required)
#
# The `EAAA...` OAuth access-token shape is deliberately NOT matched: a 60-char
# base64url blob behind a 4-char prefix collides with ordinary base64 data and
# would cost precision; the `sq0atp-`/`sq0csp-` prefixes are unambiguous.

[detector]
id = "square-access-token"
name = "Square Access Token"
service = "square"
severity = "high"
ml = { match_mode = "lift", entropy_mode = "disabled", weight = 1.0, context_radius_lines = 5 }
match_confidence = { literal_prefix_weight = 0.35, context_anchor_weight = 0.20, entropy_weight = 0.20, high_entropy_partial_weight = 0.12, moderate_entropy_threshold = 3.0, moderate_entropy_weight = 0.05, low_entropy_penalty_floor = 2.0, low_entropy_min_match_length = 10, low_entropy_penalty_multiplier = 0.60, keyword_nearby_weight = 0.10, sensitive_file_weight = 0.10, companion_weight = 0.05, very_high_entropy_margin = 1.2999999999999998, named_anchor_floor = 0.55, assignment_context_multiplier = 1.0, string_literal_context_multiplier = 0.9, unknown_context_multiplier = 0.8, documentation_context_multiplier = 0.3, comment_context_multiplier = 0.4, test_context_multiplier = 0.3, encrypted_context_multiplier = 0.05, soft_context_suppression_threshold = 0.5, encrypted_context_suppression_threshold = 0.8, post_match = { placeholder_multiplier = 0.05, minimum_byte_diversity = 0.1, low_diversity_multiplier = 0.1, maximum_repeat_ratio = 0.8, degenerate_run_min_length = 10, degenerate_repeat_multiplier = 0.1, fixture_path_multiplier = 0.5, ml_context_reapply_below = 0.95 } }
keywords = ["sq0atp", "sq0csp", "square", "SQUARE_ACCESS_TOKEN", "EAAA"]
decode_transforms = { reverse_prefixes = ["sq0atp-", "sq0csp-"], caesar_prefixes = ["sq0atp-", "sq0csp-"] }
validators = [{ type = "pattern-shape", prefixes = ["sq0atp-", "sq0csp-"], allow_overlong = false }]
simdsieve_prefixes = ["sq0csp-"]
# Square's `EAAA` OAuth token shares the `EAA` prefix family with Facebook Graph
# API tokens, so when the text names Square this detector must outrank
# `facebook-access-token`.
resolution_priority = 1

[[detector.patterns]]
# Square replaced `sq0atp-`/`sq0csp-` with an `EAAA`-prefixed OAuth access token,
# which had no owner here: both Square ground-truth files in
# benchmarks/corpora/homefield (`square EAAA7h9fL9zQ...`) were undetected.
# `(?-i)` is REQUIRED because detector patterns compile case-insensitively by
# default, and a caseless `EAAA` matches the lowercase `eaaa...` prefix of
# sha256 image digests; `(?i:square)` keeps only the vendor word caseless.
regex = '''(?-i)(?i:square)[_.\-\s]*(?i:(?:oauth|access)[_.\-\s]*token)?[=:\s"']*(EAAA[0-9A-Za-z_\-]{40,})'''
description = "Square OAuth access token (EAAA prefix) in a Square-named context"
group = 1

[[detector.patterns]]
regex = 'sq0atp-[0-9A-Za-z_-]{22}'
description = "Square personal access token (sq0atp- prefix, 22 chars)"

[[detector.patterns]]
regex = 'sq0csp-[0-9A-Za-z_-]{43}'
description = "Square OAuth application secret (sq0csp- prefix, 43 chars)"

[detector.verify]
method = "GET"
url = "https://connect.squareup.com/v2/locations"
allowed_domains = ["connect.squareup.com"]

[detector.verify.auth]
type = "bearer"
field = "match"

[detector.verify.success]
status = 200
policy = "status_with_error_backstop"

[[detector.tests]]
test_positive = "SQUARE_ACCESS_TOKEN=sq0atp-TYPn7nNYVuAYfVUPY8nlGY"
test_negative = "token = sq0atp-short"
