# Docs: https://techdocs.akamai.com/developer/docs/set-up-authentication-credentials
# Format: EdgeGrid credentials with client_token (akab-), access_token (akab-), client_secret (base64)
# Verify: EdgeGrid authentication with multiple tokens required - no simple verification
# Prefix: akab- for client_token and access_token

[detector]
id = "akamai-api-credentials"
name = "Akamai EdgeGrid API Credentials"
service = "akamai"
severity = "critical"
ml = { match_mode = "lift", entropy_mode = "disabled", weight = 1.0, context_radius_lines = 5 }
match_confidence = { literal_prefix_weight = 0.35, context_anchor_weight = 0.20, entropy_weight = 0.20, high_entropy_partial_weight = 0.12, moderate_entropy_threshold = 3.0, moderate_entropy_weight = 0.05, low_entropy_penalty_floor = 2.0, low_entropy_min_match_length = 10, low_entropy_penalty_multiplier = 0.60, keyword_nearby_weight = 0.10, sensitive_file_weight = 0.10, companion_weight = 0.05, very_high_entropy_margin = 1.2999999999999998, named_anchor_floor = 0.55, assignment_context_multiplier = 1.0, string_literal_context_multiplier = 0.9, unknown_context_multiplier = 0.8, documentation_context_multiplier = 0.3, comment_context_multiplier = 0.4, test_context_multiplier = 0.3, encrypted_context_multiplier = 0.05, soft_context_suppression_threshold = 0.5, encrypted_context_suppression_threshold = 0.8, post_match = { placeholder_multiplier = 0.05, minimum_byte_diversity = 0.1, low_diversity_multiplier = 0.1, maximum_repeat_ratio = 0.8, degenerate_run_min_length = 10, degenerate_repeat_multiplier = 0.1, fixture_path_multiplier = 0.5, ml_context_reapply_below = 0.95 } }
keywords = ["akab-", "AKAB-", "client_token", "access_token", "client_secret", "luna.akamaiapis.net"]

[[detector.patterns]]
# Real EdgeGrid tokens are `akab-` plus roughly 18 to 40 characters; the `{32,50}`
# floor rejected the shorter issued forms. Ground-truth Akamai files in
# benchmarks/corpora/homefield (`client-token=akab-sXedJBTOf0dHl27vVOd`,
# `access-token=akab-xcsuUf7DY6xJgYscoe`) carry 18 to 19 character bodies and a
# HYPHENATED key name, so both the separator and the floor were wrong.
regex = '''(?i)client[_\-\s]*token[=:\s"']+(akab-[a-zA-Z0-9_-]{16,50})'''
description = "Akamai EdgeGrid client token"
group = 1

[[detector.patterns]]
regex = '''(?i)access[_\-\s]*token[=:\s"']+(akab-[a-zA-Z0-9_-]{16,50})'''
description = "Akamai EdgeGrid access token"
group = 1

[[detector.patterns]]
# `client_secret` is a universal OAuth2 assignment key, so an EdgeGrid secret is
# only identifiable from Akamai's own evidence: the `akamai` name, the EdgeGrid
# host (`*.luna.akamaiapis.net`), or the `akab-` token that shares its `.edgerc`
# section. The anchor-free form claimed any `client_secret=` in the world:
# measured on benchmarks/corpora/homefield it attributed 10 non-Akamai vendor
# secrets (blynk, helpscout, anypoint, foursquare, dwolla, wiz, ...) to Akamai
# against 3 real Akamai hits, and it labelled this repo's own Marketo fixture in
# crates/scanner/examples/adv_probe_detailed.rs as an Akamai secret.
regex = '''(?i)akamai[_\-\s]*(?:edgegrid[_\-\s]*)?client[_\-\s]*secret[=:\s"']+([a-zA-Z0-9+/=]{30,50})'''
description = "Akamai EdgeGrid client secret in an Akamai-named assignment"
group = 1

[[detector.patterns]]
regex = '''(?is)luna\.akamaiapis\.net.{0,256}client_secret[=:\s"']+([a-zA-Z0-9+/=]{30,50})'''
required_literals = ["luna.akamaiapis.net"]
description = "Akamai EdgeGrid client secret following the EdgeGrid host"
group = 1

[[detector.patterns]]
regex = '''(?is)client_secret[=:\s"']+([a-zA-Z0-9+/=]{30,50}).{0,256}luna\.akamaiapis\.net'''
required_literals = ["luna.akamaiapis.net"]
description = "Akamai EdgeGrid client secret preceding the EdgeGrid host"
group = 1

[[detector.patterns]]
regex = '''(?is)client_secret[=:\s"']+([a-zA-Z0-9+/=]{30,50}).{0,256}akab-'''
required_literals = ["akab-"]
description = "Akamai EdgeGrid client secret preceding an akab- EdgeGrid token"
group = 1

[[detector.patterns]]
regex = '''(?is)akab-.{0,256}client_secret[=:\s"']+([a-zA-Z0-9+/=]{30,50})'''
required_literals = ["akab-"]
description = "Akamai EdgeGrid client secret following an akab- EdgeGrid token"
group = 1

[[detector.companions]]
name = "akamai_credential_companion"
regex = "(?m)^akab-[a-zA-Z0-9_-]{32,50}$"
within_lines = 10

[[detector.tests]]
test_positive = "client_token=akab-Kp4Qx7Rm2Sn5Tb8Vw3YzKp4Qx7Rm2SnTb"
test_negative = "client_token=akab-short"
