# Docs: https://curl.se/docs/manpage.html#-u
# Format: Basic auth credentials passed via curl -u or --user flag
# Prefix: none (requires context anchoring on curl and -u / --user)

[detector]
id = "curl-auth-user"
name = "cURL Basic Authentication Credentials"
service = "curl"
severity = "high"
ml = { match_mode = "lift", entropy_mode = "disabled", weight = 1.0, context_radius_lines = 5 }
match_confidence = { literal_prefix_weight = 0.35, context_anchor_weight = 0.20, entropy_weight = 0.20, high_entropy_partial_weight = 0.12, moderate_entropy_threshold = 3.0, moderate_entropy_weight = 0.05, low_entropy_penalty_floor = 2.0, low_entropy_min_match_length = 8, low_entropy_penalty_multiplier = 0.50, keyword_nearby_weight = 0.10, sensitive_file_weight = 0.10, companion_weight = 0.05, very_high_entropy_margin = 1.2999999999999998, named_anchor_floor = 0.55, assignment_context_multiplier = 1.0, string_literal_context_multiplier = 0.9, unknown_context_multiplier = 0.8, documentation_context_multiplier = 0.3, comment_context_multiplier = 0.7, test_context_multiplier = 0.3, encrypted_context_multiplier = 0.05, soft_context_suppression_threshold = 0.3, encrypted_context_suppression_threshold = 0.8, post_match = { placeholder_multiplier = 0.05, minimum_byte_diversity = 0.1, low_diversity_multiplier = 0.1, maximum_repeat_ratio = 0.8, degenerate_run_min_length = 10, degenerate_repeat_multiplier = 0.1, fixture_path_multiplier = 0.5, ml_context_reapply_below = 0.95 } }
min_confidence = 0.2
weak_anchor = true
entropy_high = 4.5
entropy_floor = [{ max_len = 20, floor = 2.8 }, { floor = 3.0 }]
keywords = ["curl", "--user", "-u"]

[[detector.patterns]]
regex = '''(?i)\bcurl\b[^\r\n]*?[ \t\r\n](?:-u|--user)(?:=|[ \t]+)'([a-zA-Z0-9_.\-]+:[^'\r\n]{3,})''''
description = "cURL single-quoted basic authentication credentials"
group = 1

[[detector.patterns]]
regex = '(?i)\bcurl\b[^\r\n]*?[ \t\r\n](?:-u|--user)(?:=|[ \t]+)"([a-zA-Z0-9_.\-]+:[^"$\r\n]{3,})"'
description = "cURL double-quoted basic authentication credentials"
group = 1

[[detector.patterns]]
regex = '''(?i)\bcurl\b[^\r\n]*?[ \t\r\n](?:-u|--user)(?:=|[ \t]+)([a-zA-Z0-9_.\-]+:[a-zA-Z0-9@._\-~#%^&*+=]{3,})'''
description = "cURL unquoted basic authentication credentials"
group = 1

[[detector.tests]]
test_positive = "curl -sw '%{http_code}' -X POST --user  'johns:h0pk1ns~21s' $GItHUB_API_URL/$GIT_COMMIT --data"
test_negative = "curl -i -u 'test:test'"
