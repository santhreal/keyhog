# Docs: https://docs.budibase.com/docs/budibase-cli-reference
# Format: BUDIBASE_ prefixed environment variables with API keys and internal tokens
# Verify: no public verification endpoint (self-hosted)
# Prefix: BUDIBASE_

[detector]
id = "budibase-credentials"
name = "Budibase Credentials"
service = "budibase"
severity = "critical"
ml = { match_mode = "lift", entropy_mode = "disabled", weight = 1.0, context_radius_lines = 5 }
match_confidence = { literal_prefix_weight = 0.35, context_anchor_weight = 0.20, entropy_weight = 0.20, high_entropy_partial_weight = 0.12, moderate_entropy_threshold = 3.0, moderate_entropy_weight = 0.05, low_entropy_penalty_floor = 2.0, low_entropy_min_match_length = 10, low_entropy_penalty_multiplier = 0.60, keyword_nearby_weight = 0.10, sensitive_file_weight = 0.10, companion_weight = 0.05, very_high_entropy_margin = 1.2999999999999998, named_anchor_floor = 0.55, assignment_context_multiplier = 1.0, string_literal_context_multiplier = 0.9, unknown_context_multiplier = 0.8, documentation_context_multiplier = 0.3, comment_context_multiplier = 0.4, test_context_multiplier = 0.3, encrypted_context_multiplier = 0.05, soft_context_suppression_threshold = 0.5, encrypted_context_suppression_threshold = 0.8, post_match = { placeholder_multiplier = 0.05, minimum_byte_diversity = 0.1, low_diversity_multiplier = 0.1, maximum_repeat_ratio = 0.8, degenerate_run_min_length = 10, degenerate_repeat_multiplier = 0.1, fixture_path_multiplier = 0.5, ml_context_reapply_below = 0.95 } }
keywords = ["BUDIBASE", "budibase", "INTERNAL_API_KEY"]

[[detector.patterns]]
regex = "BUDIBASE_[A-Z_]*(?:API_KEY|SECRET|PASSWORD|TOKEN)[=:\\s\"'']+([a-zA-Z0-9_\\-]{20,})"
description = "Budibase API key or secret environment variable"
group = 1

# `INTERNAL_API_KEY`, `JWT_SECRET`, `API_ENCRYPTION_KEY` and the
# COUCH_DB/MINIO/REDIS credentials ARE the documented Budibase self-host
# environment names, but every one of them is also a universal name, so an
# anchor-free form attributes any project's secret to Budibase. Measured on
# benchmarks/corpora/homefield the anchor-free form claimed a plain Redis
# password (0 correct Budibase hits), and it also stole the inline
# test_positive of both `supabase-jwt-secret` and `internalio-credentials`.
# A Budibase deployment always names itself nearby (the `budibase/*` container
# images in its docker-compose, or a `BUDIBASE_` sibling variable), so require
# that evidence in a bounded window on either side.
[[detector.patterns]]
regex = '''(?is)budibase.{0,512}INTERNAL_API_KEY[=:\s"']+([a-zA-Z0-9_\-]{16,})'''
description = "Budibase internal API key following Budibase deployment evidence"
group = 1

[[detector.patterns]]
regex = '''(?is)INTERNAL_API_KEY[=:\s"']+([a-zA-Z0-9_\-]{16,}).{0,512}budibase'''
description = "Budibase internal API key preceding Budibase deployment evidence"
group = 1

[[detector.patterns]]
regex = '''(?is)budibase.{0,512}(?:JWT_SECRET|API_ENCRYPTION_KEY)[=:\s"']+([a-zA-Z0-9_\-\/\+]{20,}={0,2})'''
description = "Budibase encryption or JWT secret following Budibase deployment evidence"
group = 1

[[detector.patterns]]
regex = '''(?is)(?:JWT_SECRET|API_ENCRYPTION_KEY)[=:\s"']+([a-zA-Z0-9_\-\/\+]{20,}={0,2}).{0,512}budibase'''
description = "Budibase encryption or JWT secret preceding Budibase deployment evidence"
group = 1

[[detector.patterns]]
regex = '''(?is)budibase.{0,512}(?:COUCH_DB|MINIO|REDIS)_(?:PASSWORD|SECRET_KEY)[=:\s"']+([a-zA-Z0-9_\-]{12,})'''
description = "Budibase infrastructure credentials following Budibase deployment evidence"
group = 1

[[detector.patterns]]
regex = '''(?is)(?:COUCH_DB|MINIO|REDIS)_(?:PASSWORD|SECRET_KEY)[=:\s"']+([a-zA-Z0-9_\-]{12,}).{0,512}budibase'''
description = "Budibase infrastructure credentials preceding Budibase deployment evidence"
group = 1

[[detector.tests]]
test_positive = "BUDIBASE_INTERNAL_API_KEY=Kp4Qx7Rm2Sn5Tb8Vw3YzKp4Qx7Rm2Sn5"
test_negative = "BUDIBASE_API_KEY=Kp4Qx7Rm"
