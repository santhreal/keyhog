[book]
title = "KeyHog: GPU-accelerated secret scanner"
authors = ["Santh Project"]
description = "Use KeyHog to scan code, Git history, cloud, containers, and browser assets for secrets with CPU, Hyperscan, CUDA, Metal, and WGPU backends."
language = "en"
src = "src"

[output.html]
default-theme = "keyhog"
preferred-dark-theme = "keyhog"
git-repository-url = "https://github.com/santhreal/keyhog"
edit-url-template = "https://github.com/santhreal/keyhog/edit/main/docs/{path}"
site-url = "/keyhog/"
no-section-label = true
additional-css = ["theme/css/keyhog.css"]

[output.html.search]
enable = true
limit-results = 25
use-boolean-and = true

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false
copyable = false
