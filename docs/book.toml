[book]
title = "KeyHog: Rust secret scanner"
authors = ["Santh Project"]
description = "Scan repositories, Git history, GitHub Actions and CI, hosted Git collections, and cloud object inventories with CPU, Hyperscan, and GPU backends."
language = "en"
src = "src"

[output.html]
default-theme = "keyhog"
preferred-dark-theme = "keyhog"
git-repository-url = "https://github.com/santhreal/keyhog"
edit-url-template = "https://github.com/santhreal/keyhog/edit/main/docs/{path}"
site-url = "/keyhog/"
no-section-label = true
additional-css = ["theme/css/keyhog.css"]

[output.html.search]
enable = true
limit-results = 25
use-boolean-and = true

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false
copyable = false
