name: differential-bench

# Differential F1 gate: run the unified benchmark package (benchmarks/bench)
# over the synthetic mirror corpus with KeyHog plus required competitors, then
# assert KeyHog leads on F1. Precision, recall, and speed remain recorded in
# the result artifacts; `bench gate` exits non-zero unless BetterLeaks and
# Kingfisher both produce usable rows and KeyHog's F1 is STRICTLY better.
#
# This replaces the retired tools/diff_bench runner: the bench package's
# scanner adapters + canonical scorer + `gate` subcommand are the single
# source of differential truth. The corpus is generated at runtime (gitignored,
# never committed) so no literal credential lands in a tracked file or trips
# GitHub push-protection. The KeyHog row is always the checked-out commit built
# by this job, never an unrelated latest release. See benchmarks/README.md.

on:
  schedule:
    # 03:11 UTC nightly, staggered off the hour to avoid the queue
    # spike for actions/runner-images cache.
    - cron: "11 3 * * *"
  workflow_dispatch:
    inputs:
      positives:
        description: "Labeled positive fixtures (smaller = smoke)."
        required: false
        default: "3000"
      negatives:
        description: "Labeled negative fixtures."
        required: false
        default: "12000"

env:
  # Survive intermittent mid-stream crates.io download drops on hosted runners
  # (curl [55] SSL_ERROR_SYSCALL); cargo's default of 3 retries is not enough.
  CARGO_NET_RETRY: "10"

jobs:
  gate:
    name: keyhog vs required competitors (F1 gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Per-job permissions, see keyhog.yml header note. Top-level
    # `permissions:` rejected at dispatch time on this repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install Hyperscan development files
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq \
              && sudo apt-get install -y --no-install-recommends libhyperscan-dev pkg-config; then
              break
            fi
            sleep $((i * 2))
            if [ "$i" -eq 5 ]; then exit 1; fi
          done

      - name: build checked-out keyhog (CPU-only release binary)
        # Hosted ubuntu runners have no CUDA device or libcuda. Keep the full
        # detection surface, including Hyperscan, but explicitly omit only the
        # GPU dispatch stack so this measures the checked-out CPU scanner.
        run: |
          set -euo pipefail
          env -u CC cargo build --locked --release -p keyhog --bin keyhog \
            --no-default-features --features ci-lean
          mkdir -p "$HOME/.local/bin"
          install -m 0755 target/release/keyhog "$HOME/.local/bin/keyhog"
          echo "using checked-out keyhog $(git rev-parse HEAD)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install benchmark dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -r benchmarks/requirements.txt

      - name: prepare clean benchmark results
        # Results are generated state. Start from an absent directory so the
        # gate/upload cannot consume a stale row from a cache or checkout.
        run: |
          set -euo pipefail
          rm -rf benchmarks/results

      - name: install required competitors
        run: |
          set -euo pipefail
          # Keep competitor source identities immutable. The result row also
          # records each installed executable SHA-256, so toolchain changes or
          # tampered caches cannot masquerade as a reproducible rerun.
          go install github.com/betterleaks/betterleaks@v1.6.1
          cargo install --locked --git https://github.com/mongodb/kingfisher \
            --rev 07644722fd6c3cea60d431cd8a77a914e9b54d65 kingfisher
          cp "$HOME/go/bin/betterleaks" "$HOME/.local/bin/betterleaks"
          cp "$HOME/.cargo/bin/kingfisher" "$HOME/.local/bin/kingfisher"

      - name: scanner versions
        run: |
          set -euo pipefail
          keyhog --version
          betterleaks --version
          kingfisher --version

      - name: keyhog smoke check (broken binary != F1 regression)
        # A broken install / unsatisfied libhyperscan runtime makes `keyhog scan`
        # find nothing, which the downstream gate would misreport as
        # "keyhog F1 0.0000 regressed below baseline". Catch it here with a
        # distinct, actionable signal so an infra failure is never confused with
        # a recall regression. ldd output aids diagnosis of the lib state.
        run: |
          set -euo pipefail
          echo "ldd $(command -v keyhog):"
          ldd "$(command -v keyhog)" 2>&1 || true
          tmp="$(mktemp -d)"
          printf 'aws = "AKIAJP3GG7XYRIBQXOLA"\nstripe = "sk_live_4eC39HqLyjWDarjtT1zdp7dc"\n' > "$tmp/smoke.txt"
          report="$tmp/smoke.json"
          stdout_log="$tmp/smoke.stdout"
          stderr_log="$tmp/smoke.stderr"
          set +e
          keyhog scan "$tmp/smoke.txt" --no-suppress-test-fixtures --format json --output "$report" >"$stdout_log" 2>"$stderr_log"
          rc=$?
          set -e
          case "$rc" in
            1 | 10) ;;
            *)
              echo "::error::keyhog smoke scan exited $rc; expected findings exit 1 or live-credential exit 10."
              sed -n '1,80p' "$stderr_log"
              exit 1
              ;;
          esac
          n="$(python3 - "$report" <<'PY'
          import json
          import pathlib
          import sys

          report = pathlib.Path(sys.argv[1])
          data = json.loads(report.read_text())
          if isinstance(data, list):
              findings = data
          elif isinstance(data, dict):
              findings = data.get("findings", [])
          else:
              raise SystemExit(f"unexpected JSON root {type(data).__name__}")
          print(len(findings))
          PY
          )"
          echo "smoke findings: $n"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::keyhog smoke check found 0 secrets in a known-positive fixture. The installed binary is broken (libhyperscan/runtime), NOT a recall regression. Failing before the differential gate so the F1=0.0 result is not misread as a regression."
            exit 1
          fi

      - name: generate mirror corpus
        env:
          POSITIVES: ${{ inputs.positives || '3000' }}
          NEGATIVES: ${{ inputs.negatives || '12000' }}
        run: |
          set -euo pipefail
          cd benchmarks && python3 -m bench.corpora.mirror --ensure \
            --positives "$POSITIVES" --negatives "$NEGATIVES" --seed 0

      - name: run leaderboard (keyhog + required competitors)
        # The production target passes --require-available, so an adapter that
        # cannot execute fails here rather than becoming a fabricated row.
        run: |
          set -euo pipefail
          make -C benchmarks leaderboard SCANNERS=keyhog,betterleaks,kingfisher

      - name: differential + regression gate (keyhog must lead and not regress)
        # BASELINE names the inventory directory, not a hand-picked JSON file:
        # the gate resolves mirror through baselines/canonical.toml.
        run: |
          set -euo pipefail
          make -C benchmarks gate \
            GATE_SCANNERS=keyhog,betterleaks,kingfisher \
            REQUIRE_COMPETITORS=betterleaks,kingfisher \
            BASELINE=baselines EPSILON=0.005

      - name: validate differential artifacts
        # A successful command is not sufficient evidence for publication:
        # validate schema, provenance axes, availability, and real findings.
        run: |
          set -euo pipefail
          cd benchmarks
          python3 - <<'PY'
          import json
          import pathlib

          from bench.schema import RunResult

          files = sorted(pathlib.Path("results").rglob("*.json"))
          if not files:
              raise SystemExit("results: no benchmark result JSON files")
          rows = [
              RunResult.from_json(json.loads(path.read_text()), source=str(path))
              for path in files
          ]
          expected = {"keyhog", "betterleaks", "kingfisher"}
          observed = {row.scanner.name for row in rows if row.corpus.name == "mirror"}
          missing = expected - observed
          if missing:
              raise SystemExit(f"results: missing required scanner rows: {sorted(missing)}")
          for row in rows:
              if row.corpus.name != "mirror":
                  raise SystemExit(f"results: unexpected corpus {row.corpus.name!r}")
              if not row.available:
                  raise SystemExit(f"results: unavailable {row.scanner.name} row: {row.error}")
              if row.corpus.fixture_count <= 0 or row.finding_count <= 0:
                  raise SystemExit(
                      f"results: empty {row.scanner.name} result "
                      f"(fixtures={row.corpus.fixture_count}, findings={row.finding_count})"
                  )
          PY


      - name: upload results artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: benchmarks/results/**
          if-no-files-found: error
          retention-days: 90
