name: keyhog

# Run keyhog secret scanner on every push + PR (plus nightly/manual) through the
# bundled composite Action. Runtime errors fail the job. Findings upload to Code Scanning and
# fail only when `.github/keyhog-strict` is present.
#
# Hosted GitHub runners have no usable GPU, and this workflow invokes the
# composite from a portable branch or commit checkout. Use the required CPU
# backend. Published release refs use separately calibrated routing evidence.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

# Cancel superseded nightly/manual scans on the same ref.
concurrency:
  group: keyhog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: keyhog scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Per-job permissions instead of workflow-level, some org/repo
    # policy configurations reject dispatch of any workflow that
    # declares top-level `permissions:`. Per-job is equivalent in
    # effect, dispatch-safe everywhere.
    permissions:
      contents: read
      security-events: write   # upload SARIF to Code Scanning
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history for git-source scans

      - name: resolve evidence policy
        id: evidence-policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/keyhog-strict ]]; then
            echo 'policy=paranoid' >> "$GITHUB_OUTPUT"
          else
            echo 'policy=default' >> "$GITHUB_OUTPUT"
          fi

      - name: scan
        id: keyhog
        uses: ./
        with:
          # No version override: a branch/SHA action ref builds and exercises
          # this exact checkout. Release artifacts have separate signed smokes.
          path: .
          backend: cpu
          severity: high
          format: sarif
          upload-sarif: 'true'
          fail-on-findings: 'false'
          evidence-policy: ${{ steps.evidence-policy.outputs.policy }}

      - name: fail on policy-blocking findings (opt-in via .github/keyhog-strict)
        if: steps.keyhog.outputs.exit-code == '1' || steps.keyhog.outputs.exit-code == '10'
        env:
          ACTION_FINDINGS: ${{ steps.keyhog.outputs.findings }}
          ACTION_EXIT_CODE: ${{ steps.keyhog.outputs.exit-code }}
        run: |
          set -euo pipefail
          case "${ACTION_FINDINGS:-}" in
            "" | *[!0-9]*)
              echo "::error title=KeyHog::Invalid findings output."
              exit 3
              ;;
          esac
          case "${ACTION_EXIT_CODE:-}" in
            0 | 1 | 10) ;;
            "" | *[!0-9]*)
              echo "::error title=KeyHog::Invalid exit-code output."
              exit 3
              ;;
            *)
              echo "::error title=KeyHog::Unexpected scan exit code ${ACTION_EXIT_CODE}."
              exit "$ACTION_EXIT_CODE"
              ;;
          esac
          echo "keyhog policy exit $ACTION_EXIT_CODE with $ACTION_FINDINGS visible finding(s)"
          if [ -f .github/keyhog-strict ]; then
            echo "  .github/keyhog-strict selected paranoid policy - failing CI"
            exit "$ACTION_EXIT_CODE"
          fi
          echo "  .github/keyhog-strict absent - default-policy findings remain visible in Code Scanning"
          echo "  (add .github/keyhog-strict to select paranoid policy and block every tier)"
