name: Record star count

# Daily snapshot of stargazers_count into metrics/stars.json.
# Lets us plot growth over time without depending on
# star-history.com staying up. Runs at 07:17 UTC so we don't
# collide with the wall of cron jobs that fire on the minute.

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: record-stars
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    # Per-job permissions: this repo rejects dispatch of any workflow that
    # declares a TOP-LEVEL `permissions:` block (1-3s exit, 0 jobs -- see
    # health-check.yml / keyhog.yml). Per-job is equivalent
    # and dispatch-safe, so the daily star snapshot actually runs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record changed count and render chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.stargazers_count')"
          python3 -B scripts/star_history.py \
            --record "$count" --date "$(date -u +%Y-%m-%d)"

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet metrics/stars.json metrics/stars.svg; then
            echo 'count unchanged; skipping commit'
            exit 0
          fi
          git add metrics/stars.json metrics/stars.svg
          git commit -m 'chore(metrics): record star count [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo 'failed to publish star history after three rebases' >&2
          exit 1
