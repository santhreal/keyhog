name: ci-nightly

# Overnight heavy pass. Required push/PR CI stays in ci.yml.
# This workflow runs once daily and on manual dispatch: scanner property fuzz,
# CLI property/adversarial/reliability, feature-matrix explosion, install-script
# batteries, Windows portable build, and static Hyperscan linkage.
on:
  schedule:
    - cron: "30 6 * * *"   # after runners-nightly (05:00)
  workflow_dispatch:

concurrency:
  group: ci-nightly
  cancel-in-progress: false

permissions:
  contents: read

# Every job here is schedule- or dispatch-triggered, so there is no pull
# request to route onto the self-hosted Linux runner and no self-hosted
# workspace to repair. Both are ci.yml's concern.

env:
  CARGO_TERM_COLOR: always
  CC: ""
  CARGO_NET_RETRY: "10"

jobs:
  library-surface:
    name: Library surface (property fuzz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Vectorscan
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update -qq && sudo apt-get install -y libhyperscan-dev pkg-config && break
            sleep $((i * 2))
            if [ "$i" -eq 5 ]; then exit 1; fi
          done
      # Heavy scanner property fuzz stays overnight; required CI owns --lib.
      - name: Property tests
        run: cargo test -p keyhog-scanner --lib property::scanner_fuzz --profile release-fast

  integration-cli:
    name: Integration (CLI overnight suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Vectorscan
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update -qq && sudo apt-get install -y libhyperscan-dev pkg-config && break
            sleep $((i * 2))
            if [ "$i" -eq 5 ]; then exit 1; fi
          done
      - name: cli property
        run: cargo test -p keyhog --test property --profile release-fast
      - name: cli adversarial
        run: cargo test -p keyhog --test adversarial --profile release-fast -- --test-threads=4
      # 1,200 product-reliability cells (subcommand x hostile profile, format x
      # hostile profile, exit-code and installer contracts) that no workflow ran
      # until now, so the whole lane was free to rot. It drives the shipped
      # binary on the scalar backend, so it needs no accelerator and no feature
      # flags beyond the default build.
      - name: cli product reliability matrix
        run: cargo test -p keyhog --test reliability_all --profile release-fast

  fuzz-smoke:
    name: Fuzz target smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Vectorscan
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update -qq && sudo apt-get install -y libhyperscan-dev pkg-config && break
            sleep $((i * 2))
            if [ "$i" -eq 5 ]; then exit 1; fi
          done
      # Pin the fuzz compiler so toolchain changes cannot silently alter this
      # sanitizer gate between otherwise identical commits.
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2026-08-07 --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-08-07 install cargo-fuzz --locked
      - name: Run bounded fuzz smoke
        run: |
          cargo +nightly-2026-08-07 fuzz run decode_target -- -runs=64
          cargo +nightly-2026-08-07 fuzz run scanner_target -- -runs=32

  macos-build:
    name: macOS Build
    runs-on: macos-15
    # macOS must exercise both the default Vectorscan/Hyperscan path and the
    # native Metal release asset path without a Vectorscan dependency.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Vectorscan
        run: brew update && brew install vectorscan pkg-config
      # Prove the documented Homebrew Vectorscan path builds the actual CLI,
      # not only the scanner library. The portable release build remains below.
      - run: cargo build -p keyhog
      - run: cargo test -p keyhog-core --lib
      - run: cargo test -p keyhog-scanner --lib -- --nocapture
      - run: cargo test -p keyhog-sources --lib
      # Lock the exact invocation used by the macOS release matrix. Native
      # Metal and WGPU are enabled without pulling in Hyperscan.
      - run: cargo build --release -p keyhog --no-default-features --features portable,gpu
      # Prove the freshly-built macOS binary actually INSTALLS and RUNS via
      # install.sh's --from-file path: doctor self-test (exit 0), seeded scan
      # (exit 1 + findings), SARIF, and the local-checksum gate. The mocked
      # detection scenarios never touch a real binary, and integration-smoke is
      # manual + installs a published release; this is the only gate that proves
      # current-source -> install -> working binary on macOS, every push.
      - name: install-from-build proof (macOS)
        run: bash tests/install/macos/install_from_local_build.sh target/release/keyhog

  windows-build:
    name: Windows portable release build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Keep both Windows feature closures used by the tag workflow green on
      # every change instead of discovering platform failures after tagging.
      - name: Build portable CLI
        run: cargo build --locked --release -p keyhog --no-default-features --features portable
      - name: Build GPU literal artifacts
        run: cargo build --locked --release -p keyhog-scanner --bin keyhog-scanner-artifacts --no-default-features --features ml,entropy,decode,multiline

  static-release-linkage:
    name: Static Hyperscan release linkage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: '1.89'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install exact static native build inputs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            libhyperscan-dev=5.4.2-2 \
            pkg-config=1.8.1-2build1
          root="$RUNNER_TEMP/keyhog-hyperscan-static"
          mkdir -p "$root/include" "$root/lib/pkgconfig"
          cp -a /usr/include/hs "$root/include/"
          cp /usr/lib/x86_64-linux-gnu/libhs.a "$root/lib/libhs.a"
          cp /usr/lib/x86_64-linux-gnu/pkgconfig/libhs.pc \
            "$root/lib/pkgconfig/libhs.pc"
          printf 'HYPERSCAN_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Build and prove self-contained release binary
        run: |
          set -euo pipefail
          cargo build --locked --release -p keyhog --features static-hyperscan
          target/release/keyhog --version
          linkage="$(ldd target/release/keyhog)"
          printf '%s\n' "$linkage"
          if grep -Eiq 'libhs|libhyperscan' <<<"$linkage"; then
            echo "ERROR: release binary dynamically links Hyperscan" >&2
            exit 1
          fi

  # This is the only release-consumable CI verdict. It runs after every
  # blocking shard, fails closed on failed/skipped/cancelled dependencies, and
  # intentionally excludes only the documented advisory clippy job.

  nightly-verdict:
    name: Nightly verdict
    if: ${{ always() }}
    needs:
      - library-surface
      - integration-cli
      - fuzz-smoke
      - macos-build
      - windows-build
      - static-release-linkage
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      KEYHOG_BLOCKING_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every nightly heavy job
        run: |
          jq -e '
            length == 6 and
            all(.[]; .result == "success")
          ' <<<"$KEYHOG_BLOCKING_RESULTS" >/dev/null
