name: docs

# Build the mdBook docs site and deploy to GitHub Pages.
#
# Runs on push to main (live updates) and on PR (build-check only,
# no deploy). The deploy step is gated on a successful build AND
# the push-to-main trigger, so PR runs never publish.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'action.yml'
      - '.github/actions/keyhog/**'
      - 'benchmarks/Makefile'
      - 'benchmarks/bench/readme_matrix.py'
      - 'benchmarks/bench/tests/test_readme_matrix.py'
      - 'benchmarks/bench/scaling_matrix.py'
      - 'benchmarks/bench/tests/test_scaling_matrix.py'
      - 'benchmarks/reports/*matrix*'
      - 'benchmarks/reports/readme-scaling.json'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
      - 'scripts/gates/docs_truth.py'
      - 'scripts/gates/docs_links.py'
      - 'scripts/gates/action_docs_contract.py'
      - 'scripts/tests/test_action_docs_contract.py'
      - 'scripts/gates/workflow_docs_boundaries.py'
      - 'scripts/tests/test_workflow_docs_boundaries.py'
      - 'scripts/docs_site.py'
      - 'scripts/tests/test_docs_site.py'
      - 'metrics/stars.json'
      - 'metrics/stars.svg'
      - 'scripts/star_history.py'
      - 'scripts/tests/test_star_history.py'
      - 'scripts/auto_release.py'
      - 'scripts/tests/test_auto_release.py'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'action.yml'
      - '.github/actions/keyhog/**'
      - 'benchmarks/Makefile'
      - 'benchmarks/bench/readme_matrix.py'
      - 'benchmarks/bench/tests/test_readme_matrix.py'
      - 'benchmarks/bench/scaling_matrix.py'
      - 'benchmarks/bench/tests/test_scaling_matrix.py'
      - 'benchmarks/reports/*matrix*'
      - 'benchmarks/reports/readme-scaling.json'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
      - 'scripts/gates/docs_truth.py'
      - 'scripts/gates/docs_links.py'
      - 'scripts/gates/action_docs_contract.py'
      - 'scripts/tests/test_action_docs_contract.py'
      - 'scripts/gates/workflow_docs_boundaries.py'
      - 'scripts/tests/test_workflow_docs_boundaries.py'
      - 'scripts/docs_site.py'
      - 'scripts/tests/test_docs_site.py'
      - 'metrics/stars.json'
      - 'metrics/stars.svg'
      - 'scripts/star_history.py'
      - 'scripts/tests/test_star_history.py'
      - 'scripts/auto_release.py'
      - 'scripts/tests/test_auto_release.py'
  workflow_dispatch:

# Don't queue parallel deploys -- the latest push wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'santhreal' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","linux","x64","axiomexec","keyhog"]') || 'ubuntu-24.04' }}
    # Per-job permissions: this repo rejects dispatch of any workflow that
    # declares a TOP-LEVEL `permissions:` block (1-3s exit, 0 jobs -- see
    # health-check.yml / keyhog.yml). Per-job is equivalent and dispatch-safe.
    permissions:
      contents: read
    steps:
      - name: Repair self-hosted workspace ownership
        if: runner.environment == 'self-hosted'
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          if [ -f "$GITHUB_WORKSPACE/.git/config" ]; then
            # Stale hooksPath=/dev/null breaks `git lfs install --local`
            # (mkdir /dev/null). Clear it and drop leftover LFS hook scripts.
            git config --file "$GITHUB_WORKSPACE/.git/config" --unset-all core.hooksPath || true
            rm -f "$GITHUB_WORKSPACE/.git/hooks/post-checkout" \
                  "$GITHUB_WORKSPACE/.git/hooks/post-commit" \
                  "$GITHUB_WORKSPACE/.git/hooks/post-merge"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify documentation truth
        run: python3 -B scripts/gates/docs_truth.py

      - name: Verify GitHub Action documentation contract
        run: |
          python3 -B scripts/gates/action_docs_contract.py
          python3 -B -m unittest scripts.tests.test_action_docs_contract

      - name: Verify workflow documentation boundaries
        run: |
          python3 -B scripts/gates/workflow_docs_boundaries.py
          python3 -B -m unittest scripts.tests.test_workflow_docs_boundaries

      - name: Verify Pages discovery metadata
        run: python3 -B -m unittest scripts.tests.test_docs_site

      - name: Verify repository star viewer
        run: |
          python3 -B scripts/star_history.py --check
          python3 -B -m unittest scripts.tests.test_star_history

      - name: Verify generated README benchmark panels
        run: make -C benchmarks readme-matrix-check

      - name: Install mdBook
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          mdbook_version=0.5.2
          mdbook_asset="mdbook-v${mdbook_version}-x86_64-unknown-linux-musl.tar.gz"
          mdbook_sha256=8e9d802bbecea34380aabfc65bec4fdba23c07453ef2c7e06fa34c282082e2c4
          curl -fsSL --retry 2 \
            "https://github.com/rust-lang/mdBook/releases/download/v${mdbook_version}/${mdbook_asset}" \
            -o "$RUNNER_TEMP/$mdbook_asset"
          printf '%s  %s\n' "$mdbook_sha256" "$RUNNER_TEMP/$mdbook_asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$mdbook_asset" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mdbook" --version

      - name: Test, build, and enhance site
        run: |
          cd docs
          mdbook test
          mdbook build
          cd ..
          python3 -B scripts/docs_site.py docs/book
          python3 -B scripts/gates/docs_links.py docs/book --site-prefix /keyhog/
          # mdbook emits to docs/book/. Move CNAME / .nojekyll if present.
          if [ -f docs/CNAME ]; then
            cp docs/CNAME docs/book/CNAME || true
          fi
          touch docs/book/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'santhreal' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","linux","x64","axiomexec","keyhog"]') || 'ubuntu-24.04' }}
    # Pages deploy needs write + OIDC; scoped to this job only (top-level
    # permissions is rejected at dispatch on this repo, which is why the
    # docs site stopped publishing).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
