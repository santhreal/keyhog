name: Publish crates.io

on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing exact release tag to publish or resume.'
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing exact release tag to publish or resume (for example, v0.5.45).'
        required: true
        type: string

# The reusable/manual recovery publisher needs only immutable source and release
# reads. Its crates.io credential is scoped to the final publish step.
permissions: {}

# Cargo publishes dependency tiers serially. Never cancel a run after an upload
# may have started, and never publish two workspace versions concurrently.
concurrency:
  group: keyhog-crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tagged crates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CC: ""
      CARGO_NET_RETRY: "10"
    steps:
      - name: Resolve exact release tag
        id: tag
        shell: bash
        env:
          KEYHOG_MANUAL_TAG: ${{ inputs.tag }}
          KEYHOG_EVENT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          if [[ "$KEYHOG_EVENT_ACTOR_ID" != "64453045" ]]; then
            echo "::error title=KeyHog::Crates.io publication is restricted to the repository owner's stable actor ID."
            exit 2
          fi
          tag="$KEYHOG_MANUAL_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=KeyHog::Crates.io publication requires an exact vMAJOR.MINOR.PATCH tag, optionally with a prerelease suffix."
            exit 2
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch exact annotated release-tag proof
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEYHOG_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ref_json="$RUNNER_TEMP/keyhog-publish-ref.json"
          tag_json="$RUNNER_TEMP/keyhog-publish-tag.json"
          main_ref_json="$RUNNER_TEMP/keyhog-publish-main-ref.json"
          compare_json="$RUNNER_TEMP/keyhog-publish-main-compare.json"
          signer_keys_json="$RUNNER_TEMP/keyhog-publish-signer-gpg-keys.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$KEYHOG_RELEASE_TAG" >"$ref_json"
          if ! tag_object="$(
            jq -er --arg ref "refs/tags/$KEYHOG_RELEASE_TAG" '
              select(.ref == $ref) |
              .object |
              select(.type == "tag") |
              .sha |
              select(test("^[0-9a-f]{40}$"))
            ' "$ref_json"
          )"; then
            echo "ERROR: crates.io publication requires an exact annotated Git tag" >&2
            exit 2
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" >"$tag_json"
          commit="$(
            jq -er '
              select(.object.type == "commit") |
              .object.sha |
              select(test("^[0-9a-f]{40}$"))
            ' "$tag_json"
          )"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" >"$main_ref_json"
          main_sha="$(
            jq -er '
              select(.ref == "refs/heads/main" and .object.type == "commit") |
              .object.sha |
              select(test("^[0-9a-f]{40}$"))
            ' "$main_ref_json"
          )"
          gh api "repos/$GITHUB_REPOSITORY/compare/$commit...$main_sha" >"$compare_json"
          gh api "users/santhreal/gpg_keys" >"$signer_keys_json"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'object=%s\n' "$tag_object" >> "$GITHUB_OUTPUT"
          printf 'ref_json=%s\n' "$ref_json" >> "$GITHUB_OUTPUT"
          printf 'tag_json=%s\n' "$tag_json" >> "$GITHUB_OUTPUT"
          printf 'main_ref_json=%s\n' "$main_ref_json" >> "$GITHUB_OUTPUT"
          printf 'compare_json=%s\n' "$compare_json" >> "$GITHUB_OUTPUT"
          printf 'signer_keys_json=%s\n' "$signer_keys_json" >> "$GITHUB_OUTPUT"

      - name: Check out hardened publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Prove tag and workspace version agree
        shell: bash
        env:
          KEYHOG_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          KEYHOG_RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          KEYHOG_EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          KEYHOG_EXPECTED_OBJECT: ${{ steps.source.outputs.object }}
          KEYHOG_AUTOMATION_SHA: ${{ github.workflow_sha }}
          KEYHOG_REF_JSON: ${{ steps.source.outputs.ref_json }}
          KEYHOG_TAG_JSON: ${{ steps.source.outputs.tag_json }}
          KEYHOG_MAIN_REF_JSON: ${{ steps.source.outputs.main_ref_json }}
          KEYHOG_COMPARE_JSON: ${{ steps.source.outputs.compare_json }}
          KEYHOG_EVENT_ACTOR_ID: ${{ github.actor_id }}
          KEYHOG_RELEASE_SIGNING_FINGERPRINT: ${{ vars.KEYHOG_RELEASE_SIGNING_FINGERPRINT }}
          KEYHOG_SIGNER_KEYS_JSON: ${{ steps.source.outputs.signer_keys_json }}
        run: |
          set -euo pipefail
          verified_object="$(
            python3 -B automation/scripts/verify_release_tag.py \
              --tag "$KEYHOG_RELEASE_TAG" \
              --expected-commit "$KEYHOG_EXPECTED_COMMIT" \
              --ref-json "$KEYHOG_REF_JSON" \
              --actor-id "$KEYHOG_EVENT_ACTOR_ID" \
              --tag-json "$KEYHOG_TAG_JSON" \
              --main-ref-json "$KEYHOG_MAIN_REF_JSON" \
              --compare-json "$KEYHOG_COMPARE_JSON" \
              --signer-keys-json "$KEYHOG_SIGNER_KEYS_JSON" \
              --authorized-fingerprint "$KEYHOG_RELEASE_SIGNING_FINGERPRINT" \
              --authorized-key "$GITHUB_WORKSPACE/automation/.github/release-signing-key.asc"
          )"
          if [[ "$verified_object" != "$KEYHOG_EXPECTED_OBJECT" ]]; then
            echo "ERROR: verified annotated tag object does not match the fetched ref" >&2
            exit 2
          fi
          automation_commit="$(git -C automation rev-parse HEAD)"
          if [[ "$automation_commit" != "$KEYHOG_AUTOMATION_SHA" ]]; then
            echo "ERROR: automation checkout $automation_commit does not match workflow revision $KEYHOG_AUTOMATION_SHA" >&2
            exit 2
          fi
          tag="$(bash automation/scripts/release-version.sh "$KEYHOG_RELEASE_TAG")"
          if [[ "$tag" != "$KEYHOG_RELEASE_TAG" ]]; then
            echo "ERROR: checked-out source rejected release tag $KEYHOG_RELEASE_TAG" >&2
            exit 2
          fi
          tagged_commit="$(git -C source rev-list -n 1 "$KEYHOG_RELEASE_TAG")"
          checked_out_commit="$(git -C source rev-parse HEAD)"
          checked_out_object="$(git -C source rev-parse "$KEYHOG_RELEASE_TAG")"
          if [[ "$tagged_commit" != "$checked_out_commit" ]]; then
            echo "ERROR: checkout $checked_out_commit does not match $KEYHOG_RELEASE_TAG at $tagged_commit" >&2
            exit 2
          fi
          if [[ "$checked_out_commit" != "$KEYHOG_EXPECTED_COMMIT" ]]; then
            echo "ERROR: tag $KEYHOG_RELEASE_TAG moved after proof: expected $KEYHOG_EXPECTED_COMMIT, checked out $checked_out_commit" >&2
            exit 2
          fi
          if [[ "$checked_out_object" != "$KEYHOG_EXPECTED_OBJECT" ]]; then
            echo "ERROR: tag ref $KEYHOG_RELEASE_TAG moved after proof: expected object $KEYHOG_EXPECTED_OBJECT, checked out $checked_out_object" >&2
            exit 2
          fi
          workspace_version="$(awk -F'"' '
            /^\[workspace\.package\]/ { in_pkg = 1; next }
            in_pkg && /^version[[:space:]]*=/ { print $2; exit }
          ' source/Cargo.toml)"
          if [[ "$workspace_version" != "$KEYHOG_RELEASE_VERSION" ]]; then
            echo "ERROR: tag $KEYHOG_RELEASE_TAG requires workspace version $KEYHOG_RELEASE_VERSION, found $workspace_version" >&2
            exit 2
          fi

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: '1.89'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: source

      - name: Install pinned release signature verifier
        shell: bash
        run: cargo install rsign2 --version 0.6.6 --locked

      - name: Require immutable published release verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEYHOG_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          KEYHOG_EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          KEYHOG_EXPECTED_TAG_OBJECT: ${{ steps.source.outputs.object }}
        run: |
          set -euo pipefail
          python3 -B automation/scripts/verify_published_release.py \
            --tag "$KEYHOG_RELEASE_TAG" \
            --expected-commit "$KEYHOG_EXPECTED_COMMIT" \
            --expected-tag-object "$KEYHOG_EXPECTED_TAG_OBJECT" \
            --download-dir "$RUNNER_TEMP/keyhog-published-release"

      - name: Require crates.io credential
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error title=KeyHog::CARGO_REGISTRY_TOKEN is not configured. Set the repository Actions secret before publishing crates."
            exit 2
          fi

      - name: Publish and verify every workspace crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_IO_POLL_INITIAL_SECONDS: "1"
          CRATES_IO_POLL_MAX_SECONDS: "15"
          CRATES_IO_POLL_TIMEOUT_SECONDS: "300"
          PACKAGE_BUILD_JOBS: "2"
        run: bash automation/scripts/publish.sh --source-root "$GITHUB_WORKSPACE/source"
