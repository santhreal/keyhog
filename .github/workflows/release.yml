name: Automatic crates.io release

# Two-phase release:
# 1) workflow_run after green CI on main → bump versions, commit, tag, push.
# 2) push of that v* tag (or workflow_dispatch of an existing tag) → OIDC
#    crates.io publish. Trusted Publishing rejects `workflow_run` JWTs, so the
#    publish job MUST run under `push` / `workflow_dispatch` only.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.5.69)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: keyhog-auto-release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump, changelog, and tag
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Prepare patch release
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [[ "$current" == "$CI_HEAD_SHA" ]]; then
            summary="$(git show -s --format=%s "$CI_HEAD_SHA")"
            author="$(git show -s --format=%ae "$CI_HEAD_SHA")"
            if [[ "$author" == "41898282+github-actions[bot]@users.noreply.github.com" && "$summary" =~ ^release:\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Automatic release commits do not create another release."
              exit 0
            fi
            result="$(python3 -B scripts/auto_release.py --summary "$summary" --apply)"
            version="${result%%$'\t'*}"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -u
            git commit -m "release: v${version}"
            git tag "v${version}"
            git push --atomic origin HEAD:main "refs/tags/v${version}"
          elif [[ "$(git rev-parse HEAD^)" == "$CI_HEAD_SHA" && "$(git show -s --format=%s HEAD)" =~ ^release:\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release commit already exists for ${CI_HEAD_SHA}; tag push publishes."
            exit 0
          else
            echo "A newer main push superseded ${CI_HEAD_SHA}; its successful CI run will release it."
            exit 0
          fi

  publish:
    name: Publish crates.io packages
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish non-semver tag: ${tag}"
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Overlay current publish script from default branch
        shell: bash
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch --depth=1 origin "$default_branch"
          git checkout "origin/${default_branch}" -- scripts/publish.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Generate release integrity receipt
        run: >-
          python3 -B scripts/release_integrity_receipt.py
          --commit "$(git rev-parse HEAD)"
          --version "${{ steps.tag.outputs.version }}"
          --output release-integrity.json

      - name: Authenticate to crates.io via Trusted Publishing
        id: crates-io-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates.io packages
        run: bash scripts/publish.sh
        env:
          # Prefer OIDC Trusted Publishing; fall back to the repo token while
          # crates.io publisher configs are missing/misaligned for this workflow.
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

      - name: Upload release integrity receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyhog-release-integrity-v${{ steps.tag.outputs.version }}
          path: release-integrity.json
          if-no-files-found: error
          retention-days: 90
