name: Release

# Exact tag pushes preserve the release ref and commit in GitHub's OIDC
# provenance context. The read-only ci-verdict job waits for the sibling CI run
# for that same tag commit and requires its explicit complete verdict before any
# build, attestation, secret, or irreversible publication job can start. Manual
# recovery must be dispatched from the same signed tag and passes the identical
# CI proof.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.5.7). Select the same tag under Use workflow from.'
        required: true


# Deny every token capability unless a job opts into the exact operations it
# performs. Tag/ref and CI-run validation happens in the read-only first job.
permissions: {}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  CC: ""
  # Survive intermittent mid-stream crates.io download drops on hosted runners
  # (curl [55] SSL_ERROR_SYSCALL); cargo's default of 3 retries is not enough.
  CARGO_NET_RETRY: "10"

jobs:
  ci-verdict:
    name: Validate exact successful CI verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.verdict.outputs.tag }}
      commit: ${{ steps.verdict.outputs.commit }}
      tag_object: ${{ steps.verdict.outputs.tag_object }}
    steps:
      - name: Check out pinned signed-tag verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
      - name: Bind completed CI run to immutable tag commit
        id: verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEYHOG_TRIGGER_EVENT: ${{ github.event_name }}
          KEYHOG_MANUAL_TAG: ${{ inputs.tag }}
          KEYHOG_MANUAL_REF: ${{ github.ref }}
          KEYHOG_MANUAL_SHA: ${{ github.sha }}
          KEYHOG_EVENT_REF: ${{ github.ref }}
          KEYHOG_EVENT_SHA: ${{ github.sha }}
          KEYHOG_EVENT_ACTOR_ID: ${{ github.actor_id }}
          KEYHOG_RELEASE_SIGNING_FINGERPRINT: ${{ vars.KEYHOG_RELEASE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ "$KEYHOG_EVENT_ACTOR_ID" != "64453045" ]]; then
            echo "ERROR: release entry is restricted to the repository owner's stable actor ID" >&2
            exit 2
          fi
          if [[ "$KEYHOG_TRIGGER_EVENT" == "push" ]]; then
            tag="${KEYHOG_EVENT_REF##refs/tags/}"
            commit="$KEYHOG_EVENT_SHA"
          elif [[ "$KEYHOG_TRIGGER_EVENT" == "workflow_dispatch" ]]; then
            tag="$KEYHOG_MANUAL_TAG"
            commit="$KEYHOG_MANUAL_SHA"
          else
            echo "ERROR: unsupported release trigger $KEYHOG_TRIGGER_EVENT" >&2
            exit 2
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ||
                ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release source must name an exact semantic-version tag and lowercase commit SHA" >&2
            exit 2
          fi

          ref_json="$RUNNER_TEMP/keyhog-release-ref.json"
          tag_json="$RUNNER_TEMP/keyhog-release-tag.json"
          main_ref_json="$RUNNER_TEMP/keyhog-release-main-ref.json"
          compare_json="$RUNNER_TEMP/keyhog-release-main-compare.json"
          signer_keys_json="$RUNNER_TEMP/keyhog-release-signer-gpg-keys.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >"$ref_json"
          if ! tag_object="$(
            jq -er --arg ref "refs/tags/$tag" '
              select(.ref == $ref) |
              .object |
              select(.type == "tag") |
              .sha |
              select(test("^[0-9a-f]{40}$"))
            ' "$ref_json"
          )"; then
            echo "ERROR: refs/tags/$tag is not an exact annotated Git tag object" >&2
            exit 2
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" >"$tag_json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" >"$main_ref_json"
          main_sha="$(
            jq -er '
              select(.ref == "refs/heads/main" and .object.type == "commit") |
              .object.sha |
              select(test("^[0-9a-f]{40}$"))
            ' "$main_ref_json"
          )"
          gh api "repos/$GITHUB_REPOSITORY/compare/$commit...$main_sha" >"$compare_json"
          gh api "users/santhreal/gpg_keys" >"$signer_keys_json"
          verified_object="$(
            python3 -B "$GITHUB_WORKSPACE/automation/scripts/verify_release_tag.py" \
              --tag "$tag" \
              --actor-id "$KEYHOG_EVENT_ACTOR_ID" \
              --expected-commit "$commit" \
              --ref-json "$ref_json" \
              --tag-json "$tag_json" \
              --main-ref-json "$main_ref_json" \
              --compare-json "$compare_json" \
              --signer-keys-json "$signer_keys_json" \
              --authorized-fingerprint "$KEYHOG_RELEASE_SIGNING_FINGERPRINT" \
              --authorized-key "$GITHUB_WORKSPACE/automation/.github/release-signing-key.asc"
          )"
          if [[ "$verified_object" != "$tag_object" ]]; then
            echo "ERROR: signed tag verifier did not bind the requested tag object" >&2
            exit 2
          fi
          tag_commit="$commit"

          if [[ "$KEYHOG_EVENT_REF" != "refs/tags/$tag" ||
                "$KEYHOG_EVENT_SHA" != "$tag_commit" ]]; then
            echo "ERROR: release must run from refs/tags/$tag at signed commit $tag_commit, not ambient $KEYHOG_EVENT_REF at $KEYHOG_EVENT_SHA" >&2
            exit 2
          fi

          run_id=""
          for _attempt in $(seq 1 360); do
            runs="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$tag_commit&event=push&per_page=100"
            )"
            state="$(
              jq -r --arg tag "$tag" --arg sha "$tag_commit" '
                [.workflow_runs[]
                 | select(.head_branch == $tag and
                          .head_sha == $sha and
                          .event == "push" and
                          .path == ".github/workflows/ci.yml")]
                | sort_by(.run_attempt, .id)
                | last
                | if . == null then "missing"
                  elif .status != "completed" then "pending"
                  elif .conclusion == "success" then "success:\(.id)"
                  else "failure:\(.conclusion):\(.id)"
                  end
              ' <<<"$runs"
            )"
            case "$state" in
              success:*)
                run_id="${state#success:}"
                break
                ;;
              failure:*)
                echo "ERROR: exact CI run for $tag at $tag_commit completed unsuccessfully: $state" >&2
                exit 2
                ;;
              missing|pending)
                sleep 30
                ;;
              *)
                echo "ERROR: malformed CI run state for $tag at $tag_commit: $state" >&2
                exit 2
                ;;
            esac
          done
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: no immutable successful CI run ID is bound to $tag at $tag_commit" >&2
            exit 2
          fi

          run="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          )"
          jq -e \
            --arg tag "$tag" \
            --arg sha "$tag_commit" \
            '.head_branch == $tag and
             .head_sha == $sha and
             .event == "push" and
             .status == "completed" and
             .conclusion == "success" and
             .path == ".github/workflows/ci.yml"' \
            <<<"$run" >/dev/null

          jobs="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100"
          )"
          jq -e '
            (.total_count == (.jobs | length)) and
            ([.jobs[]
              | select(.name == "CI verdict" and
                       .status == "completed" and
                       .conclusion == "success")]
             | length == 1)
          ' <<<"$jobs" >/dev/null || {
            echo "ERROR: CI run $run_id lacks one successful complete CI verdict job" >&2
            exit 2
          }

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
          printf 'tag_object=%s\n' "$tag_object" >> "$GITHUB_OUTPUT"
          echo "Validated CI run $run_id for refs/tags/$tag at $tag_commit"

  build:
    name: Build ${{ matrix.asset }}
    needs: ci-verdict
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: keyhog-linux-x86_64
            # Archive the exact pinned Hyperscan build dependency into the Linux
            # executable. Runtime consumers never install or trust libhs from apt.
            install: |
              for i in 1 2 3 4 5; do
                sudo apt-get update -qq && \
                  sudo apt-get install -y \
                    libhyperscan-dev=5.4.2-2 \
                    pkg-config=1.8.1-2build1 && break
                sleep $((i * 2))
                if [ "$i" -eq 5 ]; then exit 1; fi
              done
            features: '--features static-hyperscan'
            artifact_features: 'ml,entropy,decode,multiline,simdsieve,simd'
          # macOS release assets ship native Metal and portable WGPU without a
          # Homebrew Vectorscan dependency. The `portable` alias retains every
          # source and verification surface; the additive `gpu` feature enables
          # the backend-neutral GPU pipeline without enabling Hyperscan.
          - os: macos-15
            asset: keyhog-macos-aarch64
            install: ''
            features: '--no-default-features --features portable,gpu'
            artifact_features: 'ml,entropy,decode,multiline'
          # macOS x86_64 (Intel): same feature subset as Apple Silicon.
          # macos-15-intel is GitHub's supported x86_64 runner after the
          # macos-13 retirement (2026-04). actionlint flags `macos-13`
          # as an unknown label and the matrix arm silently fails to
          # dispatch, which loses the Intel-mac asset on every tag push.
          - os: macos-15-intel
            asset: keyhog-macos-x86_64
            install: ''
            features: '--no-default-features --features portable,gpu'
            artifact_features: 'ml,entropy,decode,multiline'
          # Windows MSVC: same portable subset. Hyperscan is not
          # shipped on Windows, and daemon IPC is Unix-socket-only
          # (already gated with #[cfg(unix)]), so the portable
          # surface compiles natively here.
          - os: windows-2025
            asset: keyhog-windows-x86_64.exe
            install: ''
            features: '--no-default-features --features portable'
            artifact_features: 'ml,entropy,decode,multiline'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-verdict.outputs.commit }}
          fetch-depth: 0
      - name: Prove checkout matches validated tag commit
        shell: bash
        env:
          KEYHOG_RELEASE_COMMIT: ${{ needs.ci-verdict.outputs.commit }}
          KEYHOG_RELEASE_TAG: ${{ needs.ci-verdict.outputs.tag }}
          KEYHOG_RELEASE_TAG_OBJECT: ${{ needs.ci-verdict.outputs.tag_object }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tagged="$(git rev-list -n 1 "$KEYHOG_RELEASE_TAG")"
          tag_object="$(git rev-parse "$KEYHOG_RELEASE_TAG")"
          if [[ "$actual" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tagged" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tag_object" != "$KEYHOG_RELEASE_TAG_OBJECT" ]]; then
            echo "ERROR: build checkout is not the validated refs/tags/$KEYHOG_RELEASE_TAG commit $KEYHOG_RELEASE_COMMIT" >&2
            exit 2
          fi

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: '1.89'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install build deps
        if: matrix.install != ''
        shell: bash
        run: ${{ matrix.install }}

      - name: Stage exact static Hyperscan build inputs
        if: matrix.asset == 'keyhog-linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keyhog-hyperscan-static"
          mkdir -p "$root/include" "$root/lib/pkgconfig"
          cp -a /usr/include/hs "$root/include/"
          cp /usr/lib/x86_64-linux-gnu/libhs.a "$root/lib/libhs.a"
          cp /usr/lib/x86_64-linux-gnu/pkgconfig/libhs.pc \
            "$root/lib/pkgconfig/libhs.pc"
          printf 'HYPERSCAN_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Acquire exact locked Cargo sources
        shell: bash
        run: cargo fetch --locked

      # Freeze both payload closures after network acquisition but before any
      # cargo build/run can execute an untrusted build.rs.
      - name: Record exact payload dependency graphs
        env:
          KEYHOG_RELEASE_TAG_OBJECT: ${{ needs.ci-verdict.outputs.tag_object }}
        shell: bash
        run: |
          for asset in \
            '${{ matrix.asset }}' \
            '${{ matrix.asset }}.gpu-literals.tar.gz'; do
            python3 scripts/release_sbom.py dependency-receipt \
              --source-dir . \
              --asset-name "$asset" \
              --tag '${{ needs.ci-verdict.outputs.tag }}' \
              --output "$asset.dependencies.json"
          done

      - name: Attest dependency receipts before build scripts execute
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            ${{ matrix.asset }}.dependencies.json
            ${{ matrix.asset }}.gpu-literals.tar.gz.dependencies.json

      - name: Record exact static native build inputs
        if: matrix.asset == 'keyhog-linux-x86_64'
        shell: bash
        env:
          KEYHOG_RELEASE_TAG_OBJECT: ${{ needs.ci-verdict.outputs.tag_object }}
        run: |
          python3 scripts/release_sbom.py native-build-receipt \
            --source-dir . \
            --tag '${{ needs.ci-verdict.outputs.tag }}' \
            --hyperscan-root "$HYPERSCAN_ROOT" \
            --output keyhog-linux-x86_64.native-build.json

      - name: Attest static native inputs before linking
        if: matrix.asset == 'keyhog-linux-x86_64'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: keyhog-linux-x86_64.native-build.json

      - name: Prepare exact native linker input capture
        if: matrix.asset == 'keyhog-linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$RUNNER_TEMP/keyhog-linker-capture"
          capture="$RUNNER_TEMP/keyhog-linked-native.rlib"
          record="$RUNNER_TEMP/keyhog-linked-native.path"
          rustc_temp="$RUNNER_TEMP/keyhog-rustc-temp"
          for path in "$wrapper" "$capture" "$record" "$rustc_temp"; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "ERROR: native linker capture path already exists: $path" >&2
              exit 2
            fi
          done
          mkdir "$rustc_temp"
          cat >"$wrapper" <<'LINKER'
          #!/usr/bin/env bash
          set -euo pipefail
          native=""
          for argument in "$@"; do
            case "$argument" in
              "$KEYHOG_RUSTC_TEMP_ROOT"/rustc*/libhyperscan_sys-*.rlib)
                if [[ -n "$native" && "$native" != "$argument" ]]; then
                  echo "ERROR: linker received multiple bundled Hyperscan archives" >&2
                  exit 2
                fi
                native="$argument"
                ;;
            esac
          done
          if [[ -n "$native" ]]; then
            if [[ -L "$native" || ! -f "$native" ]]; then
              echo "ERROR: bundled Hyperscan linker input is not a regular file" >&2
              exit 2
            fi
            native="$(readlink -f -- "$native")"
            if [[ -e "$KEYHOG_LINKED_NATIVE_CAPTURE" ||
                  -L "$KEYHOG_LINKED_NATIVE_CAPTURE" ]]; then
              if [[ -L "$KEYHOG_LINKED_NATIVE_CAPTURE" ||
                    ! -f "$KEYHOG_LINKED_NATIVE_CAPTURE" ||
                    -L "$KEYHOG_LINKED_NATIVE_PATH" ||
                    ! -f "$KEYHOG_LINKED_NATIVE_PATH" ]]; then
                echo "ERROR: captured native linker proof is not regular" >&2
                exit 2
              fi
              cmp -s "$native" "$KEYHOG_LINKED_NATIVE_CAPTURE" || {
                echo "ERROR: bundled Hyperscan linker input changed across links" >&2
                exit 2
              }
              [[ "$(cat "$KEYHOG_LINKED_NATIVE_PATH")" == "$native" ]] || {
                echo "ERROR: bundled Hyperscan linker path changed across links" >&2
                exit 2
              }
            else
              if [[ -e "$KEYHOG_LINKED_NATIVE_PATH" ||
                    -L "$KEYHOG_LINKED_NATIVE_PATH" ]]; then
                echo "ERROR: native linker path record appeared before capture" >&2
                exit 2
              fi
              install -m 0600 "$native" "$KEYHOG_LINKED_NATIVE_CAPTURE"
              printf '%s\n' "$native" >"$KEYHOG_LINKED_NATIVE_PATH"
              chmod 0600 "$KEYHOG_LINKED_NATIVE_PATH"
            fi
          fi
          exec /usr/bin/cc "$@"
          LINKER
          chmod 0500 "$wrapper"
          {
            printf 'KEYHOG_LINKER_WRAPPER=%s\n' "$wrapper"
            printf 'KEYHOG_LINKED_NATIVE_CAPTURE=%s\n' "$capture"
            printf 'KEYHOG_LINKED_NATIVE_PATH=%s\n' "$record"
            printf 'KEYHOG_RUSTC_TEMP_ROOT=%s\n' "$rustc_temp"
            printf 'TMPDIR=%s\n' "$rustc_temp"
          } >>"$GITHUB_ENV"

      - name: Build keyhog
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.asset }}' == 'keyhog-linux-x86_64' ]]; then
            export RUSTFLAGS="${RUSTFLAGS:-} -C linker=$KEYHOG_LINKER_WRAPPER -C link-arg=-Wl,-Map=$GITHUB_WORKSPACE/keyhog-linux-x86_64.link.map"
          fi
          cargo build --locked --release -p keyhog ${{ matrix.features }}
          if [[ '${{ matrix.asset }}' == 'keyhog-linux-x86_64' ]]; then
            for path in "$KEYHOG_LINKED_NATIVE_CAPTURE" "$KEYHOG_LINKED_NATIVE_PATH"; do
              if [[ -L "$path" || ! -s "$path" ]]; then
                echo "ERROR: exact native linker input was not captured: $path" >&2
                exit 2
              fi
            done
          fi
      - name: Record exact Linux linkage closure
        if: matrix.asset == 'keyhog-linux-x86_64'
        env:
          KEYHOG_RELEASE_TAG_OBJECT: ${{ needs.ci-verdict.outputs.tag_object }}
        shell: bash
        run: |
          python3 scripts/release_sbom.py native-link-receipt \
            --source-dir . \
            --tag '${{ needs.ci-verdict.outputs.tag }}' \
            --binary target/release/keyhog \
            --build-receipt keyhog-linux-x86_64.native-build.json \
            --link-map keyhog-linux-x86_64.link.map \
            --linked-native-archive "$KEYHOG_LINKED_NATIVE_CAPTURE" \
            --linked-native-path "$KEYHOG_LINKED_NATIVE_PATH" \
            --output keyhog-linux-x86_64.native-link.json

      # Attest the just-derived bytes before any further tag-controlled Cargo
      # execution can mutate them. Signing later verifies this exact subject.
      - name: Attest finalized static native linkage
        if: matrix.asset == 'keyhog-linux-x86_64'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: keyhog-linux-x86_64.native-link.json

      - name: Build GPU literal artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="${{ matrix.asset }}.gpu-literals"
          rm -rf "$bundle_dir" "$bundle_dir.tar.gz"
          cargo run --locked --release \
            -p keyhog-scanner \
            --bin keyhog-scanner-artifacts \
            --no-default-features \
            --features "${{ matrix.artifact_features }}" \
            -- \
            --out-dir "$bundle_dir"
          PYTHONPATH="$GITHUB_WORKSPACE" python3 -B -c \
            'import sys; from pathlib import Path; from scripts.publish_release_assets import create_deterministic_archive; create_deterministic_archive(Path(sys.argv[1]), Path(sys.argv[2]))' \
            "$bundle_dir" "$bundle_dir.tar.gz"

      - name: Stage binary
        env:
          KEYHOG_RELEASE_TAG: ${{ needs.ci-verdict.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # cargo writes `keyhog.exe` on Windows hosts; `keyhog`
          # elsewhere. Either source is fine; the destination name
          # comes from matrix.asset (already carries .exe on Windows).
          if [[ -f target/release/keyhog.exe ]]; then
            cp target/release/keyhog.exe "${{ matrix.asset }}"
          else
            cp target/release/keyhog "${{ matrix.asset }}"
          fi
          reported="$("./${{ matrix.asset }}" --version)"
          expected="KeyHog ${KEYHOG_RELEASE_TAG}"
          if [[ "$reported" != *"$expected"* ]]; then
            echo "ERROR: staged binary version does not match release tag: expected '$expected', got '$reported'" >&2
            exit 1
          fi
          if [[ '${{ matrix.asset }}' == "keyhog-linux-x86_64" ]]; then
            linkage="$(ldd "./${{ matrix.asset }}")"
            printf '%s\n' "$linkage"
            if grep -Eiq 'libhs|libhyperscan' <<<"$linkage"; then
              echo "ERROR: Linux release payload retains a mutable Hyperscan runtime dependency" >&2
              exit 1
            fi
          fi
          # Per-asset SHA256 checksums. install.sh verifies the binary checksum
          # and the Rust update/repair path verify both payload checksums and
          # signatures before installing the binary and seeding the scanner cache.
          assets=(
            "${{ matrix.asset }}"
            "${{ matrix.asset }}.gpu-literals.tar.gz"
          )
          # Portable across the three runner OSes: ubuntu has sha256sum,
          # macOS has shasum, Git Bash on Windows ships sha256sum via msys2.
          for asset in "${assets[@]}"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$asset" > "$asset.sha256"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$asset" > "$asset.sha256"
            else
              echo "ERROR: no sha256 tool found on $(uname -s)" >&2
              exit 1
            fi
            cat "$asset.sha256"
          done


      - name: Attest immutable release payload provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.gpu-literals.tar.gz

      - name: Stage unsigned release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
            ${{ matrix.asset }}.gpu-literals.tar.gz
            ${{ matrix.asset }}.gpu-literals.tar.gz.sha256
            ${{ matrix.asset }}.dependencies.json
            ${{ matrix.asset }}.gpu-literals.tar.gz.dependencies.json
            ${{ matrix.asset }}.native-build.json
            ${{ matrix.asset }}.native-link.json

  installers:
    name: Stage versioned installers
    needs: ci-verdict
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-verdict.outputs.commit }}
          fetch-depth: 0
      - name: Prove and stage installer bytes
        shell: bash
        env:
          KEYHOG_RELEASE_COMMIT: ${{ needs.ci-verdict.outputs.commit }}
          KEYHOG_RELEASE_TAG: ${{ needs.ci-verdict.outputs.tag }}
          KEYHOG_RELEASE_TAG_OBJECT: ${{ needs.ci-verdict.outputs.tag_object }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tagged="$(git rev-list -n 1 "$KEYHOG_RELEASE_TAG")"
          tag_object="$(git rev-parse "$KEYHOG_RELEASE_TAG")"
          if [[ "$actual" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tagged" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tag_object" != "$KEYHOG_RELEASE_TAG_OBJECT" ]]; then
            echo "ERROR: installer checkout is not the validated refs/tags/$KEYHOG_RELEASE_TAG commit $KEYHOG_RELEASE_COMMIT" >&2
            exit 2
          fi
          for installer in install.sh install.ps1; do
            test -s "$installer"
            sha256sum "$installer" > "$installer.sha256"
          done

      - name: Attest installer provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            install.sh
            install.ps1

      - name: Stage unsigned installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-installers
          if-no-files-found: error
          retention-days: 1
          path: |
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256

  # Sign every staged binary, sidecar, and installer with the keyhog minisign secret key. Runs once
  # on a single runner after all build arms finish, so the signing secret is
  # exposed to exactly one job. `keyhog update` verifies these `.minisig`
  # files against the embedded public key (installer::RELEASE_PUBLIC_KEY)
  # before self-replacing.
  sign:
    name: Sign release assets
    needs: [ci-verdict, build, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create/reuse one immutable draft and upload its signed assets
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-verdict.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out hardened release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
          fetch-depth: 1
      - name: Prove signing source matches validated tag
        shell: bash
        env:
          KEYHOG_RELEASE_COMMIT: ${{ needs.ci-verdict.outputs.commit }}
          KEYHOG_RELEASE_TAG: ${{ needs.ci-verdict.outputs.tag }}
          KEYHOG_RELEASE_TAG_OBJECT: ${{ needs.ci-verdict.outputs.tag_object }}
        run: |
          set -euo pipefail
          actual="$(git -C source rev-parse HEAD)"
          tagged="$(git -C source rev-list -n 1 "$KEYHOG_RELEASE_TAG")"
          tag_object="$(git -C source rev-parse "$KEYHOG_RELEASE_TAG")"
          if [[ "$actual" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tagged" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tag_object" != "$KEYHOG_RELEASE_TAG_OBJECT" ]]; then
            echo "ERROR: signing checkout is not the validated refs/tags/$KEYHOG_RELEASE_TAG commit $KEYHOG_RELEASE_COMMIT" >&2
            exit 2
          fi

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: '1.89'
      - name: Acquire exact locked Cargo sources for offline SBOM derivation
        shell: bash
        working-directory: source
        run: cargo fetch --locked
      - name: Require fresh external release work directories
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "$RUNNER_TEMP/keyhog-release-dist" \
            "$RUNNER_TEMP/keyhog-release-signed"; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "ERROR: external release work path already exists: $path" >&2
              exit 2
            fi
          done
      - name: Download staged release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-*
          path: ${{ runner.temp }}/keyhog-release-dist
          merge-multiple: true
      - name: Install rsign2
        shell: bash
        run: cargo install rsign2 --version 0.6.6 --locked

      - name: Generate, sign, and privately stage the exact release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          KEYHOG_MINISIGN_SECRET_KEY: ${{ secrets.KEYHOG_MINISIGN_SECRET_KEY }}
          KEYHOG_RELEASE_TAG: ${{ needs.ci-verdict.outputs.tag }}
          KEYHOG_RELEASE_COMMIT: ${{ needs.ci-verdict.outputs.commit }}
          KEYHOG_RELEASE_TAG_OBJECT: ${{ needs.ci-verdict.outputs.tag_object }}
          KEYHOG_WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYHOG_MINISIGN_SECRET_KEY:-}" ]]; then
            echo "ERROR: KEYHOG_MINISIGN_SECRET_KEY secret is not configured; cannot sign." >&2
            echo "Set it with: gh secret set KEYHOG_MINISIGN_SECRET_KEY --repo $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          tag="$KEYHOG_RELEASE_TAG"
          workdir="$RUNNER_TEMP/keyhog-release-signed"
          mkdir -p "$workdir"
          cp -a "$RUNNER_TEMP/keyhog-release-dist/." "$workdir/"
          python3 "$GITHUB_WORKSPACE/automation/scripts/release_notes.py" \
            --tag "$tag" \
            --changelog "$GITHUB_WORKSPACE/source/CHANGELOG.md" \
            --output "$workdir/release-notes.md"
          bases=(
            keyhog-linux-x86_64
            keyhog-macos-aarch64
            keyhog-macos-x86_64
            keyhog-windows-x86_64.exe
          )
          expected=(
            install.sh install.sh.sha256
            install.ps1 install.ps1.sha256
          )
          payloads=(install.sh install.ps1)
          for base in "${bases[@]}"; do
            payloads+=("$base" "$base.gpu-literals.tar.gz")
            expected+=(
              "$base" "$base.sha256"
              "$base.gpu-literals.tar.gz" "$base.gpu-literals.tar.gz.sha256"
            )
          done
          for asset in "${expected[@]}"; do
            if [[ ! -f "$workdir/$asset" ]]; then
              echo "ERROR: staged release manifest is missing $asset" >&2
              exit 1
            fi
          done
          receipts=()
          for base in "${bases[@]}"; do
            receipts+=(
              "$base.dependencies.json"
              "$base.gpu-literals.tar.gz.dependencies.json"
            )
          done
          receipts+=(
            keyhog-linux-x86_64.native-build.json
            keyhog-linux-x86_64.native-link.json
          )
          for receipt in "${receipts[@]}"; do
            if [[ ! -f "$workdir/$receipt" ]]; then
              echo "ERROR: staged SBOM dependency receipt is missing $receipt" >&2
              exit 1
            fi
            gh attestation verify "$workdir/$receipt" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$KEYHOG_WORKFLOW_SHA" \
              --source-ref "refs/tags/$tag" \
              --source-digest "$KEYHOG_RELEASE_COMMIT" \
              --deny-self-hosted-runners >/dev/null
          done
          python3 "$GITHUB_WORKSPACE/automation/scripts/release_sbom.py" manifest \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --asset-dir "$workdir" \
            --dependency-dir "$workdir" \
            --tag "$tag" \
            --source-commit "$KEYHOG_RELEASE_COMMIT" \
            --output "$workdir/release-sbom-manifest.json"
          python3 "$GITHUB_WORKSPACE/automation/scripts/release_sbom.py" generate \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --asset-dir "$workdir" \
            --dependency-dir "$workdir" \
            --manifest "$workdir/release-sbom-manifest.json" \
            --output-dir "$workdir"
          python3 "$GITHUB_WORKSPACE/automation/scripts/release_sbom.py" verify \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --asset-dir "$workdir" \
            --dependency-dir "$workdir" \
            --manifest "$workdir/release-sbom-manifest.json" \
            --output-dir "$workdir"

          cd "$workdir"
          sboms=(install.sh.spdx.json install.ps1.spdx.json)
          for payload in "${payloads[@]}"; do
            if [[ "$payload" != install.sh && "$payload" != install.ps1 ]]; then
              sboms+=("$payload.spdx.json")
            fi
          done
          for sbom in "${sboms[@]}"; do
            expected+=("$sbom" "$sbom.sha256")
          done

          # The stored secret is base64 of the minisign .key file.
          printf '%s' "$KEYHOG_MINISIGN_SECRET_KEY" | base64 -d > sec.key
          trap 'shred -u sec.key 2>/dev/null || rm -f sec.key' EXIT
          signed_payloads=("${payloads[@]}" "${sboms[@]}")
          for payload in "${signed_payloads[@]}"; do
            rsign sign -W -s sec.key -x "$payload.minisig" "$payload" </dev/null
            echo "signed $payload.minisig"
          done

          # Mutate only an immutable-ID draft here. The signed receipt binds
          # that private release to its exact tag commit and downloaded asset
          # hashes; no public transition occurs in the signing job.
          final=("${expected[@]}")
          for payload in "${signed_payloads[@]}"; do
            final+=("$payload.minisig")
          done
          if [[ "${#final[@]}" -ne 60 ]]; then
            echo "ERROR: release inventory has ${#final[@]} assets; expected exact 60" >&2
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/automation/scripts/publish_release_assets.py" prepare \
            --tag "$tag" \
            --commit "$KEYHOG_RELEASE_COMMIT" \
            --tag-object "$KEYHOG_RELEASE_TAG_OBJECT" \
            --repository "$GITHUB_REPOSITORY" \
            --notes-file "$workdir/release-notes.md" \
            --receipt "$workdir/release-publication.json" \
            "${final[@]}"
          rsign sign -W -s sec.key \
            -x "$workdir/release-publication.json.minisig" \
            "$workdir/release-publication.json" </dev/null

      - name: Attest generated SPDX release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/keyhog-release-signed/*.spdx.json

      - name: Preserve signed immutable-ID publication proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-proof
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/keyhog-release-signed/release-publication.json
            ${{ runner.temp }}/keyhog-release-signed/release-publication.json.minisig

      - name: Preserve signed Linux candidate for pre-publication smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-linux-candidate
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/keyhog-release-signed/install.sh
            ${{ runner.temp }}/keyhog-release-signed/install.sh.sha256
            ${{ runner.temp }}/keyhog-release-signed/install.sh.minisig
            ${{ runner.temp }}/keyhog-release-signed/keyhog-linux-x86_64
            ${{ runner.temp }}/keyhog-release-signed/keyhog-linux-x86_64.sha256
            ${{ runner.temp }}/keyhog-release-signed/keyhog-linux-x86_64.minisig
            ${{ runner.temp }}/keyhog-release-signed/keyhog-linux-x86_64.gpu-literals.tar.gz
            ${{ runner.temp }}/keyhog-release-signed/keyhog-linux-x86_64.gpu-literals.tar.gz.sha256
            ${{ runner.temp }}/keyhog-release-signed/keyhog-linux-x86_64.gpu-literals.tar.gz.minisig

      - name: Preserve complete signed SBOM candidate for smoke validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-sbom-candidate
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/keyhog-release-signed/release-sbom-manifest.json
            ${{ runner.temp }}/keyhog-release-signed/install.sh
            ${{ runner.temp }}/keyhog-release-signed/install.ps1
            ${{ runner.temp }}/keyhog-release-signed/keyhog-linux-x86_64
            ${{ runner.temp }}/keyhog-release-signed/keyhog-macos-aarch64
            ${{ runner.temp }}/keyhog-release-signed/keyhog-macos-x86_64
            ${{ runner.temp }}/keyhog-release-signed/keyhog-windows-x86_64.exe
            ${{ runner.temp }}/keyhog-release-signed/*.gpu-literals.tar.gz
            ${{ runner.temp }}/keyhog-release-signed/*.dependencies.json
            ${{ runner.temp }}/keyhog-release-signed/*.native-build.json
            ${{ runner.temp }}/keyhog-release-signed/*.native-link.json
            ${{ runner.temp }}/keyhog-release-signed/*.spdx.json
            ${{ runner.temp }}/keyhog-release-signed/*.spdx.json.sha256
            ${{ runner.temp }}/keyhog-release-signed/*.spdx.json.minisig

  smoke:
    name: Smoke staged release candidate
    needs: [ci-verdict, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-verdict.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check out hardened release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: '1.89'
      - name: Acquire exact locked Cargo sources for offline SBOM verification
        shell: bash
        working-directory: source
        run: cargo fetch --locked

      - name: Require fresh external candidate work directories
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "$RUNNER_TEMP/keyhog-linux-candidate" \
            "$RUNNER_TEMP/keyhog-sbom-candidate"; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "ERROR: external candidate work path already exists: $path" >&2
              exit 2
            fi
          done
      - name: Download signed Linux candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-linux-candidate
          path: ${{ runner.temp }}/keyhog-linux-candidate
      - name: Download complete signed SBOM candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-sbom-candidate
          path: ${{ runner.temp }}/keyhog-sbom-candidate


      - name: Install candidate verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y jq minisign
      - name: Verify complete signed SPDX candidate
        shell: bash
        env:
          KEYHOG_MINISIGN_PUBLIC_KEY: RWTPnJ/p6xVJ3TJIxr+ZVHMD/MTHWZhsdE38Go/oD3DYBoi4bePR55go
          KEYHOG_RELEASE_COMMIT: ${{ needs.ci-verdict.outputs.commit }}
          KEYHOG_RELEASE_TAG: ${{ needs.ci-verdict.outputs.tag }}
          KEYHOG_RELEASE_TAG_OBJECT: ${{ needs.ci-verdict.outputs.tag_object }}
        run: |
          set -euo pipefail
          actual="$(git -C source rev-parse HEAD)"
          tagged="$(git -C source rev-list -n 1 "$KEYHOG_RELEASE_TAG")"
          tag_object="$(git -C source rev-parse "$KEYHOG_RELEASE_TAG")"
          if [[ "$actual" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tagged" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tag_object" != "$KEYHOG_RELEASE_TAG_OBJECT" ]]; then
            echo "ERROR: smoke checkout does not match the authenticated signed tag object" >&2
            exit 2
          fi
          sbom_dir="$RUNNER_TEMP/keyhog-sbom-candidate"
          python3 "$GITHUB_WORKSPACE/automation/scripts/release_sbom.py" verify \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --asset-dir "$sbom_dir" \
            --dependency-dir "$sbom_dir" \
            --manifest "$sbom_dir/release-sbom-manifest.json" \
            --output-dir "$sbom_dir"
          payloads=(install.sh install.ps1)
          bases=(
            keyhog-linux-x86_64
            keyhog-macos-aarch64
            keyhog-macos-x86_64
            keyhog-windows-x86_64.exe
          )
          for base in "${bases[@]}"; do
            payloads+=("$base" "$base.gpu-literals.tar.gz")
          done
          sboms=()
          for payload in "${payloads[@]}"; do
            sboms+=("$payload.spdx.json")
          done
          if [[ "${#sboms[@]}" -ne 10 ]]; then
            echo "ERROR: staged SBOM inventory has ${#sboms[@]} documents; expected 10" >&2
            exit 1
          fi
          cd "$sbom_dir"
          for sbom in "${sboms[@]}"; do
            sha256sum -c "$sbom.sha256"
            minisign -Vm "$sbom" -x "$sbom.minisig" \
              -P "$KEYHOG_MINISIGN_PUBLIC_KEY"
          done
          linkage="$(ldd "$sbom_dir/keyhog-linux-x86_64")"
          if grep -Eiq 'libhs|libhyperscan' <<<"$linkage"; then
            echo "ERROR: staged Linux release payload dynamically links Hyperscan" >&2
            exit 1
          fi

      - name: Verify, install, diagnose, and scan with the exact candidate
        shell: bash
        env:
          KEYHOG_MINISIGN_PUBLIC_KEY: RWTPnJ/p6xVJ3TJIxr+ZVHMD/MTHWZhsdE38Go/oD3DYBoi4bePR55go
          KEYHOG_EXPECTED_HYPERSCAN_STATE: compiled-in
          KEYHOG_EXPECTED_GPU_STATE_NO_ADAPTER: not detected (CPU/SIMD path)
          KEYHOG_EXPECTED_GPU_STATE_SOFTWARE: software renderer (disabled for scans)
          KEYHOG_EXPECTED_SCAN_BACKEND: simd
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/keyhog-linux-candidate"
          cd "$candidate"
          payloads=(
            install.sh
            keyhog-linux-x86_64
            keyhog-linux-x86_64.gpu-literals.tar.gz
          )
          for payload in "${payloads[@]}"; do
            sha256sum -c "$payload.sha256"
            minisign -Vm "$payload" -x "$payload.minisig" \
              -P "$KEYHOG_MINISIGN_PUBLIC_KEY"
          done

          root="$RUNNER_TEMP/keyhog-release-candidate"
          install_dir="$root/prefix/bin"
          rm -rf "$root"
          mkdir -p "$install_dir" "$root/home" "$root/cache" "$root/work"
          HOME="$root/home" XDG_CACHE_HOME="$root/cache" \
            PATH="$install_dir:$PATH" \
            sh "$candidate/install.sh" \
              --from-file="$candidate/keyhog-linux-x86_64" \
              --install-dir="$install_dir" \
              --yes --no-prompt --no-calibrate --no-color
          installed="$install_dir/keyhog"
          cmp "$candidate/keyhog-linux-x86_64" "$installed"

          HOME="$root/home" XDG_CACHE_HOME="$root/cache" \
            PATH="$install_dir:$PATH" \
            "$installed" doctor >"$root/doctor.txt"
          grep -F "hyperscan      $KEYHOG_EXPECTED_HYPERSCAN_STATE" "$root/doctor.txt"
          if ! grep -F "gpu            $KEYHOG_EXPECTED_GPU_STATE_NO_ADAPTER" "$root/doctor.txt" &&
             ! grep -F "gpu            $KEYHOG_EXPECTED_GPU_STATE_SOFTWARE" "$root/doctor.txt"; then
            echo "ERROR: hosted candidate smoke unexpectedly selected a hardware GPU backend" >&2
            exit 1
          fi
          grep -F "scan engine    PASS" "$root/doctor.txt"

          fixture="$root/work/candidate-secret.env"
          report="$root/work/report.json"
          secret="sk_$(printf live)_ReleaseSmokeA1B2C3D4E5F6G7H8"
          printf 'TOKEN=%s\n' "$secret" >"$fixture"
          set +e
          HOME="$root/home" XDG_CACHE_HOME="$root/cache" \
            PATH="$install_dir:$PATH" \
            "$installed" scan \
              --no-config \
              --backend "$KEYHOG_EXPECTED_SCAN_BACKEND" \
              --daemon=off \
              --no-suppress-test-fixtures \
              --format json \
              "$fixture" >"$report" 2>"$root/work/scan.err"
          scan_status=$?
          set -e
          if [[ "$scan_status" -ne 1 ]]; then
            cat "$root/work/scan.err" >&2
            echo "ERROR: candidate scan exited $scan_status; expected exact findings exit 1" >&2
            exit 1
          fi
          jq -e --arg file "$fixture" \
            'type == "array" and length == 1 and
             .[0].detector_id == "stripe-secret-key" and
             .[0].location.file_path == $file' \
            "$report" >/dev/null
          if grep -Fq "$secret" "$report"; then
            echo "ERROR: candidate scan disclosed the planted credential" >&2
            exit 1
          fi

  # Releases published with GITHUB_TOKEN do not emit a second workflow run.
  # Call the crate publisher only after the immutable-ID public transition;
  # its own verifier re-proves the exact public release before credentials.
  crates:
    name: Publish tagged crates
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/publish-crates.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publish and verify the multi-arch GHCR image only after the signed candidate
  # smoke succeeds. Versioned and `latest` GHCR tag writes are irreversible
  # public mutations, so neither may precede product validation. The immutable
  # digest is provenance-attested and carried to the final publication gate as
  # a job output.
  docker:
    name: Publish container image (GHCR)
    needs: [ci-verdict, smoke]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.image.outputs.digest }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-verdict.outputs.commit }}
          fetch-depth: 0
      - name: Check out hardened publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
      - name: Prove container source matches validated tag
        id: tag
        shell: bash
        env:
          KEYHOG_RELEASE_COMMIT: ${{ needs.ci-verdict.outputs.commit }}
          KEYHOG_RELEASE_TAG: ${{ needs.ci-verdict.outputs.tag }}
          KEYHOG_RELEASE_TAG_OBJECT: ${{ needs.ci-verdict.outputs.tag_object }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tagged="$(git rev-list -n 1 "$KEYHOG_RELEASE_TAG")"
          tag_object="$(git rev-parse "$KEYHOG_RELEASE_TAG")"
          if [[ "$actual" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tagged" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tag_object" != "$KEYHOG_RELEASE_TAG_OBJECT" ]]; then
            echo "ERROR: container checkout is not the validated refs/tags/$KEYHOG_RELEASE_TAG commit $KEYHOG_RELEASE_COMMIT" >&2
            exit 2
          fi
          printf 'tag=%s\n' "$KEYHOG_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${KEYHOG_RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve existing immutable version image
        id: existing-image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEYHOG_IMAGE: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
          KEYHOG_RELEASE_COMMIT: ${{ needs.ci-verdict.outputs.commit }}
          KEYHOG_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          KEYHOG_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if descriptor="$(
            docker buildx imagetools inspect "$KEYHOG_IMAGE" \
              --format '{{json .Manifest}}' 2>/dev/null
          )"; then
            digest="$(
              jq -er '
                (.digest // .Digest) |
                select(type == "string" and test("^sha256:[0-9a-f]{64}$"))
              ' <<<"$descriptor"
            )"
            gh attestation verify "oci://$KEYHOG_IMAGE@$digest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$KEYHOG_WORKFLOW_SHA" \
              --source-ref "refs/tags/$KEYHOG_RELEASE_TAG" \
              --source-digest "$KEYHOG_RELEASE_COMMIT" \
              --deny-self-hosted-runners >/dev/null
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
            printf 'digest=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push new multi-arch version image
        if: steps.existing-image.outputs.exists != 'true'
        id: built-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bind exact version image digest
        id: image
        shell: bash
        env:
          KEYHOG_EXISTING_DIGEST: ${{ steps.existing-image.outputs.digest }}
          KEYHOG_BUILT_DIGEST: ${{ steps.built-image.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${KEYHOG_EXISTING_DIGEST:-$KEYHOG_BUILT_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: release version image has no immutable digest" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Verify published multi-arch manifest
        shell: bash
        env:
          KEYHOG_IMAGE: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
          KEYHOG_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          descriptor="$(
            docker buildx imagetools inspect "$KEYHOG_IMAGE" \
              --format '{{json .Manifest}}'
          )"
          actual="$(
            jq -er '
              (.digest // .Digest) |
              select(type == "string" and test("^sha256:[0-9a-f]{64}$"))
            ' <<<"$descriptor"
          )"
          if [[ "$actual" != "$KEYHOG_IMAGE_DIGEST" ]]; then
            echo "ERROR: GHCR version tag resolves to $actual, expected $KEYHOG_IMAGE_DIGEST" >&2
            exit 1
          fi
          docker buildx imagetools inspect "$KEYHOG_IMAGE" --raw \
            | jq -e '
                [.manifests[].platform
                 | select(.os == "linux" and
                          (.architecture == "amd64" or .architecture == "arm64"))
                 | "\(.os)/\(.architecture)"]
                | unique | sort == ["linux/amd64", "linux/arm64"]
              ' >/dev/null

      - name: Attest new published image digest
        if: steps.existing-image.outputs.exists != 'true'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Smoke exact digest-addressed container runtime
        shell: bash
        env:
          KEYHOG_IMAGE: ghcr.io/${{ github.repository }}
          KEYHOG_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          KEYHOG_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          candidate="$KEYHOG_IMAGE@$KEYHOG_IMAGE_DIGEST"
          version="$(docker run --rm --platform linux/amd64 "$candidate" --version)"
          if [[ "$version" != *"KeyHog $KEYHOG_RELEASE_TAG"* ]]; then
            echo "ERROR: container version does not match $KEYHOG_RELEASE_TAG: $version" >&2
            exit 1
          fi
          root="$RUNNER_TEMP/keyhog-container-smoke"
          mkdir -p "$root"
          chmod 0755 "$root"
          fixture="$root/fixture.env"
          report="$root/report.json"
          secret="sk_$(printf live)_ContainerSmokeA1B2C3D4E5F6G7H8"
          printf 'TOKEN=%s\n' "$secret" > "$fixture"
          chmod 0644 "$fixture"
          set +e
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,source=$fixture,target=/work/fixture.env,readonly" \
            "$candidate" scan \
              --no-config \
              --backend simd \
              --daemon=off \
              --no-suppress-test-fixtures \
              --format json \
              /work/fixture.env >"$report"
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            echo "ERROR: digest-addressed container scan exited $status; expected 1" >&2
            exit 1
          fi
          jq -e '
            type == "array" and length == 1 and
            .[0].detector_id == "stripe-secret-key"
          ' "$report" >/dev/null
          if grep -Fq "$secret" "$report"; then
            echo "ERROR: container smoke disclosed the planted credential" >&2
            exit 1
          fi
      # Re-fetch all tags only after the immutable version image is pushed,
      # verified, and attested. Global release concurrency plus this immediate
      # revalidation prevents an older overlapping run from rolling `latest`
      # backward after a newer tag appears during a long build.
      - name: Revalidate newest stable immediately before latest mutation
        id: floating
        shell: bash
        env:
          KEYHOG_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          advance="$(bash automation/scripts/is-newest-stable-tag.sh "$KEYHOG_RELEASE_TAG")"
          echo "advance=$advance" >> "$GITHUB_OUTPUT"
      - name: Advance latest image for the newest stable release
        if: steps.floating.outputs.advance == 'true'
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}"

  publish:
    name: Publish verified GitHub release
    needs: [ci-verdict, sign, docker, smoke]
    outputs:
      tag: ${{ steps.proof.outputs.tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-verdict.outputs.commit }}
          fetch-depth: 0
      - name: Check out hardened publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false

      - name: Download signed immutable-ID publication proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-publication-proof
          path: proof

      - name: Install publication proof verifier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y jq minisign

      - name: Verify signed source and successful container proof
        id: proof
        shell: bash
        env:
          KEYHOG_MINISIGN_PUBLIC_KEY: RWTPnJ/p6xVJ3TJIxr+ZVHMD/MTHWZhsdE38Go/oD3DYBoi4bePR55go
          KEYHOG_RELEASE_COMMIT: ${{ needs.ci-verdict.outputs.commit }}
          KEYHOG_RELEASE_TAG: ${{ needs.ci-verdict.outputs.tag }}
          KEYHOG_RELEASE_TAG_OBJECT: ${{ needs.ci-verdict.outputs.tag_object }}
          KEYHOG_CONTAINER_TAG: ${{ needs.docker.outputs.tag }}
          KEYHOG_CONTAINER_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/proof/release-publication.json"
          minisign -Vm "$receipt" -x "$receipt.minisig" \
            -P "$KEYHOG_MINISIGN_PUBLIC_KEY"
          schema="$(jq -er '.schema' "$receipt")"
          repository="$(jq -er '.repository' "$receipt")"
          tag="$(jq -er '.tag' "$receipt")"
          commit="$(jq -er '.commit' "$receipt")"
          tag_object="$(jq -er '.tag_object' "$receipt")"
          release_id="$(jq -er '.release_id' "$receipt")"
          local_tag_object="$(git rev-parse "$tag")"
          if [[ "$schema" != "keyhog-release-publication-v2" ||
                "$repository" != "$GITHUB_REPOSITORY" ||
                "$commit" != "$KEYHOG_RELEASE_COMMIT" ||
                "$commit" != "$(git rev-parse HEAD)" ||
                "$tag" != "$KEYHOG_RELEASE_TAG" ||
                "$tag" != "$KEYHOG_CONTAINER_TAG" ||
                "$tag_object" != "$KEYHOG_RELEASE_TAG_OBJECT" ||
                "$tag_object" != "$local_tag_object" ||
                ! "$release_id" =~ ^[1-9][0-9]*$ ||
                ! "$KEYHOG_CONTAINER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: signed release proof does not match the successful release jobs" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$commit" ]]; then
            echo "ERROR: publication checkout $actual does not match signed commit $commit" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Transition exact immutable release ID to public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/automation/scripts/publish_release_assets.py" publish \
            --repository "$GITHUB_REPOSITORY" \
            --receipt "$GITHUB_WORKSPACE/proof/release-publication.json"

  # Move the floating major tag (e.g. `v0`) to this release so adopters can
  # pin `uses: santhreal/keyhog/.github/actions/keyhog@v0` and always get
  # the latest release without editing their workflow - and our own docs stop
  # drifting to dead exact tags (the @v0.5.36 incident). Lightweight tag, force
  # -moved only after the complete GitHub release is public.
  major-tag:
    name: Update floating major tag
    # The floating action tag cannot move until signed assets, the staged
    # candidate smoke, GHCR publication, and final immutable-ID transition pass.
    needs: [ci-verdict, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-verdict.outputs.commit }}
          fetch-depth: 0
      - name: Check out hardened floating-tag automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false
      - name: Prove floating tag source matches validated tag
        shell: bash
        env:
          KEYHOG_RELEASE_COMMIT: ${{ needs.ci-verdict.outputs.commit }}
          KEYHOG_RELEASE_TAG: ${{ needs.ci-verdict.outputs.tag }}
          KEYHOG_RELEASE_TAG_OBJECT: ${{ needs.ci-verdict.outputs.tag_object }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tagged="$(git rev-list -n 1 "$KEYHOG_RELEASE_TAG")"
          tag_object="$(git rev-parse "$KEYHOG_RELEASE_TAG")"
          if [[ "$actual" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tagged" != "$KEYHOG_RELEASE_COMMIT" ||
                "$tag_object" != "$KEYHOG_RELEASE_TAG_OBJECT" ]]; then
            echo "ERROR: floating-tag checkout is not the validated refs/tags/$KEYHOG_RELEASE_TAG commit $KEYHOG_RELEASE_COMMIT" >&2
            exit 2
          fi

      - name: Decide whether this is the newest stable release
        id: floating
        shell: bash
        env:
          KEYHOG_RELEASE_TAG: ${{ needs.ci-verdict.outputs.tag }}
        run: |
          set -euo pipefail
          advance="$(bash automation/scripts/is-newest-stable-tag.sh "$KEYHOG_RELEASE_TAG")"
          echo "advance=$advance" >> "$GITHUB_OUTPUT"
      - name: Force-move v<major> to this release
        if: steps.floating.outputs.advance == 'true'
        shell: bash
        env:
          KEYHOG_RELEASE_TAG: ${{ needs.ci-verdict.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$KEYHOG_RELEASE_TAG"
          major="${tag%%.*}"   # v0.5.35 -> v0
          git tag -f "$major" "${tag}^{}"
          git push -f origin "refs/tags/$major"
          echo "moved $major -> $tag"
