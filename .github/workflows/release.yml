name: Automatic crates.io release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: keyhog-auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, changelog, and publish
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Prepare patch release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [[ "$current" == "$CI_HEAD_SHA" ]]; then
            summary="$(git show -s --format=%s "$CI_HEAD_SHA")"
            author="$(git show -s --format=%ae "$CI_HEAD_SHA")"
            if [[ "$author" == "41898282+github-actions[bot]@users.noreply.github.com" && "$summary" =~ ^release:\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Automatic release commits do not create another release."
              exit 0
            fi
            result="$(python3 -B scripts/auto_release.py --summary "$summary" --apply)"
            version="${result%%$'\t'*}"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -u
            git commit -m "release: v${version}"
            git tag "v${version}"
            git push --atomic origin HEAD:main "refs/tags/v${version}"
          elif [[ "$(git rev-parse HEAD^)" == "$CI_HEAD_SHA" && "$(git show -s --format=%s HEAD)" =~ ^release:\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$(python3 -B - <<'PY'
          import pathlib
          import tomllib
          print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])
          PY
          )"
            echo "Resuming v${version} from the existing automatic release commit."
          else
            echo "A newer main push superseded ${CI_HEAD_SHA}; its successful CI run will release it."
            exit 0
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Publish crates.io packages
        if: steps.release.outputs.version != ''
        run: bash scripts/publish.sh
