name: bench-nightly

# binds the checked-out source, release binary, detector corpus, exact GitHub
# runner image, accelerator-disabled environment/inventory, and byte-identical
# workloads before measuring mirror recall, pinned CredData recall, the P0-P12
# recovery mode matrix, and CPU/reader/size/partition scaling. Publication
# requires every recall and resource floor plus zero CPU/SIMD Unicode divergence;
# a missing or stale row makes the result unusable.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:

env:
  CC: ""
  CARGO_NET_RETRY: "10"
  CUDA_VISIBLE_DEVICES: ""
  NVIDIA_VISIBLE_DEVICES: "void"
  RUNNER_ENVIRONMENT: "github-hosted"
  KEYHOG_BENCH_RUNNER_PROFILE: "github-ubuntu-24.04-4core-nightly"

jobs:
  leaderboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Per-job permissions, see keyhog.yml header note. Top-level
    # `permissions:` rejected at dispatch time on this repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure hosted temporary paths
        run: |
          printf '%s\n' \
            "KEYHOG_BENCH_SOURCE_ROOT=$RUNNER_TEMP/keyhog-bench-sources" \
            "KEYHOG_BENCH_SNAPSHOT_ROOT=$RUNNER_TEMP/keyhog-bench-snapshots" \
            "KEYHOG_BENCH_MIRROR=$RUNNER_TEMP/keyhog-bench-sources/mirror" \
            "KEYHOG_BENCH_CREDDATA=$RUNNER_TEMP/keyhog-bench-sources/creddata" \
            >> "$GITHUB_ENV"


      - name: Install Rust 1.89.0 toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.89.0

      - name: Install exact CPython 3.12.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Install exact Go 1.22.2
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.22.2"
          cache: false

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: bench-nightly

      # keyhog's ci-lean build links the distro Hyperscan runtime. Pin both
      # build inputs and the runtime package so its later receipt is meaningful.
      - name: Install exact Hyperscan development and runtime packages
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libhyperscan-dev=5.4.2-2 libhyperscan5=5.4.2-2 pkg-config=1.8.1-2build1; then
              break
            fi
            sleep $((i * 2))
            if [ "$i" -eq 5 ]; then exit 1; fi
          done


      - name: Build keyhog release binary
        # ci-lean plus explicit SIMD rows keeps GPU code out of this evidence.
        run: |
          set -euo pipefail
          cargo build --locked --release -p keyhog --bin keyhog \
            --no-default-features --features ci-lean


      - name: Install TruffleHog 3.95.3
        run: |
          set -euo pipefail
          version="3.95.3"
          archive="${RUNNER_TEMP}/trufflehog_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${version}/trufflehog_${version}_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "5d836eae522540a32ca0f1a1e00efd4c3153a52462466a4b4008fac1e6c1a548  ${archive}" \
            | sha256sum --check --strict -
          install_dir="${RUNNER_TEMP}/trufflehog-${version}"
          mkdir "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}"
          sudo install -m 0755 "${install_dir}/trufflehog" /usr/local/bin/trufflehog
          trufflehog --version

      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --only-binary=:all: \
            -r benchmarks/requirements.txt
          python3 -m pip install --disable-pip-version-check --no-deps \
            --require-hashes --only-binary=:all: \
            -r scripts/requirements-marketplace.txt
          python3 -c 'import yaml; assert yaml.__version__ == "6.0.3"'


      - name: Benchmark regression tests
        env:
          KEYHOG_BIN: ${{ github.workspace }}/target/release/keyhog
        run: |
          set -euo pipefail
          cd benchmarks && PYTHONDONTWRITEBYTECODE=1 python3 -B -m pytest -p no:cacheprovider -q -m 'not target_spec' bench/tests

      - name: Validate redacted quality gate contract
        env:
          KEYHOG_BIN: ${{ github.workspace }}/target/release/keyhog
        run: |
          set -euo pipefail
          make -C benchmarks real-repository-quality-contract \
            REAL_REPOSITORY_IDENTITY="${RUNNER_TEMP}/real-repository-quality-identity.json" \
            REAL_REPOSITORY_REPORT="${RUNNER_TEMP}/real-repository-quality-report.json"

      - name: Prepare clean benchmark artifact and source directories
        # Never permit a prior attempt's results, context receipts, source
        # workloads, or snapshots to cross the fresh-run boundary. In
        # particular, the destination snapshot root stays absent until context
        # capture performs its exclusive create.
        run: |
          set -euo pipefail
          rm -rf benchmarks/results-nightly benchmarks/results-ioc-recovery \
            benchmarks/results-creddata benchmarks/reports-nightly \
            benchmarks/nightly-run-set.toml \
            benchmarks/hosted-cpu-context.json benchmarks/hosted-cpu-supply.json \
            benchmarks/hosted-cpu-immutability.json benchmarks/unicode-parity.json
          source_root="${KEYHOG_BENCH_SOURCE_ROOT}"
          snapshot_root="${KEYHOG_BENCH_SNAPSHOT_ROOT}"
          case "${source_root}" in
            "${RUNNER_TEMP}/"*) ;;
            *) echo "::error::unsafe benchmark source root"; exit 1 ;;
          esac
          case "${snapshot_root}" in
            "${RUNNER_TEMP}/"*) ;;
            *) echo "::error::unsafe benchmark snapshot root"; exit 1 ;;
          esac
          if [[ "${source_root}" == "${snapshot_root}" ]]; then
            echo "::error::benchmark source and snapshot roots must differ"
            exit 1
          fi
          rm -rf "${source_root}" "${snapshot_root}"
          mkdir -p "${source_root}"
          test ! -e "${snapshot_root}"
          rm -rf benchmarks/corpora/ioc-recovery-v3
          printf '%s\n' \
            "KEYHOG_BENCH_HOSTED_CONTEXT=$GITHUB_WORKSPACE/benchmarks/hosted-cpu-context.json" \
            "KEYHOG_BENCH_SUPPLY_RECEIPT=$GITHUB_WORKSPACE/benchmarks/hosted-cpu-supply.json" \
            "KEYHOG_BENCH_IMMUTABILITY_RECEIPT=$GITHUB_WORKSPACE/benchmarks/hosted-cpu-immutability.json" \
            >> "$GITHUB_ENV"

      - name: Record pinned hosted CPU supply receipt
        # Context capture can consume this stable path when supply binding is
        # promoted into the evidence schema; publication includes the same bytes.
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}" && test -n "${ImageVersion:-}"
          python_version="$(python3 -c 'import platform; print(platform.python_version())')"
          go_version="$(go env GOVERSION)"
          test "${python_version}" = "3.12.11"
          test "${go_version}" = "go1.22.2"
          go_version="${go_version#go}"
          test "$(dpkg-query -W -f='${Version}' libhyperscan-dev)" = "5.4.2-2"
          test "$(dpkg-query -W -f='${Version}' libhyperscan5)" = "5.4.2-2"
          test "$(dpkg-query -W -f='${Version}' pkg-config)" = "1.8.1-2build1"
          libhs_path="$(ldd target/release/keyhog | awk '$1 ~ /^libhs\.so/ { print $3; exit }')"
          test -n "${libhs_path}" && test -f "${libhs_path}"
          libhs_path="$(realpath "${libhs_path}")"
          libhs_sha256="$(sha256sum "${libhs_path}" | cut -d' ' -f1)"
          python3 -B - "${KEYHOG_BENCH_SUPPLY_RECEIPT}" \
            "${ImageOS}" "${ImageVersion}" "${python_version}" "${go_version}" \
            "${libhs_path}" "${libhs_sha256}" <<'PY'
          import json
          import pathlib
          import sys

          (output, image_os, image_version, python_version, go_version,
           libhs_path, libhs_sha256) = sys.argv[1:]
          receipt = {
              "schema_version": "hosted-cpu-supply-v1",
              "runner_image": {
                  "label": "ubuntu-24.04",
                  "os": image_os,
                  "version": image_version,
              },
              "cpython": {"requested": "3.12.11", "observed": python_version},
              "go": {"requested": "1.22.2", "observed": go_version},
              "apt": {
                  "libhyperscan-dev": "5.4.2-2",
                  "libhyperscan5": "5.4.2-2",
                  "pkg-config": "1.8.1-2build1",
              },
              "libhs_runtime": {
                  "path": libhs_path,
                  "sha256": libhs_sha256,
                  "package": "libhyperscan5",
                  "package_version": "5.4.2-2",
              },
          }
          pathlib.Path(output).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY



      - name: Generate fixed mirror workload
        run: |
          set -euo pipefail
          cd benchmarks && python3 -B -m bench.corpora.mirror --ensure \
            --positives 3000 --negatives 12000 --seed 0


      - name: Download pinned CredData workload
        run: |
          set -euo pipefail
          cd benchmarks && python3 -B -m bench.corpora.creddata --download

      - name: Generate exact recovery workload
        run: |
          set -euo pipefail
          make -C benchmarks ioc-recovery-corpus
          mv benchmarks/corpora/ioc-recovery-v3 \
            "${KEYHOG_BENCH_SOURCE_ROOT}/ioc-recovery"
          ln -s "${KEYHOG_BENCH_SOURCE_ROOT}/ioc-recovery" \
            benchmarks/corpora/ioc-recovery-v3
          test ! -e "${KEYHOG_BENCH_SNAPSHOT_ROOT}"

      - name: Capture current hosted CPU context
        env:
          KEYHOG_BIN: ${{ github.workspace }}/target/release/keyhog
        run: |
          set -euo pipefail
          for path in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cgroup.controllers /proc/self/cgroup; do
            if [[ -r "$path" ]]; then
              printf '%s=' "$path"
              tr '\n' ';' < "$path"
              printf '\n'
            else
              printf '%s=unreadable-or-absent\n' "$path"
            fi
          done
          grep -E ' - cgroup2? ' /proc/self/mountinfo || true
          source_root="$(realpath "${KEYHOG_BENCH_SOURCE_ROOT}")"
          snapshot_root="${KEYHOG_BENCH_SNAPSHOT_ROOT}"
          test ! -e "${snapshot_root}"
          cd benchmarks
          python3 -B -m bench.hosted_cpu_gate context \
            --policy cpu-gates/github-ubuntu-24.04-4core-nightly.json \
            --source-commit "${GITHUB_SHA}" \
            --binary "${KEYHOG_BIN}" \
            --repo-root .. \
            --snapshot-root "${snapshot_root}" \
            --workload mirror --workload creddata --workload ioc-recovery \
            --output hosted-cpu-context.json
          snapshot_root="$(realpath "${snapshot_root}")"
          test "${source_root}" != "${snapshot_root}"
          for workload in mirror creddata ioc-recovery; do
            test "$(realpath "${source_root}/${workload}")" != \
              "$(realpath "${snapshot_root}/${workload}")"
          done
          {
            echo "KEYHOG_BENCH_MIRROR=${snapshot_root}/mirror"
            echo "KEYHOG_BENCH_CREDDATA=${snapshot_root}/creddata"
          } >> "${GITHUB_ENV}"

      - name: Lock captured snapshots read-only for the measurement interval
        # chmod alone false-passes because the runner owns the files and can
        # chmod them back. Root ownership plus a read-only bind mount makes a
        # write fail at the VFS boundary until the final cleanup unmounts it.
        run: |
          set -euo pipefail
          snapshot_root="$(realpath "${KEYHOG_BENCH_SNAPSHOT_ROOT}")"
          sudo chown -R root:root "${snapshot_root}"
          sudo mount --bind "${snapshot_root}" "${snapshot_root}"
          sudo mount -o remount,bind,ro "${snapshot_root}"
          mount_options="$(findmnt --mountpoint "${snapshot_root}" --noheadings --output OPTIONS)"
          printf '%s\n' "${mount_options}" | tr ',' '\n' | grep -Fxq ro
          if touch "${snapshot_root}/.immutability-probe" 2>/dev/null; then
            echo "::error::snapshot bind mount remained writable"
            exit 1
          fi
          python3 -B - "${KEYHOG_BENCH_IMMUTABILITY_RECEIPT}" \
            "${snapshot_root}" "${mount_options}" \
            "${KEYHOG_BENCH_HOSTED_CONTEXT}" <<'PY'
          import json
          import pathlib
          import sys

          output, snapshot_root, mount_options, context_path = sys.argv[1:]
          receipt = {
              "schema_version": "hosted-cpu-immutability-v1",
              "snapshot_root": snapshot_root,
              "owner": "root:root",
              "mount_options": sorted(mount_options.split(",")),
              "write_probe": "rejected",
              "interval_end": "post-publication cleanup",
          }
          pathlib.Path(output).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          context_file = pathlib.Path(context_path)
          context = json.loads(context_file.read_text())
          context["immutability"] = receipt
          context_file.write_text(json.dumps(context, indent=2, sort_keys=True) + "\n")
          PY

      - name: Require exact Unicode CPU/SIMD parity
        run: |
          set -euo pipefail
          cd benchmarks
          python3 -B -m bench.unicode_parity \
            --context hosted-cpu-context.json \
            --policy cpu-gates/github-ubuntu-24.04-4core-nightly.json \
            --binary "${GITHUB_WORKSPACE}/target/release/keyhog" \
            --repo-root .. \
            --output unicode-parity.json

      - name: Run leaderboard (keyhog + trufflehog)
        # Use the Makefile target so --require-available fails the job if any
        # scanner cannot produce a real result.
        env:
          KEYHOG_BIN: ${{ github.workspace }}/target/release/keyhog
        run: |
          set -euo pipefail
          make -C benchmarks leaderboard SCANNERS=keyhog,trufflehog OUT=results-nightly

      - name: Run pinned CredData recall row
        env:
          KEYHOG_BIN: ${{ github.workspace }}/target/release/keyhog
        run: |
          set -euo pipefail
          cd benchmarks
          python3 -B -m bench leaderboard --corpus creddata --scanners keyhog \
            --out results-creddata --require-available

      - name: Declare exact nightly report run set
        # The committed headline inventory has immutable identities and must
        # remain untouched. Bind this hosted-runner measurement to the two exact
        # output paths the leaderboard command above is required to produce.
        run: |
          set -euo pipefail
          cd benchmarks
          python3 - <<'PY'
          import json
          import pathlib

          from bench.schema import RunResult

          root = pathlib.Path("results-nightly")
          files = [
              root / "mirror-keyhog-simd-nocache-nodaemon-full.json",
              root / "mirror-trufflehog-default-nocache-nodaemon-no-verify.json",
          ]
          observed_files = set(root.rglob("*.json"))
          if observed_files != set(files):
              raise SystemExit(
                  "nightly result paths differ from the declared run set: "
                  f"expected={sorted(map(str, files))} "
                  f"observed={sorted(map(str, observed_files))}"
              )
          rows = [
              (path, RunResult.from_json(json.loads(path.read_text()), source=str(path)))
              for path in files
          ]
          expected = {"keyhog", "trufflehog"}
          observed = {row.scanner.name for _, row in rows}
          if len(rows) != len(expected) or observed != expected:
              raise SystemExit(
                  "nightly run set must contain exactly one result for each "
                  f"required scanner; expected={sorted(expected)} observed={sorted(observed)}"
              )

          def quoted(value: str) -> str:
              return json.dumps(value)

          lines = ["schema_version = 1", 'corpus = "mirror"', ""]
          for path, row in sorted(rows, key=lambda item: item[1].scanner.name):
              lines.extend([
                  "[[run]]",
                  f"scanner = {quoted(row.scanner.name)}",
                  f"config_id = {quoted(row.scanner.config_id)}",
                  f"path = {quoted(path.relative_to(root).as_posix())}",
                  f"generated_at = {quoted(row.generated_at)}",
                  f"executable_sha256 = {quoted(row.scanner.executable_sha256)}",
                  f"hostname_hash = {quoted(row.host.hostname_hash)}",
                  f"fixture_count = {row.corpus.fixture_count}",
                  f"labeled_positives = {row.corpus.labeled_positives}",
                  f"corpus_bytes = {row.corpus.bytes}",
                  "",
              ])
          pathlib.Path("nightly-run-set.toml").write_text("\n".join(lines))
          PY


      # Recovery is measured once. The deep RunResult itself must prove 4,368
      # exact recalls and all 13 independent phase floors in the hosted gate.


      - name: Run exact recovery mode matrix
        env:
          KEYHOG_BIN: ${{ github.workspace }}/target/release/keyhog
        run: |
          set -euo pipefail
          cd benchmarks
          python3 -B -m bench leaderboard --corpus ioc-recovery \
            --corpus-root "${RUNNER_TEMP}/keyhog-bench-snapshots/ioc-recovery" \
            --scanners keyhog --matrix mode --out results-ioc-recovery \
            --require-available


      - name: Render leaderboard + per-detector reports
        # Render only into a newly absent directory. The publication guard below
        # rejects any entry beyond report.py's exact canonical six-file set.
        run: |
          set -euo pipefail
          test ! -e benchmarks/reports-nightly
          cd benchmarks
          python3 -B -m bench report --results results-nightly \
            --reports reports-nightly --corpus mirror \
            --run-set nightly-run-set.toml


      - name: Validate untrusted nightly calibration evidence
        if: github.event_name == 'workflow_dispatch'
        # This only proves that raw evidence is complete, parseable, and owned by
        # this run. It deliberately does not evaluate or accept policy limits.
        run: |
          set -euo pipefail
          cd benchmarks
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat

          from bench.schema import RunResult

          expected_results = {
              "results-nightly/mirror-keyhog-simd-nocache-nodaemon-full.json",
              "results-nightly/mirror-trufflehog-default-nocache-nodaemon-no-verify.json",
              "results-creddata/creddata-keyhog-simd-nocache-nodaemon-full.json",
              "results-ioc-recovery/ioc-recovery-keyhog-simd-nocache-nodaemon-fast.json",
              "results-ioc-recovery/ioc-recovery-keyhog-simd-nocache-nodaemon-full.json",
              "results-ioc-recovery/ioc-recovery-keyhog-simd-nocache-nodaemon-deep.json",
              "results-ioc-recovery/ioc-recovery-keyhog-simd-nocache-nodaemon-precision.json",
          }
          receipt_paths = {
              "hosted-cpu-context.json",
              "hosted-cpu-supply.json",
              "hosted-cpu-immutability.json",
              "unicode-parity.json",
          }
          observed_results = {
              path.as_posix()
              for root in (
                  pathlib.Path("results-nightly"),
                  pathlib.Path("results-creddata"),
                  pathlib.Path("results-ioc-recovery"),
              )
              for path in root.rglob("*")
          }
          if observed_results != expected_results:
              raise SystemExit(
                  "untrusted nightly calibration inventory mismatch: "
                  f"expected={sorted(expected_results)} "
                  f"observed={sorted(observed_results)}"
              )

          def reject_json_constant(value):
              raise ValueError(f"non-finite JSON constant {value!r} is forbidden")

          parsed = {}
          for relative in sorted(expected_results | receipt_paths):
              path = pathlib.Path(relative)
              if not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit(f"{relative}: calibration evidence is not a regular file")
              parsed[relative] = json.loads(
                  path.read_text(), parse_constant=reject_json_constant
              )
          rows = {
              relative: RunResult.from_json(parsed[relative], source=relative)
              for relative in sorted(expected_results)
          }

          context = parsed["hosted-cpu-context.json"]
          supply = parsed["hosted-cpu-supply.json"]
          immutability = parsed["hosted-cpu-immutability.json"]
          parity = parsed["unicode-parity.json"]
          if not all(isinstance(value, dict) for value in (context, supply, immutability, parity)):
              raise SystemExit("calibration context receipts must be JSON objects")
          if supply.get("schema_version") != "hosted-cpu-supply-v1":
              raise SystemExit("calibration supply receipt schema is not current")
          if immutability.get("schema_version") != "hosted-cpu-immutability-v1":
              raise SystemExit("calibration immutability receipt schema is not current")
          if context.get("supply") != supply or context.get("immutability") != immutability:
              raise SystemExit("standalone supply/immutability receipts differ from context")

          expected_identity = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
          }
          runner = context.get("runner")
          if not isinstance(runner, dict):
              raise SystemExit("calibration context runner is not an object")
          if context.get("source_commit") != os.environ["GITHUB_SHA"]:
              raise SystemExit("calibration context source SHA differs from this run")
          if runner.get("profile") != "github-ubuntu-24.04-4core-nightly":
              raise SystemExit("calibration context runner profile is unexpected")
          for field, expected in expected_identity.items():
              if runner.get(field) != expected:
                  raise SystemExit(f"calibration context {field} differs from this run")
          if parity.get("source_commit") != os.environ["GITHUB_SHA"]:
              raise SystemExit("calibration parity source SHA differs from this run")
          for field, expected in expected_identity.items():
              if parity.get(field) != expected:
                  raise SystemExit(f"calibration parity {field} differs from this run")
          expected_binding = {
              "context_sha256": hashlib.sha256(
                  pathlib.Path("hosted-cpu-context.json").read_bytes()
              ).hexdigest(),
              **expected_identity,
          }
          for relative, row in rows.items():
              if row.hosted_binding is None or row.hosted_binding.to_json() != expected_binding:
                  raise SystemExit(f"{relative}: hosted run/context binding differs")
          PY

      - name: Upload untrusted nightly calibration evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: untrusted-calibration-evidence-github-ubuntu-24.04-4core-nightly-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            benchmarks/results-nightly/mirror-keyhog-simd-nocache-nodaemon-full.json
            benchmarks/results-nightly/mirror-trufflehog-default-nocache-nodaemon-no-verify.json
            benchmarks/results-creddata/creddata-keyhog-simd-nocache-nodaemon-full.json
            benchmarks/results-ioc-recovery/ioc-recovery-keyhog-simd-nocache-nodaemon-fast.json
            benchmarks/results-ioc-recovery/ioc-recovery-keyhog-simd-nocache-nodaemon-full.json
            benchmarks/results-ioc-recovery/ioc-recovery-keyhog-simd-nocache-nodaemon-deep.json
            benchmarks/results-ioc-recovery/ioc-recovery-keyhog-simd-nocache-nodaemon-precision.json
            benchmarks/hosted-cpu-context.json
            benchmarks/hosted-cpu-supply.json
            benchmarks/hosted-cpu-immutability.json
            benchmarks/unicode-parity.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate benchmark artifacts
        # The hosted gate validates exact identity, recall and resource limits;
        # this final publication boundary also requires parseable nonempty files.
        run: |
          set -euo pipefail
          cd benchmarks
          trusted_now="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          python3 -B -m bench.hosted_cpu_gate gate \
            --policy cpu-gates/github-ubuntu-24.04-4core-nightly.json \
            --policy-sha256 fdebca6c7c7042ad95fd7b779917502adc43c0d38d583ebb9d9b28fb75b56fdd \
            --context hosted-cpu-context.json \
            --unicode-parity unicode-parity.json \
            --trusted-now "${trusted_now}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --workflow-sha "${GITHUB_WORKFLOW_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job "${GITHUB_JOB}" \
            --root .
          python3 -B - <<'PY'
          import json
          import pathlib
          from bench.schema import RunResult

          expected_reports = {
              "leaderboard.md", "perf.md", "recall-gap.md",
              "category-recall.md", "static-recovery.md", "bloom.md",
          }
          report_root = pathlib.Path("reports-nightly")
          observed_reports = {
              path.relative_to(report_root).as_posix()
              for path in report_root.rglob("*")
          }
          if observed_reports != expected_reports:
              raise SystemExit(
                  "nightly report inventory mismatch: "
                  f"expected={sorted(expected_reports)} "
                  f"observed={sorted(observed_reports)}"
              )
          for name in sorted(expected_reports):
              path = report_root / name
              if not path.is_file() or not path.read_text().strip():
                  raise SystemExit(f"{path}: missing or empty report")

          for root in map(pathlib.Path, (
              "results-nightly", "results-creddata", "results-ioc-recovery",
          )):
              files = sorted(root.glob("*.json"))
              if not files:
                  raise SystemExit(f"{root}: no result rows")
              for path in files:
                  row = RunResult.from_json(json.loads(path.read_text()), source=str(path))
                  if row.finding_count <= 0:
                      raise SystemExit(f"{path}: no usable findings")
          PY

      - name: Measure hosted CPU and partition scaling
        run: |
          set -euo pipefail
          cd benchmarks
          python3 -B -m bench.scaling_matrix measure \
            --binary "$GITHUB_WORKSPACE/target/release/keyhog" \
            --workspace-root "$RUNNER_TEMP/keyhog-scaling" \
            --storage "github-runner-temp=$RUNNER_TEMP/keyhog-scaling" \
            --snapshot reports-nightly/readme-scaling.json \
            --markdown reports-nightly/readme-scaling.md \
            --trials 3 --warmups 1 --backend simd --source-state clean

      - name: Validate hosted scaling artifacts
        run: |
          set -euo pipefail
          cd benchmarks
          python3 -B - <<'PY'
          import pathlib

          from bench.scaling_matrix import load, render

          snapshot = pathlib.Path("reports-nightly/readme-scaling.json")
          markdown = pathlib.Path("reports-nightly/readme-scaling.md")
          evidence = load(snapshot)
          expected = render(evidence) + "\n"
          if not markdown.is_file() or markdown.read_text() != expected:
              raise SystemExit("hosted scaling Markdown differs from validated JSON")
          PY


      - name: Upload benchmark results and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-unified-results
          path: |
            benchmarks/results-nightly/**
            benchmarks/results-creddata/**
            benchmarks/results-ioc-recovery/**
            benchmarks/reports-nightly/leaderboard.md
            benchmarks/reports-nightly/perf.md
            benchmarks/reports-nightly/recall-gap.md
            benchmarks/reports-nightly/category-recall.md
            benchmarks/reports-nightly/static-recovery.md
            benchmarks/reports-nightly/bloom.md
            benchmarks/reports-nightly/readme-scaling.json
            benchmarks/reports-nightly/readme-scaling.md
            benchmarks/nightly-run-set.toml
            benchmarks/hosted-cpu-context.json
            benchmarks/hosted-cpu-supply.json
            benchmarks/hosted-cpu-immutability.json
            benchmarks/unicode-parity.json
            benchmarks/cpu-gates/github-ubuntu-24.04-4core-nightly.json
          if-no-files-found: error
          retention-days: 30

      - name: Unmount and remove private benchmark snapshots
        if: always()
        run: |
          set -euo pipefail
          snapshot_root="${KEYHOG_BENCH_SNAPSHOT_ROOT}"
          source_root="${KEYHOG_BENCH_SOURCE_ROOT}"
          case "${source_root}" in
            "${RUNNER_TEMP}/"*) ;;
            *) echo "::error::refusing unsafe benchmark source cleanup"; exit 1 ;;
          esac
          case "${snapshot_root}" in
            "${RUNNER_TEMP}/"*) ;;
            *) echo "::error::refusing unsafe benchmark snapshot cleanup"; exit 1 ;;
          esac
          if [[ "${source_root}" == "${snapshot_root}" ]]; then
            echo "::error::refusing overlapping benchmark cleanup"
            exit 1
          fi
          if mountpoint -q "${snapshot_root}"; then
            sudo umount "${snapshot_root}"
          fi
          sudo rm -rf --one-file-system "${snapshot_root}"
          rm -rf "${source_root}"
          rm -f benchmarks/corpora/ioc-recovery-v3
