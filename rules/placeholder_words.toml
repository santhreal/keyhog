# Tier-B data: documentation / placeholder words that mark a value as a sample,
# not a production secret.
#
# Schema:
#   [placeholder_words]
#   words = ["lowercase-ascii-word", ...]
#
# Semantics:
# - The list is consumed by the scanner's surface-form, decoded-form, and
#   doc-marker suppression paths through one loader.
# - Entries must be lowercase ASCII alphanumeric words. Do not add ambiguous
#   operational words such as "test", "password", "admin", "root", or "qwerty":
#   those can appear in real credentials and need context-specific handling.
# - "example" is part of the shared vocabulary, but URL domains under
#   example.com / example.org remain guarded by the doc-marker path so reserved
#   documentation domains do not suppress unrelated URL-shaped findings.
#
#   [doc_markers]
#   instructional_fragments = ["lowercase-marker", ...]
#   marker_substrings       = ["lowercase-marker", ...]
#
# - `[doc_markers]` holds two doc/placeholder marker vocabularies consumed by the
#   suppression decision tree. Stored lowercase (uniform with `words`); the loader
#   uppercases each entry because the scanner matches them against the uppercased
#   credential. Unlike `words`, marker entries may contain `_` and `-`. Extend
#   these lists to add your own placeholder conventions without recompiling.

[placeholder_words]
words = [
  "example",
  "dummy",
  "fake",
  "mock",
  "sample",
  "placeholder",
  "changeme",
]

[doc_markers]
# Leading-word-boundary fragments (matched as `YOUR_API`, `CHANGEME`, ...): a word
# boundary is required BEFORE the fragment so real base64 containing the substring
# is not suppressed.
instructional_fragments = ["your_", "your-", "insert", "change", "replace"]
# Plain-substring markers, matched anywhere in the value, they appear buried
# inside service-prefixed tokens (`ghp_EXAMPLE_TOKEN`, camel/snake-cased) where a
# word-boundary match would miss them. Real secrets do not contain these literals.
marker_substrings = [
  "example",
  "placeholder",
  "not_a_real",
  "notareal",
  "insert_token_here",
  "insert-token-here",
  "change-me",
  "changeme",
  "replace_me",
  "replaceme",
  "redacted",
  "fake_key",
  "fakekey",
  "test_key",
  "testkey",
  "sample_key",
  "samplekey",
]

# Second marker vocabulary consumed by the entropy-plausibility gate
# (`bytes_contain_entropy_placeholder_marker`, entropy/plausibility.rs). Every
# clause of that gate is data: two plain lists carrying the two uniform match
# semantics, plus three typed bounded rule tables (`length_gated_substrings`,
# `compound_shapes`, `structural_bytes`) that used to be bespoke Rust branches.
[entropy_markers]
# Case-insensitive substring markers (matched via ascii_ci over raw bytes). Stored
# lowercase; may carry `_`/`-` separators.
ci_substrings = ["your_", "replace_me", "change_me", "insert_here", "fake_", "dummy_", "mock_"]
# Whole-value EXACT markers, matched case-sensitively against the raw bytes. Stored
# lowercase, so, preserving current behavior, only the lowercase whole value
# suppresses (an uppercase `NULL` is NOT caught by this arm).
exact_values = ["null", "none", "undefined", "empty", "default", "secret", "password"]
# Structural placeholder characters: a value containing ANY of these bytes is a
# fill-in-the-blank template (`<YOUR_KEY_HERE>`). Each entry is exactly one
# ASCII byte and is matched by byte presence anywhere in the value.
structural_bytes = ["<", ">"]

# Length-gated substrings: the substring marks a decoy ONLY when the whole value
# is shorter than `max_length_exclusive`. A long value that merely contains the
# substring is a real secret and must not be suppressed. Matched
# case-insensitively.
[[entropy_markers.length_gated_substrings]]
substring = "secret_key"
max_length_exclusive = 20

# Compound shapes: a value starting with `prefix` AND ending with one of
# `suffixes` OR containing one of `substrings` is a documentation decoy. All
# three parts are matched case-insensitively, so entries are stored in the
# canonical spelling the credential class uses. `AKIA…EXAMPLE` and the
# `1234567890` sequential filler are the published AWS docs decoys.
[[entropy_markers.compound_shapes]]
prefix = "AKIA"
suffixes = ["EXAMPLE"]
substrings = ["1234567890"]
