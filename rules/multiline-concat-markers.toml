# Tier-B: string concatenation markers used by the multiline engine
# (`multiline/config.rs`) to detect implicit/explicit string concatenation
# across lines.
#
# `function_concat_markers` = function-call concat forms (Rust `concat!`,
#                             R `paste0(`, R `paste(`).
# `implicit_concat_markers` = byte sequences that indicate implicit string
#                             concatenation (adjacent string literals).
# `concat_operator_markers` = operator bytes that join strings (`+`, `.`,
#                             backtick, backslash).

function_concat_markers = [
  "paste0(",
  "paste(",
  "concat!(",
]

implicit_concat_markers = [
  "\" \"",
  "' '",
  "\"\n\"",
  "\"\n ",
  "\"\n\t",
  "'\n'",
  "'\n ",
  "'\n\t",
]

concat_operator_markers = [
  "+",
  ".",
  "`",
  "\\",
]
