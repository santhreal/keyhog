schema_version = 1

[targets]
min_speedup = 2.0
max_rss_ratio = 0.25
max_vram_ratio = 0.25
cpu_simd_max_rss_bytes = 134217728
betterleaks_max_time_ratio = 0.25
gpu_min_speedup = 10.0

[dimensions]
policies = ["default", "fast", "deep", "precision"]
backends = ["auto", "cpu", "simd", "gpu-cuda", "gpu-wgpu", "gpu-metal"]
cache_states = ["cold", "warm", "steady", "incremental-warm"]
outputs = ["text", "json", "json-envelope", "jsonl", "sarif"]
execution_routes = ["in-process", "warm-daemon", "mass-daemon"]

[[workload]]
id = "filesystem-empty-directory"
