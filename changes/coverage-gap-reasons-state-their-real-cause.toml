category = "Fixed"
summary = "Two coverage-gap rows named a cause that was not theirs. The exclusion row read `exclusion policy (.keyhogignore, --exclude-paths, or lock/minified/vendored defaults)`, but only the last of those three ever produced it: files removed by an operator's own .keyhogignore or --exclude-paths are not counted in that number at all, so a reader comparing the count against their ignore file got a figure that could never match. It now names the default policy specifically and states that user removals are not included. The archive row attributed every truncation to the filesystem decompression-bomb guard and its 4x --max-file-size budget, which stopped being true once the docker path gained three producers of the same event, so a container image refused by its own image-scoped unpack budget reported a cap that had nothing to do with it. It now names the cap family and points at the per-cap warnings that identify the exact one. Both are report text rather than behaviour, and both matter for the same reason the rest of this work does: a coverage row exists to tell an operator what was not looked at and why, and a row whose stated reason is wrong sends them to fix something that is not the problem."
crates = ["cli"]
