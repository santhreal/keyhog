category = "Fixed"
summary = "Screen the destination of a self-hosted GitLab or Bitbucket API endpoint before sending the operator's token to it. `--gitlab-endpoint` and `--bitbucket-endpoint` validated the scheme, embedded credentials and the query, and never asked where the request was going, so `https://169.254.169.254`, `https://10.0.0.5` and `http://127.0.0.1` were accepted and the PRIVATE-TOKEN or Basic credential was carried there. Every other remote source already refused this: S3, GCS and Azure screen through the cloud endpoint gate and WebSource refuses loopback outright, so hosted git was the one hole, and a test in the tree asserted the hole was expected behaviour. Both endpoints now use one shared screen that checks the literal host against the canonical SSRF classifier and re-screens every resolved address, so a public hostname whose A record points at a metadata address is refused too; the approved addresses are pinned into the client so the connection cannot re-resolve after the check. BREAKING for on-premises deployments: a self-hosted GitLab or Bitbucket on a private address now exits 13 unless `--allow-private-cloud-endpoint` is passed. That flag already existed and already governed the cloud object stores, and now means what its name says across every remote source. It is deliberately not implied by supplying an endpoint, because the failure being fixed was treating an endpoint as consent to send a credential to it."
crates = ["sources"]
