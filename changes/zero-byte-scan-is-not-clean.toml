category = "Fixed"
summary = "A scan that read zero bytes no longer reports as clean. A .keyhogignore containing `path:**` gave exit 0, scan_status success, zero bytes, zero chunks, an empty coverage_gap_summary, and the line `No secrets detected in the scanned files.` Every signal a consumer has said the tree was clean, and the scan had examined nothing at all. `--exclude-paths '**'`, an empty directory, an empty stdin stream, and a directory whose only entry is an unfollowed symlink all had the same shape. A scan that reads no source bytes now emits a FAIL-class `scan covered nothing` coverage-gap row and exits 13, and the text report states that the scan covered nothing instead of that nothing was detected. There are two such rows because the remedies differ: one for `no skip was counted` when nothing was there to read, and one for `every candidate was skipped by exclusion or skip policy` when policy hid it. THIS IS A USER-VISIBLE EXIT-CODE CHANGE. A target that legitimately holds nothing scannable moves from exit 0 to exit 13, including `keyhog scan --stdin` on an empty stream, an empty directory, a pure vendored tree, and a CI matrix partition with no files in its slice. That is intended: `git diff | keyhog scan --stdin` against the wrong base ref produces an empty diff, and reporting that as clean is the exact failure that makes mass scanning untrustworthy. Guard the producer, for example `[ -s changed.diff ]` before the pipe, rather than suppressing the exit code. There is deliberately no opt-out flag, because a flag that suppresses coverage failures would recreate the false affordance fixed alongside this. A scan that reads bytes and finds nothing is unaffected and still exits 0, and a scan that covered some input and failed on the rest still reports every finding it got alongside the gap, so exit 13 never means findings were discarded. Note that scan_status alone does not carry this: an ordinary git working-tree scan is already `partial` from its default-exclusion rows, so the usable signal is the FAIL/WARN class of the gap rows, which is what the exit code encodes."
crates = ["cli", "core"]
