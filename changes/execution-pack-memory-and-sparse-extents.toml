category = "Fixed"
summary = "Installed scans stream authenticated detector plans from execution packs without decoding detector schemas, share compiled signature strings with post-processing, and compile companion regexes only when a primary match consults them. The entropy precision gate consumes an exact build-packed cl100k rank table without constructing the tokenizer's duplicate encoder, decoder, sorted-token, and thread-local regex graphs. Phase-two no-candidate gates are scoped to the active residual route and confirmed anchors retain a compact automaton. Sparse files stream only allocated extents and report all-hole files as uncovered regions, stdin validates its byte cap through an anonymous spool before scanning bounded overlapping windows, and bounded stdin windows use a rendezvous-fed fused scan batch instead of accumulating the complete input. Fused source boundaries default to rendezvous channels, homoglyph prescreening no longer materializes Unicode matchers for unrelated replacement characters, and the one-long-line benchmark now contains one delimited canary on one physical line."
crates = ["scanner", "sources", "cli"]
