category = "Fixed"
crates = ["sources", "cli"]
summary = "Source limits are exact at their boundary and honest about which ones a build can reach. A git output line whose content is exactly `--limit-git-line-bytes` is now scanned instead of refused: the cap counted the trailing newline, so an at-cap line produced a coverage gap for input that was inside the limit, and identical content was judged differently depending on whether it ended the stream. `keyhog config --effective` no longer prints a numeric value for a limit whose source backend is not compiled in; those rows now read `unavailable (requires the <feature> feature in this keyhog build)`, matching the flag that is absent from `scan --help` and the `.keyhog.toml` key that was already rejected. All 22 declared limits now have a CLI test proving each admits exactly its cap, refuses one byte or item more, and surfaces the refusal as a coverage gap rather than dropping input silently."
