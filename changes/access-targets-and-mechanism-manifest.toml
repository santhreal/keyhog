category = "Added"
summary = "`keyhog scan --access-targets` reports the resource each credential opens: account, tenant, endpoint, database, or resource. A finding says where a credential is, not what it reaches, and the address is usually next to the credential where no detector can see it, because a companion regex is bounded to a few lines and captures the other half of the credential rather than the resource. Providers live in Tier-B `crates/core/data/access-targets.toml`, so adding one is a data edit. Off by default: with the flag absent the report has no `access_targets` key and findings are byte-identical. With it, `--format json-envelope` gains an `access_targets` object and the envelope schema minor moves 9 to 10, which is additive and readable by any consumer accepting a minor under major 1. Values are addresses only, never authenticators: connection-string rules skip userinfo, a rule may not capture the whole match, and any candidate whose digest matches a credential in the same report is dropped. Coverage is explicit, so an empty target list is never mistaken for `this credential opens nothing`: a finding from git history, a container layer, stdin, an unreadable path, a decoded or windowed view, or a file past the index cap is counted in `coverage.gaps` with a named reason and `complete` goes false. Separately, `keyhog detectors --mechanisms` prints which recovery mechanisms each detector declares (regex, keywords, structure, entropy, BPE, decode, companions, relations, verification, suppression, source admission), derived from detector TOML with the field that proves each one, and reports a mechanism KeyHog cannot yet express as unavailable with the reason rather than omitting it. It does not scan."
crates = ["core", "cli"]
