category = "Fixed"
summary = "Surface chunks abandoned at their per-chunk deadline as a fail-class coverage gap. When `--per-chunk-timeout-ms` elapsed mid-chunk the scanner returned an empty or short match set for that chunk, and the abort was counted into scanner telemetry that nothing read, so a scan that abandoned every chunk still reported `scan_status: success` with an empty `coverage_gap_summary` and exit 0. Deadline aborts now surface as `scanner chunk abandoned at its per-chunk deadline` and mark the scan partial. Operator-visible change: a scan that hits the deadline exits 13 instead of 0 where it produced no findings, so raise or clear `--per-chunk-timeout-ms` rather than suppressing the exit code. Findings are never discarded; a run that covered some input reports its findings alongside the gap."
crates = ["cli", "scanner"]
