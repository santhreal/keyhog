category = "Added"
summary = "Two detectors for credential shapes the corpus could not attribute. oauth-client-secret owns the vendor-neutral client_secret assignment (RFC 6749 section 2.3.1), which had no owner, so the shape was previously reported as Akamai; it is TOML data reusing the existing structural-slot primitives with no new code, ranked below every service-named client-secret detector so an attributable secret is never reported as the neutral shape, and it recovers 7 ground-truth files that no detector matched at all. Placeholders stay silent without new suppression code because the captured slot excludes < > $ { } and carries a 20-byte floor. facebook-access-token owns the Graph API EAA prefix, which the app-secret detector never covered; its pattern carries an explicit (?-i) because detector patterns compile case-insensitively by default, and without it the caseless eaa matched the lowercase prefix of sha256 image digests. The embedded corpus goes from 923 detectors to 925."
