category = "Fixed"
summary = "A shallow clone no longer reports its truncated history as a clean scan. `keyhog scan --git-history` and `--git-blobs` against a `git clone --depth N` checkout gave exit 0, scan_status success, and an EMPTY coverage_gap_summary, while a full clone of the same repository reported a credential that had been committed and later removed: the commits holding it were never fetched, so the scan searched history that was not there and said nothing. The parent commits named at the graft boundary but absent from the object database are now counted as unscanned Git objects, so such a scan reports scan_status partial with a `Git object unreadable` coverage-gap row and exits 13, and stderr names `git fetch --unshallow` and `actions/checkout` `fetch-depth: 0` as the remedy. This is a user-visible exit-code change and it fires on the common CI shape, because `actions/checkout` fetches one commit by default, so any job that scans history on an unmodified checkout moves from a green tick to exit 13; fix the checkout depth rather than suppressing the code, since the exit is reporting that the input never contained the history you asked it to search. Findings are never discarded: a shallow clone that does contain credentials still reports every one of them, byte-identical to before, with the gap row added rather than substituted, and a depth-1 clone of a single-commit repository stays a genuine success because its graft boundary is the root commit and hides no parent."
crates = ["sources"]
