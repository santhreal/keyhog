category = "Performance"
summary = "`--git-blobs` collects commit blobs by parent-tree diff (added/changed/deleted sides) instead of rewalking every historical tree. Every named ref tip plus HEAD (detached CI checkouts), root commits, and unreadable parents still get a full tree walk so `--max-commits` keeps untouched tip blobs. Unsupported non-blob tree-diff entries stay coverage gaps, already-collected parent-diff sides are kept when a later parent falls back to a full walk, and blob decode stays on the already-open repository handle."
crates = ["sources"]
