category = "Fixed"
summary = "Refuse `--benchmark` combined with a scan target instead of silently discarding it. The flag runs KeyHog's own built-in corpus and exits; it never reads an operator-supplied target and never writes `--output`. Passing both was accepted, both were discarded, and the run reported success: `keyhog scan ./src --output report.json --benchmark` printed a throughput table, exited 0, and wrote no file, so in CI that line reads as a completed scan of ./src. The flag now conflicts with the positional PATH, `--path`, `--stdin` and `--output`, so the combination exits 2 naming the conflict. Two related report strings were also wrong rather than absent. The shared oversized-input coverage row read `exceeded --max-file-size` and advised raising that cap, but the counter behind it is raised by at least eleven caps including `--limit-git-blob-bytes` and the Docker and cloud object caps, so following the remedy left the input skipped; it now names the cap family and points at the per-cap warnings that name the exact flag. And the GCS token-forwarding consent notice fired when `--allow-gcs-token-forward` was parsed rather than when a token was forwarded, so the byte-equivalent `--source gcs:...` entry path printed nothing at all; the notice now lives at the point an ambient token is actually carried to a non-Google endpoint, so both entry paths behave identically."
crates = ["cli"]
