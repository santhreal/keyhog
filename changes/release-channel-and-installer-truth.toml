category = "Fixed"
summary = "Stop reporting a stale binary-asset channel as current, and name the real Hyperscan library when an install fails. `keyhog update` compared the running build against the newest GitHub release asset and printed \"already on the latest release\" whenever nothing newer existed there, so a build newer than that channel, which every release since v0.5.47 is, was told it was up to date forever; it now distinguishes being on the newest asset from being ahead of a channel that stopped publishing, and names `cargo install --locked --force keyhog` in the second case. The installer's missing-library remediation matched the glob `*libhyperscan*`, but the published Linux binary declares `NEEDED libhs.so.5`, so a clean host got the loader error and no fix at all; it now matches the real SONAME plus the `libvectorscan` spelling, and any unrecognized library gets a generic lookup hint instead of dead-ending. The shipped artifact's runtime dependencies are also deterministic again: `lzma-sys` linked the system liblzma whenever `pkg_config` found one and vendored it otherwise, so the same commit produced binaries with or without `NEEDED liblzma.so.5` depending on the build host, and `xz2` is now pinned to a static link for 110,328 bytes."
crates = ["cli", "sources"]
