category = "Performance"
summary = "Docker image scans stream each layer's tar members through the shared in-memory archive dispatcher with one inflate pass and image-scoped unpack budgets, instead of validating by full decompress, materializing layer files, and re-walking them with FilesystemSource. Large in-memory archive text members emit as filesystem/windowed (one window at a time); nested 7z/rar/HAR keep path-extractor/HAR parity."
crates = ["sources"]
