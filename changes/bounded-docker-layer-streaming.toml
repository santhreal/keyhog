category = "Performance"
summary = "Docker image scans stream each layer tar through the shared in-memory archive dispatcher with one inflate pass and image-scoped unpack budgets, instead of full decompress plus FilesystemSource re-walk. Large already-UTF-8 archive text members are windowed on raw bytes (offsets match size_bytes); UTF-16 and other encodings keep the whole-member decode path. .har members expand through the shared dispatcher with the same wire:har labels as disk process_entry and charge derived bytes to the archive bomb budget. Top-level layer 7z/RAR extract from bytes when content magic matches; nested 7z/RAR inside other archives keep the prior leaf/coverage-gap path."
crates = ["sources"]
