category = "Fixed"
summary = "Five vendor detectors could not match their own vendor's current credential format. elevenlabs-api-key accepted only sk_ plus 32 hex while ElevenLabs issues 48, so every ground-truth sample was attributed to Klaviyo; it also matched sk_ inside lsv2_sk_<32 hex>_<10 hex> and took LangSmith keys from langsmith-api-key, so it now requires a token boundary and captures whole-value. onelogin-client-secret accepted only 64 hex where OneLogin also issues lowercase alphanumeric. jfrog-api-key owned only the retired AKCp8 prefix and not the artifactory_access_token assignment that replaced it. square-access-token owned only sq0atp- and sq0csp- and not the EAAA OAuth token that replaced them. akamai-api-credentials required client_token with an underscore and a 32-character floor, where real EdgeGrid tokens are hyphenated and 18 to 19 characters after akab-."
