category = "Fixed"
summary = "Stop autoroute calibration from discarding a whole workload class over measurement noise. An execution plan now has to clear the other plan's confidence interval, not just win a paired test, before it beats it on the same backend; points that agree on the backend but split on the plan reconcile to the plan the binary was compiled with instead of producing no decision; and merging a point re-declares the reconciled route so the persisted cache matches its own evidence. Calibrating the mirror corpus went from persisting a decision on 4 of 10 identical runs to 12 of 12."
crates = ["cli"]
