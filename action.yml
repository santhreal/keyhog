name: 'KeyHog Secret Scanner'
description: 'Scan a path for secrets, keep a report, and fail on findings by default.'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  path:
    description: 'File or directory to scan.'
    default: '.'
  severity:
    description: 'Minimum reported severity: info | client-safe | low | medium | high | critical.'
    default: 'high'
  format:
    description: 'Report format: text | json | sarif | jsonl.'
    default: 'sarif'
  verify:
    description: 'Set to "true" to verify findings with provider APIs.'
    default: 'false'
  version:
    description: |
      Published final KeyHog version v0.5.49 or newer to install. Prereleases
      and build metadata are rejected. Leave unset to use the Action ref; branch and commit refs build from source.
    default: ''
  upload-sarif:
    description: 'Upload the report to GitHub Code Scanning when format is sarif.'
    default: 'true'
  analysis-category:
    description: |
      Stable lowercase identity for this scan. Use a distinct value for each
      monorepo or matrix partition. Allows 1-64 letters, digits, dots,
      underscores, or dashes, and must start and end with a letter or digit.
    default: 'keyhog'
  fail-on-findings:
    description: |
      Fail on reported findings. Set to "false" for advisory findings.
      A verified-live credential still fails with exit code 10.
    default: 'true'
  baseline:
    description: |
      Committed baseline created with keyhog scan <PATH>
      --create-baseline <FILE>. Baseline findings are suppressed.
    default: ''
  backend:
    description: |
      Scan backend: auto | cpu | simd | gpu-cuda | gpu-wgpu. Published exact
      and floating release refs use calibrated auto. Portable branch and commit
      source refs require explicit cpu; accelerated backends are unavailable.
    default: ''
  preset:
    description: 'Scan preset: default | fast | deep | precision.'
    default: 'default'
  lockdown:
    description: 'Set to "true" to enable lockdown protections independently of the scan preset.'
    default: 'false'

outputs:
  findings:
    description: 'Number of reported findings at or above `severity`.'
    value: ${{ steps.scan.outputs.findings }}
  exit-code:
    description: 'Raw KeyHog exit code. Common scan results are 0 clean, 1 findings, and 10 verified-live findings.'
    value: ${{ steps.scan.outputs.exit-code }}
  duration-ms:
    description: 'Scan duration in milliseconds.'
    value: ${{ steps.scan.outputs.duration-ms }}
  scan-status:
    description: 'Terminal coverage state: success, partial, cancelled, or failed; partial preserves the raw scan exit.'
    value: ${{ steps.scan.outputs.scan-status }}
  report-present:
    description: 'Whether a receipt-bound private report snapshot was published.'
    value: ${{ steps.scan.outputs.report-present }}
  report:
    description: 'Receipt-bound private report snapshot retained under RUNNER_TEMP until job cleanup.'
    value: ${{ steps.scan.outputs.report }}
  analysis-category:
    description: 'Validated report and Code Scanning partition identity.'
    value: ${{ steps.outfile.outputs.category }}

runs:
  using: 'composite'
  steps:
    - name: Initialize private Action runtime
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        if [[ -z "${RUNNER_TEMP:-}" || ! -d "$RUNNER_TEMP" || -L "$RUNNER_TEMP" ]]; then
          echo "::error title=KeyHog::RUNNER_TEMP must be a trusted non-symlink directory."
          exit 2
        fi
        runtime="$(mktemp -d "$RUNNER_TEMP/keyhog-action-runtime.XXXXXXXX")"
        if [[ ! -d "$runtime" || -L "$runtime" ]]; then
          echo "::error title=KeyHog::Could not create a private Action runtime."
          exit 2
        fi
        chmod 700 "$runtime"
        mkdir -- "$runtime/bin"
        chmod 700 "$runtime/bin"
        printf 'path=%s\n' "$runtime" >> "$GITHUB_OUTPUT"

    - name: Compute output filename
      id: outfile
      shell: bash
      env:
        ACTION_FORMAT: ${{ inputs.format }}
        ACTION_ANALYSIS_CATEGORY: ${{ inputs.analysis-category }}
      run: |
        set -euo pipefail
        category="${ACTION_ANALYSIS_CATEGORY:-}"
        if [[ -z "$category" || ${#category} -gt 64 || ! "$category" =~ ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$ ]]; then
          echo "::error title=KeyHog::Invalid analysis-category. Use 1-64 lowercase letters, digits, dot, underscore, or dash; start and end with a letter or digit."
          exit 2
        fi
        if [[ -n "${RUNNER_TEMP:-}" && -n "${GITHUB_RUN_ID:-}" && -n "${GITHUB_JOB:-}" ]]; then
          categories_root="${RUNNER_TEMP}/keyhog-analysis-categories"
          if [[ -e "$categories_root" || -L "$categories_root" ]]; then
            if [[ ! -d "$categories_root" || -L "$categories_root" ]]; then
              echo "::error title=KeyHog::Analysis-category identity root is unsafe."
              exit 2
            fi
          else
            mkdir -- "$categories_root"
          fi
          identity_root="${categories_root}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}-${GITHUB_JOB}"
          if [[ -e "$identity_root" || -L "$identity_root" ]]; then
            if [[ ! -d "$identity_root" || -L "$identity_root" ]]; then
              echo "::error title=KeyHog::Analysis-category job identity is unsafe."
              exit 2
            fi
          else
            mkdir -- "$identity_root"
          fi
          if ! mkdir -- "${identity_root}/${category}" 2>/dev/null; then
            echo "::error title=KeyHog::Conflicting analysis-category. Every KeyHog scan in one job must use a distinct category."
            exit 2
          fi
        fi
        ext="json"
        case "${ACTION_FORMAT:-sarif}" in
          sarif) ext="sarif" ;;
          jsonl) ext="jsonl" ;;
          text)  ext="txt" ;;
        esac
        printf 'category=%s\n' "$category" >> "$GITHUB_OUTPUT"
        printf 'name=keyhog-results-%s.%s\n' "$category" "$ext" >> "$GITHUB_OUTPUT"

    - name: Resolve KeyHog version
      id: version
      shell: bash
      env:
        ACTION_VERSION: ${{ inputs.version }}
        ACTION_SOURCE_ROOT: ${{ github.action_path }}
        ACTION_BACKEND: ${{ inputs.backend }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        set -euo pipefail
        if [[ ! -f "$ACTION_SOURCE_ROOT/Cargo.toml" || ! -f "$ACTION_SOURCE_ROOT/scripts/release-version.sh" ]]; then
          if [[ "${ACTION_REPOSITORY:-}" == "${GITHUB_REPOSITORY:-}" && -f "${GITHUB_WORKSPACE:-}/Cargo.toml" && -f "${GITHUB_WORKSPACE:-}/scripts/release-version.sh" ]]; then
            ACTION_SOURCE_ROOT="$GITHUB_WORKSPACE"
          else
            echo "::error title=KeyHog::Action source tree is unavailable or does not match this repository."
            exit 2
          fi
        fi
        # Always initialize under `set -u` (KH-1267): branch/SHA refs never set
        # `v` in older revisions and aborted with "v: unbound variable".
        v=""
        release_required=false
        workspace_version_from_cargo() {
          local manifest="$1"
          awk '
            $0 == "[workspace.package]" { in_workspace_package = 1; next }
            in_workspace_package && /^\[/ { exit }
            in_workspace_package && $1 == "version" {
              gsub(/\"/, "", $3)
              print $3
              exit
            }
          ' "$manifest"
        }
        if [[ -n "${ACTION_VERSION:-}" ]]; then
          if ! normalized_tag="$(bash "$ACTION_SOURCE_ROOT/scripts/release-version.sh" "$ACTION_VERSION")"; then
            echo "::error title=KeyHog::Invalid version. Explicit version must be MAJOR.MINOR.PATCH with an optional prerelease suffix."
            exit 2
          fi
          v="${normalized_tag#v}"
          release_required=true
        else
          # GITHUB_ACTION_REF is e.g. "v0.5.12", "main", a SHA, or a branch.
          ref="${GITHUB_ACTION_REF:-main}"
          if [[ "$ref" =~ ^v[0-9]+[.] ]]; then
            if ! normalized_tag="$(bash "$ACTION_SOURCE_ROOT/scripts/release-version.sh" "$ref")"; then
              echo "::error title=KeyHog::Invalid action ref. Release refs must be vMAJOR.MINOR.PATCH with an optional prerelease suffix."
              exit 2
            fi
            v="${normalized_tag#v}"
            release_required=true
          elif [[ "$ref" =~ ^v([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            manifest="$ACTION_SOURCE_ROOT/Cargo.toml"
            if [[ ! -f "$manifest" ]]; then
              echo "::error title=KeyHog::Floating release ref cannot resolve its exact version because Cargo.toml is unavailable."
              exit 2
            fi
            workspace_version="$(workspace_version_from_cargo "$manifest")"
            if ! normalized_tag="$(bash "$ACTION_SOURCE_ROOT/scripts/release-version.sh" "$workspace_version")"; then
              echo "::error title=KeyHog::Floating release ref found a noncanonical version in Cargo.toml."
              exit 2
            fi
            v="${normalized_tag#v}"
            if [[ "${v%%.*}" != "$major" ]]; then
              echo "::error title=KeyHog::Floating release ref does not match the exact version in Cargo.toml."
              exit 2
            fi
            release_required=true
          else
            # Branch / SHA / other non-release refs: source-build path. Record
            # the workspace package version for logs only; never require assets.
            manifest="$ACTION_SOURCE_ROOT/Cargo.toml"
            if [[ -f "$manifest" ]]; then
              v="$(workspace_version_from_cargo "$manifest")"
            fi
            if [[ -z "$v" ]]; then
              v="source"
            fi
            release_required=false
          fi
        fi
        case "$v" in
          "" | *[!A-Za-z0-9._/-]*)
            echo "::error title=KeyHog::Invalid version. Use only letters, digits, dot, dash, underscore, or slash."
            exit 2
            ;;
        esac
        if [[ "$release_required" == "true" ]]; then
          core_version="${v%%-*}"
          IFS='.' read -r version_major version_minor version_patch <<< "$core_version"
          if (( 10#$version_major == 0 && (10#$version_minor < 5 || (10#$version_minor == 5 && 10#$version_patch < 48)) )) || [[ "$v" == *-* ]]; then
            echo "::error title=KeyHog::Prereleases and release versions older than final v0.5.49 do not support this Action's stable runtime contract."
            exit 2
          fi
        fi
        if [[ "$release_required" == "false" && "${ACTION_BACKEND:-}" != "cpu" ]]; then
          echo "::error title=KeyHog::Portable branch and commit source refs require backend: cpu. Use an exact or floating published release ref for calibrated backend:auto."
          exit 2
        fi
        printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"
        printf 'release_required=%s\n' "$release_required" >> "$GITHUB_OUTPUT"
        printf 'source-root=%s\n' "$ACTION_SOURCE_ROOT" >> "$GITHUB_OUTPUT"
        printf 'Resolved keyhog version: %s\n' "$v"
        printf 'Release asset required: %s\n' "$release_required"

    - name: Detect platform asset name
      id: asset
      shell: bash
      run: |
        set -euo pipefail
        os="$(uname -s)"
        arch="$(uname -m)"
        case "$os/$arch" in
          Linux/x86_64)    name="keyhog-linux-x86_64" ;;
          Darwin/x86_64)  name="keyhog-macos-x86_64" ;;
          Darwin/arm64)   name="keyhog-macos-aarch64" ;;
          MINGW*/x86_64 | MSYS*/x86_64 | CYGWIN*/x86_64)
                           name="keyhog-windows-x86_64.exe" ;;
          *)              name="" ;;
        esac
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "Asset name for $os/$arch: ${name:-<none, source build>}"

    - name: Install pinned release verifier
      id: verifier
      if: steps.version.outputs.release_required == 'true'
      shell: bash
      env:
        ACTION_RUNTIME: ${{ steps.runtime.outputs.path }}
      run: |
        set -euo pipefail
        verifier_version="0.11"
        case "${RUNNER_OS:-}/${RUNNER_ARCH:-}" in
          Linux/X64)
            archive_name="minisign-0.11-linux.tar.gz"
            expected_sha256="f0a0954413df8531befed169e447a66da6868d79052ed7e892e50a4291af7ae0"
            verifier_member="minisign-linux/x86_64/minisign"
            ;;
          Linux/ARM64)
            archive_name="minisign-0.11-linux.tar.gz"
            expected_sha256="f0a0954413df8531befed169e447a66da6868d79052ed7e892e50a4291af7ae0"
            verifier_member="minisign-linux/aarch64/minisign"
            ;;
          macOS/X64 | macOS/ARM64)
            archive_name="minisign-0.11-macos.zip"
            expected_sha256="e7c410ae8b8960d7087392472b040bda9b2f307c76df0384ac37f9ad103fc893"
            verifier_member="minisign"
            ;;
          Windows/X64)
            archive_name="minisign-0.11-win64.zip"
            expected_sha256="b9c31c2c3034f81f0e5f5d92cbcc20e67a9671b6e5455661588638848dc58031"
            verifier_member="minisign-win64/x86_64/minisign.exe"
            ;;
          *)
            echo "::error title=KeyHog::Unsupported runner for the pinned minisign verifier."
            exit 2
            ;;
        esac
        verifier_url="https://github.com/jedisct1/minisign/releases/download/${verifier_version}/${archive_name}"
        verifier_dir="$ACTION_RUNTIME/minisign-${verifier_version}-${expected_sha256}"
        if [[ -e "$verifier_dir" || -L "$verifier_dir" ]] || ! mkdir -- "$verifier_dir"; then
          echo "::error title=KeyHog::Private minisign directory already exists or is unsafe."
          exit 2
        fi
        chmod 700 "$verifier_dir"
        archive="$(mktemp "$verifier_dir/.archive.XXXXXXXX")"
        extract_dir="$verifier_dir/extract"
        mkdir -- "$extract_dir"
        curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --output "$archive" "$verifier_url"
        if command -v sha256sum >/dev/null 2>&1; then
          read -r actual_sha256 _ < <(sha256sum < "$archive")
        elif command -v shasum >/dev/null 2>&1; then
          read -r actual_sha256 _ < <(shasum -a 256 < "$archive")
        else
          echo "::error title=KeyHog::No SHA-256 implementation is available to authenticate minisign."
          exit 2
        fi
        if [[ "$actual_sha256" != "$expected_sha256" ]]; then
          echo "::error title=KeyHog::Pinned minisign archive SHA-256 mismatch."
          exit 2
        fi
        case "$archive_name" in
          *.tar.gz) tar -xzf "$archive" -C "$extract_dir" ;;
          *.zip) unzip -q "$archive" -d "$extract_dir" ;;
        esac
        verifier_source="$extract_dir/$verifier_member"
        if [[ ! -f "$verifier_source" || -L "$verifier_source" ]]; then
          echo "::error title=KeyHog::Pinned minisign archive did not contain a trusted regular verifier."
          exit 2
        fi
        verifier_path="$(mktemp "$verifier_dir/.minisign.XXXXXXXX")"
        cat -- "$verifier_source" > "$verifier_path"
        chmod 500 "$verifier_path"
        verifier_version_output="$("$verifier_path" -v 2>&1)"
        if [[ "$verifier_version_output" != *"$verifier_version"* ]]; then
          echo "::error title=KeyHog::Pinned minisign binary reported an unexpected version."
          exit 2
        fi
        printf 'path=%s\n' "$verifier_path" >> "$GITHUB_OUTPUT"

    # Release refs use the same two proofs as the installers: detached minisign
    # signatures against KeyHog's pinned public key plus adjacent SHA-256 files.
    # The signed GPU literal sidecar is required and authenticated. It is seeded
    # before ordinary scans, but lockdown keeps the disk cache absent by design.
    - name: Try downloading prebuilt binary
      id: download
      shell: bash
      env:
        ACTION_ASSET_NAME: ${{ steps.asset.outputs.name }}
        ACTION_RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        ACTION_RELEASE_REQUIRED: ${{ steps.version.outputs.release_required }}
        ACTION_LOCKDOWN: ${{ inputs.lockdown }}
        ACTION_RUNTIME: ${{ steps.runtime.outputs.path }}
        ACTION_CACHE_HOME: ${{ steps.runtime.outputs.path }}/cache
        ACTION_VERIFIER: ${{ steps.verifier.outputs.path }}
        KEYHOG_MINISIGN_PUBLIC_KEY: 'RWTPnJ/p6xVJ3TJIxr+ZVHMD/MTHWZhsdE38Go/oD3DYBoi4bePR55go'
      run: |
        set -euo pipefail
        action_cache_home="$ACTION_CACHE_HOME"
        case "$action_cache_home" in "$ACTION_RUNTIME"/*) ;; *) echo "::error title=KeyHog::Action cache root must be owned by the private runtime."; exit 2 ;; esac
        if [[ -e "$action_cache_home" || -L "$action_cache_home" ]] || ! mkdir -- "$action_cache_home"; then
          echo "::error title=KeyHog::Private Action cache already exists or is unsafe."; exit 2
        fi
        chmod 700 "$action_cache_home"
        case "${RUNNER_OS:-}" in
          macOS)
            export HOME="$action_cache_home/home"
            programs_dir="$HOME/Library/Caches/keyhog/programs"
            ;;
          Windows)
            export LOCALAPPDATA="$(cygpath -w "$action_cache_home/localappdata")"
            programs_dir="$(cygpath -u "$LOCALAPPDATA")/keyhog/programs"
            ;;
          Linux | "")
            export XDG_CACHE_HOME="$action_cache_home/xdg"
            programs_dir="$XDG_CACHE_HOME/keyhog/programs"
            ;;
          *) echo "::error title=KeyHog::Unsupported runner for the isolated Action cache."; exit 2 ;;
        esac
        asset="${ACTION_ASSET_NAME:-}"
        version="${ACTION_RESOLVED_VERSION:-}"
        release_required="${ACTION_RELEASE_REQUIRED:-false}"
        lockdown="${ACTION_LOCKDOWN:-false}"
        case "$lockdown" in
          true | false) ;;
          *) echo "::error title=KeyHog::Invalid lockdown. Use 'true' or 'false'."; exit 2 ;;
        esac
        if [[ "$release_required" != "true" ]]; then
          echo "Branch/SHA action ref uses the checked-out source directly; skipping release lookup."
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ -z "$asset" ]] || [[ -z "$version" ]]; then
          echo "::error title=KeyHog::No published asset is available for this runner/version; refusing source-build fallback for a required release."
          exit 2
        fi
        release_url="https://github.com/santhreal/keyhog/releases/download/v${version}"
        sidecar="$asset.gpu-literals.tar.gz"
        bundle_dir="$ACTION_RUNTIME/release-bundle-${version}"
        if [[ -e "$bundle_dir" || -L "$bundle_dir" ]] || ! mkdir -- "$bundle_dir"; then
          echo "::error title=KeyHog::Private release bundle directory already exists or is unsafe."; exit 2
        fi
        chmod 700 "$bundle_dir"
        extract_dir=""
        staged_target=""
        cleanup_release_bundle() {
          rm -rf -- "$bundle_dir"
          if [[ -n "$extract_dir" ]]; then rm -rf -- "$extract_dir"; fi
          if [[ -n "$staged_target" ]]; then rm -f -- "$staged_target"; fi
        }
        trap cleanup_release_bundle EXIT
        echo "Downloading authenticated release bundle from $release_url/$asset"
        for name in \
          "$asset" "$asset.sha256" "$asset.minisig" \
          "$sidecar" "$sidecar.sha256" "$sidecar.minisig"; do
          if ! curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 2 "$release_url/$name" -o "$bundle_dir/$name"; then
            echo "::error title=KeyHog::Required release payload '$name' is unavailable; refusing source-build fallback for a release ref."
            exit 2
          fi
        done

        if [[ ! -f "$ACTION_VERIFIER" || -L "$ACTION_VERIFIER" || "$ACTION_VERIFIER" != "$ACTION_RUNTIME"/* ]]; then
          echo "::error title=KeyHog::Private minisign verifier is missing or untrusted."; exit 2
        fi
        "$ACTION_VERIFIER" -Vm "$bundle_dir/$asset" -x "$bundle_dir/$asset.minisig" -P "$KEYHOG_MINISIGN_PUBLIC_KEY"
        "$ACTION_VERIFIER" -Vm "$bundle_dir/$sidecar" -x "$bundle_dir/$sidecar.minisig" -P "$KEYHOG_MINISIGN_PUBLIC_KEY"
        validate_checksum_manifest() {
          local manifest_path="$1"
          local expected_name="$2"
          local line=""
          local extra_line=""
          if ! IFS= read -r line < "$manifest_path" || IFS= read -r extra_line < <(sed -n '2p' "$manifest_path"); then
            echo "::error title=KeyHog::Release checksum manifest is malformed or names an unexpected file."
            return 2
          fi
          if [[ ! "$line" =~ ^[0-9A-Fa-f]{64}[[:space:]]+[*]?([A-Za-z0-9._-]+)$ ]]; then
            echo "::error title=KeyHog::Release checksum manifest is malformed or names an unexpected file."
            return 2
          fi
          if [[ "${BASH_REMATCH[1]}" != "$expected_name" ]]; then
            echo "::error title=KeyHog::Release checksum manifest is malformed or names an unexpected file."
            return 2
          fi
        }
        validate_checksum_manifest "$bundle_dir/$asset.sha256" "$asset"
        validate_checksum_manifest "$bundle_dir/$sidecar.sha256" "$sidecar"
        if command -v sha256sum >/dev/null 2>&1; then
          (cd "$bundle_dir" && sha256sum -c "$asset.sha256" && sha256sum -c "$sidecar.sha256")
        elif command -v shasum >/dev/null 2>&1; then
          (cd "$bundle_dir" && shasum -a 256 -c "$asset.sha256" && shasum -a 256 -c "$sidecar.sha256")
        else
          echo "::error title=KeyHog::No SHA256 verifier on runner; refusing source-build fallback for a required release."
          exit 2
        fi

        if ! tar -tzf "$bundle_dir/$sidecar" >/dev/null 2>&1; then
          echo "::error title=KeyHog::GPU literal sidecar is not a readable tar.gz archive."
          exit 2
        fi
        while IFS= read -r entry; do
          if [[ -z "$entry" || "$entry" == /* || "$entry" == \\* || "$entry" =~ ^[A-Za-z]: || "$entry" =~ (^|[\\/])[.][.][[:space:].]*([\\/]|$) ]]; then
            echo "::error title=KeyHog::GPU literal sidecar contains an unsafe path."
            exit 2
          fi
        done < <(tar -tzf "$bundle_dir/$sidecar")
        while IFS= read -r listing; do
          case "${listing:0:1}" in
            - | d) ;;
            l | h)
              echo "::error title=KeyHog::GPU literal sidecar contains a link entry."
              exit 2
              ;;
            *)
              echo "::error title=KeyHog::GPU literal sidecar contains an unsupported entry type."
              exit 2
              ;;
          esac
        done < <(tar -tvzf "$bundle_dir/$sidecar")

        extract_dir="$ACTION_RUNTIME/release-sidecar-${version}"
        if [[ -e "$extract_dir" || -L "$extract_dir" ]] || ! mkdir -- "$extract_dir"; then
          echo "::error title=KeyHog::Private sidecar extraction directory already exists or is unsafe."; exit 2
        fi
        chmod 700 "$extract_dir"
        tar -xzf "$bundle_dir/$sidecar" -C "$extract_dir"
        # The Action-owned cache root was removed above, so authenticated
        # artifacts from different versions can never coexist.
        if [[ "$lockdown" != "true" ]]; then
          keyhog_cache_dir="${programs_dir%/programs}"
          if [[ "$keyhog_cache_dir" == "$programs_dir" || -L "$keyhog_cache_dir" || -L "$programs_dir" ]]; then
            echo "::error title=KeyHog::GPU literal cache contains an unsafe owned-directory symlink."
            exit 2
          fi
          mkdir -p -- "$programs_dir"
          if [[ -L "$keyhog_cache_dir" || -L "$programs_dir" || ! -d "$programs_dir" ]]; then
            echo "::error title=KeyHog::GPU literal cache changed to an unsafe owned-directory symlink."
            exit 2
          fi
        fi
        artifact_count=0
        while IFS= read -r -d '' artifact; do
          artifact_count=$((artifact_count + 1))
          if [[ "$lockdown" == "true" ]]; then
            continue
          fi
          base="$(basename "$artifact")"
          staged_target="$(mktemp "$programs_dir/.${base}.XXXXXX")"
          if ! cp -- "$artifact" "$staged_target"; then
            echo "::error title=KeyHog::Could not stage GPU literal matcher artifact."
            exit 2
          fi
          if ! mv -f -- "$staged_target" "$programs_dir/$base"; then
            echo "::error title=KeyHog::Could not atomically install GPU literal matcher artifact."
            exit 2
          fi
          staged_target=""
        done < <(find "$extract_dir" -type f -name '*.bin' -print0)
        if [[ "$artifact_count" -eq 0 ]]; then
          echo "::error title=KeyHog::GPU literal sidecar contains no matcher artifacts."
          exit 2
        fi

        bin_name="keyhog"
        case "$asset" in *.exe) bin_name="keyhog.exe" ;; esac
        if command -v sha256sum >/dev/null 2>&1; then read -r binary_sha256 _ < <(sha256sum < "$bundle_dir/$asset"); else read -r binary_sha256 _ < <(shasum -a 256 < "$bundle_dir/$asset"); fi
        install_dir="$ACTION_RUNTIME/release-${version}-${binary_sha256}"
        if [[ -e "$install_dir" || -L "$install_dir" ]] || ! mkdir -- "$install_dir"; then
          echo "::error title=KeyHog::Private release install directory already exists or is unsafe."; exit 2
        fi
        chmod 700 "$install_dir"
        binary_tmp="$(mktemp "$install_dir/.keyhog.XXXXXXXX")"
        cat -- "$bundle_dir/$asset" > "$binary_tmp"
        if command -v sha256sum >/dev/null 2>&1; then read -r staged_sha256 _ < <(sha256sum < "$binary_tmp"); else read -r staged_sha256 _ < <(shasum -a 256 < "$binary_tmp"); fi
        if [[ "$staged_sha256" != "$binary_sha256" ]]; then echo "::error title=KeyHog::Authenticated release binary changed while staging."; exit 2; fi
        chmod 500 "$binary_tmp"
        published_binary="$install_dir/$bin_name"
        if [[ -e "$published_binary" || -L "$published_binary" ]] || ! ln "$binary_tmp" "$published_binary"; then
          echo "::error title=KeyHog::Refusing to replace a pre-existing release binary destination."; exit 2
        fi
        rm -f -- "$binary_tmp"
        printf 'binary-dir=%s\nbinary-path=%s\nfound=true\n' "$install_dir" "$published_binary" >> "$GITHUB_OUTPUT"
        if [[ "$lockdown" == "true" ]]; then
          echo "Downloaded and authenticated $asset plus $artifact_count GPU literal matcher artifact(s) for v$version; lockdown did not seed the isolated Action cache"
        else
          echo "Downloaded and authenticated $asset plus $artifact_count staged GPU literal matcher artifact(s) for v$version in the isolated Action cache"
        fi

    - name: Install Rust toolchain (source-build fallback)
      if: steps.download.outputs.found != 'true'
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
      with:
        toolchain: '1.89.0'

    - name: Cache cargo registry/build (source-build fallback)
      if: steps.download.outputs.found != 'true'
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2


    - name: Build keyhog from source (fallback)
      id: source
      if: steps.download.outputs.found != 'true'
      shell: bash
      env:
        ACTION_SOURCE_ROOT: ${{ github.action_path }}
        ACTION_RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        ACTION_RUNTIME: ${{ steps.runtime.outputs.path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        set -euo pipefail
        if [[ ! -f "$ACTION_SOURCE_ROOT/Cargo.toml" || ! -f "$ACTION_SOURCE_ROOT/scripts/release-version.sh" ]]; then
          if [[ "${ACTION_REPOSITORY:-}" == "${GITHUB_REPOSITORY:-}" && -f "${GITHUB_WORKSPACE:-}/Cargo.toml" && -f "${GITHUB_WORKSPACE:-}/scripts/release-version.sh" ]]; then
            ACTION_SOURCE_ROOT="$GITHUB_WORKSPACE"
          else
            echo "::error title=KeyHog::Action source tree is unavailable or does not match this repository."
            exit 2
          fi
        fi
        cd "$ACTION_SOURCE_ROOT"
        # Source refs retain the release profile for each platform. macOS adds
        # native Metal and WGPU without requiring Homebrew Vectorscan.
        source_features="portable"
        if [[ "${RUNNER_OS:-}" == "macOS" ]]; then source_features="portable,gpu"; fi
        cargo build --locked --release -p keyhog --no-default-features --features "$source_features"
        case "${RUNNER_OS:-}" in
          Windows) bin="target/release/keyhog.exe" ;;
          *) bin="target/release/keyhog" ;;
        esac
        if [[ ! -f "$bin" || -L "$bin" ]]; then echo "::error title=KeyHog::Source build did not publish a trusted regular binary."; exit 2; fi
        source_tmp="$(mktemp "$ACTION_RUNTIME/.source-keyhog.XXXXXXXX")"
        cat -- "$bin" > "$source_tmp"
        if command -v sha256sum >/dev/null 2>&1; then read -r source_sha256 _ < <(sha256sum < "$source_tmp"); else read -r source_sha256 _ < <(shasum -a 256 < "$source_tmp"); fi
        install_dir="$ACTION_RUNTIME/source-${ACTION_RESOLVED_VERSION}-${source_sha256}"
        if [[ -e "$install_dir" || -L "$install_dir" ]] || ! mkdir -- "$install_dir"; then echo "::error title=KeyHog::Private source install directory already exists or is unsafe."; exit 2; fi
        chmod 700 "$install_dir"
        chmod 500 "$source_tmp"
        published_binary="$install_dir/$(basename "$bin")"
        if [[ -e "$published_binary" || -L "$published_binary" ]] || ! ln "$source_tmp" "$published_binary"; then echo "::error title=KeyHog::Refusing to replace a pre-existing source binary destination."; exit 2; fi
        rm -f -- "$source_tmp"
        printf 'binary-dir=%s\nbinary-path=%s\n' "$install_dir" "$published_binary" >> "$GITHUB_OUTPUT"

    - name: Add keyhog to PATH
      shell: bash
      env:
        ACTION_BINARY_DIR: ${{ steps.download.outputs.binary-dir || steps.source.outputs.binary-dir }}
      run: echo "$ACTION_BINARY_DIR" >> "$GITHUB_PATH"

    - name: Calibrate autoroute for this scan
      id: calibration
      if: inputs.backend == '' || inputs.backend == 'auto'
      shell: bash
      env:
        ACTION_SCAN_PATH: ${{ inputs.path }}
        ACTION_SEVERITY: ${{ inputs.severity }}
        ACTION_BASELINE: ${{ inputs.baseline }}
        ACTION_PRESET: ${{ inputs.preset }}
        ACTION_LOCKDOWN: ${{ inputs.lockdown }}
        ACTION_CACHE_HOME: ${{ steps.runtime.outputs.path }}/cache
        ACTION_KEYHOG: ${{ steps.download.outputs.binary-path || steps.source.outputs.binary-path }}
        ACTION_RUNTIME: ${{ steps.runtime.outputs.path }}
      run: |
        set -euo pipefail
        action_cache_home="${ACTION_CACHE_HOME:-${RUNNER_TEMP:-${TMPDIR:-/tmp}}/keyhog-action-cache}"
        case "${RUNNER_OS:-}" in
          macOS) export HOME="$action_cache_home/home" ;;
          Windows) export LOCALAPPDATA="$(cygpath -w "$action_cache_home/localappdata")" ;;
          Linux | "") export XDG_CACHE_HOME="$action_cache_home/xdg" ;;
          *) echo "::error title=KeyHog::Unsupported runner for the isolated Action cache."; exit 2 ;;
        esac
        preset_flag=""
        case "${ACTION_PRESET:-default}" in
          default) ;;
          fast | deep | precision) preset_flag="--$ACTION_PRESET" ;;
          *)
            echo "::error title=KeyHog::Invalid preset. Use one of: default, fast, deep, precision."
            exit 2
            ;;
        esac
        case "${ACTION_LOCKDOWN:-false}" in
          true | false) ;;
          *)
            echo "::error title=KeyHog::Invalid lockdown. Use 'true' or 'false'."
            exit 2
            ;;
        esac
        if [[ "${ACTION_LOCKDOWN:-false}" == "true" && -n "${RUNNER_OS:-}" && "$RUNNER_OS" != "Linux" ]]; then
          echo "::error title=KeyHog::lockdown=true requires a Linux runner with sufficient locked-memory capacity. Configure a self-hosted Linux runner/container with a sufficient memlock limit (for example --cap-add IPC_LOCK or --ulimit memlock=-1:-1), or set lockdown:false."
          exit 2
        fi
        if [[ -z "${ACTION_RUNTIME:-}" || "$ACTION_RUNTIME" != "$RUNNER_TEMP"/* || ! -d "$ACTION_RUNTIME" || -L "$ACTION_RUNTIME" ]]; then
          echo "::error title=KeyHog::Private autoroute runtime is missing or untrusted."
          exit 2
        fi
        autoroute_dir="$ACTION_RUNTIME/autoroute"
        if [[ -e "$autoroute_dir" || -L "$autoroute_dir" ]] || ! mkdir -- "$autoroute_dir"; then
          echo "::error title=KeyHog::Private autoroute directory already exists or is unsafe."
          exit 2
        fi
        chmod 700 "$autoroute_dir"
        probe="$autoroute_dir/probe.json"
        route_cache="$autoroute_dir/route.json"
        for owned_path in "$probe" "$route_cache" "${route_cache}.lock"; do
          if [[ -e "$owned_path" || -L "$owned_path" ]]; then
            echo "::error title=KeyHog::Private autoroute destination was pre-existing or unsafe."
            exit 2
          fi
        done
        trap 'rm -f -- "$probe" "$route_cache" "${route_cache}.lock"' EXIT
        config_args=(
          config
          --effective
          --no-verify
          --path "$ACTION_SCAN_PATH"
          --severity "$ACTION_SEVERITY"
          --format json
          --autoroute-cache "$route_cache"
        )
        args=(
          scan
          --autoroute-calibrate
          --autoroute-gpu
          --no-verify
          --path "$ACTION_SCAN_PATH"
          --severity "$ACTION_SEVERITY"
          --format json
          --output "$probe"
          --autoroute-cache "$route_cache"
        )
        if [[ -n "$preset_flag" ]]; then
          config_args+=("$preset_flag")
          args+=("$preset_flag")
        fi
        if [[ "${ACTION_LOCKDOWN:-false}" == "true" ]]; then
          config_args+=(--lockdown)
          args+=(--lockdown)
        fi
        if [[ -n "${ACTION_BASELINE:-}" ]]; then
          config_args+=(--baseline "$ACTION_BASELINE")
          args+=(--baseline "$ACTION_BASELINE")
        fi
        set +e
        "$ACTION_KEYHOG" "${config_args[@]}" >/dev/null
        config_exit=$?
        set -e
        if [[ "$config_exit" != "0" ]]; then
          echo "::error title=KeyHog::Could not resolve the exact scan configuration before autoroute calibration. Run keyhog config --effective with the same path and policy inputs."
          exit "$config_exit"
        fi
        "$ACTION_KEYHOG" "${args[@]}"
        if [[ ! -s "$route_cache" || -L "$route_cache" ]]; then
          echo "::error title=KeyHog::Autoroute calibration did not publish a trusted routing receipt; set an explicit backend or fix calibration."
          exit 3
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          read -r route_sha256 _ < <(sha256sum < "$route_cache")
        elif command -v shasum >/dev/null 2>&1; then
          read -r route_sha256 _ < <(shasum -a 256 < "$route_cache")
        else
          echo "::error title=KeyHog::No SHA-256 implementation is available to bind the autoroute receipt."
          exit 2
        fi
        rm -f -- "$probe"
        if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
          printf 'cache=%s\n' "$route_cache" >> "$GITHUB_OUTPUT"
          printf 'cache-sha256=%s\n' "$route_sha256" >> "$GITHUB_OUTPUT"
          trap - EXIT
        fi

    - name: Run scan
      id: scan
      shell: bash
      # run-scan.sh fails when used alone, while the composite must still upload
      # its report before the receipt-driven final findings gate runs.
      continue-on-error: true
      env:
        ACTION_SOURCE_ROOT: ${{ steps.version.outputs.source-root }}
        ACTION_SCAN_PATH: ${{ inputs.path }}
        ACTION_SEVERITY: ${{ inputs.severity }}
        ACTION_FORMAT: ${{ inputs.format }}
        ACTION_VERIFY: ${{ inputs.verify }}
        ACTION_BASELINE: ${{ inputs.baseline }}
        ACTION_BACKEND: ${{ inputs.backend }}
        ACTION_PRESET: ${{ inputs.preset }}
        ACTION_LOCKDOWN: ${{ inputs.lockdown }}
        ACTION_OUTPUT: ${{ steps.outfile.outputs.name }}
        ACTION_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        ACTION_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        ACTION_CACHE_HOME: ${{ steps.runtime.outputs.path }}/cache
        ACTION_RUNTIME: ${{ steps.runtime.outputs.path }}
        KEYHOG_BIN: ${{ steps.download.outputs.binary-path || steps.source.outputs.binary-path }}
        ACTION_AUTOROUTE_CACHE: ${{ steps.calibration.outputs.cache }}
        ACTION_AUTOROUTE_CACHE_SHA256: ${{ steps.calibration.outputs.cache-sha256 }}
      run: |
        set -euo pipefail
        action_cache_home="${ACTION_CACHE_HOME:-${RUNNER_TEMP:-${TMPDIR:-/tmp}}/keyhog-action-cache}"
        case "${RUNNER_OS:-}" in
          macOS) export HOME="$action_cache_home/home" ;;
          Windows) export LOCALAPPDATA="$(cygpath -w "$action_cache_home/localappdata")" ;;
          Linux | "") export XDG_CACHE_HOME="$action_cache_home/xdg" ;;
          *) echo "::error title=KeyHog::Unsupported runner for the isolated Action cache."; exit 2 ;;
        esac
        if [[ "${ACTION_LOCKDOWN:-false}" == "true" && -n "${RUNNER_OS:-}" && "$RUNNER_OS" != "Linux" ]]; then
          echo "::error title=KeyHog::lockdown=true requires a Linux runner with sufficient locked-memory capacity. Configure a self-hosted Linux runner/container with a sufficient memlock limit (for example --cap-add IPC_LOCK or --ulimit memlock=-1:-1), or set lockdown:false."
          exit 2
        fi
        if [[ -n "${ACTION_AUTOROUTE_CACHE:-}" ]]; then
          case "$ACTION_AUTOROUTE_CACHE" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "::error title=KeyHog::Autoroute calibration receipt is outside RUNNER_TEMP."; exit 2 ;;
          esac
          if [[ ! -f "$ACTION_AUTOROUTE_CACHE" || -L "$ACTION_AUTOROUTE_CACHE" ]]; then
            echo "::error title=KeyHog::Autoroute calibration receipt is missing or untrusted; set an explicit backend or rerun calibration."
            exit 3
          fi
          trap 'rm -f -- "$ACTION_AUTOROUTE_CACHE"' EXIT
          if ! [[ "${ACTION_AUTOROUTE_CACHE_SHA256:-}" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo "::error title=KeyHog::Autoroute calibration receipt identity is missing or invalid."
            exit 3
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            read -r actual_route_sha256 _ < <(sha256sum < "$ACTION_AUTOROUTE_CACHE")
          elif command -v shasum >/dev/null 2>&1; then
            read -r actual_route_sha256 _ < <(shasum -a 256 < "$ACTION_AUTOROUTE_CACHE")
          else
            echo "::error title=KeyHog::No SHA-256 implementation is available to authenticate the autoroute receipt."
            exit 2
          fi
          if [[ "$actual_route_sha256" != "$ACTION_AUTOROUTE_CACHE_SHA256" ]]; then
            echo "::error title=KeyHog::Autoroute calibration receipt changed after calibration; refusing substituted routing state."
            exit 3
          fi
        fi
        args=(
          --print-effective-config
          --path "$ACTION_SCAN_PATH"
          --severity "$ACTION_SEVERITY"
          --format "$ACTION_FORMAT"
          --output "$ACTION_OUTPUT"
          --verify "$ACTION_VERIFY"
          --preset "$ACTION_PRESET"
          --lockdown "$ACTION_LOCKDOWN"
          --fail-on-findings "$ACTION_FAIL_ON_FINDINGS"
          --upload-sarif "$ACTION_UPLOAD_SARIF"
        )
        if [[ -n "${ACTION_BASELINE:-}" ]]; then
          args+=(--baseline "$ACTION_BASELINE")
        fi
        if [[ -n "${ACTION_BACKEND:-}" ]]; then
          args+=(--backend "$ACTION_BACKEND")
        fi
        if [[ -n "${ACTION_AUTOROUTE_CACHE:-}" ]]; then
          args+=(--autoroute-cache "$ACTION_AUTOROUTE_CACHE")
          args+=(--cleanup-autoroute-cache)
        fi
        set +e
        bash "$ACTION_SOURCE_ROOT/.github/actions/keyhog/run-scan.sh" "${args[@]}"
        runner_exit=$?
        set -e
        printf 'runner-exit-code=%s\n' "$runner_exit" >> "$GITHUB_OUTPUT"
        exit "$runner_exit"

    - name: Check receipt-bound report snapshot before upload
      id: report-check
      if: always()
      shell: bash
      env:
        ACTION_REPORT_NAME: ${{ steps.scan.outputs.report }}
        ACTION_REPORT_SHA256: ${{ steps.scan.outputs.report-sha256 }}
        ACTION_SCAN_REPORT_PRESENT: ${{ steps.scan.outputs.report-present }}
        ACTION_RUNTIME: ${{ steps.runtime.outputs.path }}
      run: |
        set -euo pipefail
        trusted=false
        if [[ "${ACTION_SCAN_REPORT_PRESENT:-}" == "true" && "$ACTION_REPORT_NAME" == "$ACTION_RUNTIME"/report-snapshot.*/* && -f "$ACTION_REPORT_NAME" && ! -L "$ACTION_REPORT_NAME" && "$ACTION_REPORT_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]]; then
          if command -v sha256sum >/dev/null 2>&1; then read -r actual_sha256 _ < <(sha256sum < "$ACTION_REPORT_NAME"); else read -r actual_sha256 _ < <(shasum -a 256 < "$ACTION_REPORT_NAME"); fi
          [[ "$actual_sha256" == "$ACTION_REPORT_SHA256" ]] && trusted=true
        fi
        if [[ "$trusted" == "true" ]]; then
          printf 'exists=true\npath=%s\n' "$ACTION_REPORT_NAME" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          if [[ "${ACTION_SCAN_REPORT_PRESENT:-}" == "true" ]]; then
            echo "::error title=KeyHog::Receipt-bound private report snapshot is missing or changed after verification."
            exit 3
          fi
          echo "::warning title=KeyHog::Scan did not publish a receipt-bound private report snapshot; skipping SARIF + artifact upload."
        fi

    - name: Upload SARIF to code-scanning
      # Fork PRs get a restricted GITHUB_TOKEN without security-events:write,
      # so codeql-action/upload-sarif 403s. Without continue-on-error the
      # whole external contributor PR fails on this step instead of just
      # missing the code-scanning surface. The downloadable workflow artifact
      # below stays available either way, so reviewers can grab the SARIF.
      # Trusted pushes/PRs are different: upload-sarif=true is an explicit
      # production CI contract, so upload failures must fail closed instead
      # of silently passing without Code Scanning annotations.
      if: inputs.format == 'sarif' && inputs.upload-sarif == 'true' && steps.report-check.outputs.exists == 'true'
      continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
      with:
        sarif_file: ${{ steps.report-check.outputs.path }}
        category: ${{ steps.outfile.outputs.category }}

    - name: Upload scan report as workflow artifact
      if: always() && steps.report-check.outputs.exists == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: keyhog-report-${{ steps.outfile.outputs.category }}-${{ github.job }}-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
        path: ${{ steps.report-check.outputs.path }}
        if-no-files-found: warn

    - name: Fail when findings reported
      # The runner is tolerated long enough to upload its report. Re-emit every
      # terminal scanner or wrapper failure here after those always-run steps.
      if: always() && (steps.scan.outcome == 'failure' || (steps.scan.outputs.runner-exit-code != '' && (steps.scan.outputs.runner-exit-code != '0' || (steps.scan.outputs.findings != '' && steps.scan.outputs.exit-code != '' && ((inputs.fail-on-findings == 'true' && (steps.scan.outputs.findings != '0' || steps.scan.outputs.exit-code == '1')) || steps.scan.outputs.exit-code == '10')))))
      shell: bash
      env:
        ACTION_RUNNER_EXIT_CODE: ${{ steps.scan.outputs.runner-exit-code }}
        ACTION_FINDINGS: ${{ steps.scan.outputs.findings }}
        ACTION_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        ACTION_SCAN_STATUS: ${{ steps.scan.outputs.scan-status }}
        ACTION_SEVERITY: ${{ inputs.severity }}
      run: |
        case "${ACTION_RUNNER_EXIT_CODE:-}" in
          "" | *[!0-9]*)
            echo "::error title=KeyHog::Invalid runner-exit-code output."
            exit 3
            ;;
        esac
        if [[ -z "${ACTION_FINDINGS:-}" || -z "${ACTION_EXIT_CODE:-}" ]]; then
          echo "::error title=KeyHog::Scan runner exited ${ACTION_RUNNER_EXIT_CODE} before publishing its receipt."
          exit "$ACTION_RUNNER_EXIT_CODE"
        fi
        case "$ACTION_RUNNER_EXIT_CODE" in
          0 | 1 | 10) ;;
          *)
            echo "::error title=KeyHog::Scan runner exited ${ACTION_RUNNER_EXIT_CODE} after publishing a failed receipt."
            exit "$ACTION_RUNNER_EXIT_CODE"
            ;;
        esac
        case "${ACTION_FINDINGS:-}" in
          "" | *[!0-9]*)
            echo "::error title=KeyHog::Invalid findings output."
            exit 3
            ;;
        esac
        case "${ACTION_EXIT_CODE:-}" in
          0 | 1 | 10) ;;
          "" | *[!0-9]*)
            echo "::error title=KeyHog::Invalid exit-code output."
            exit 3
            ;;
          *)
            echo "::error title=KeyHog::Unexpected scan exit code ${ACTION_EXIT_CODE}."
            exit "$ACTION_EXIT_CODE"
            ;;
        esac
        if [[ "${ACTION_SCAN_STATUS:-}" == "failed" && "$ACTION_EXIT_CODE" == "0" ]]; then
          echo "::error title=KeyHog::Scan wrapper failed while validating the clean report."
          exit 3
        fi
        if [[ "$ACTION_EXIT_CODE" == "10" ]]; then
          echo "::error title=KeyHog::LIVE credential(s) confirmed by --verify (exit 10)."
          exit 10
        fi
        if [[ "$ACTION_EXIT_CODE" == "1" && "$ACTION_FINDINGS" == "0" ]]; then
          echo "::error title=KeyHog::keyhog exited 1 (findings) but the report count is 0; treating as a findings failure (fail-on-findings)."
          exit 1
        fi
        echo "::error title=KeyHog::${ACTION_FINDINGS} finding(s) at or above '${ACTION_SEVERITY}' severity. Set fail-on-findings:false to ignore."
        exit 1
