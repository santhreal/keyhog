name: 'KeyHog Secret Scanner'
description: 'Scan a path for secrets, keep a report, and fail on policy-blocking findings by default.'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  path:
    description: 'File or directory to scan.'
    default: '.'
  severity:
    description: 'Minimum reported severity: info | client-safe | low | medium | high | critical.'
    default: 'high'
  format:
    description: 'Report format: text | json | sarif | jsonl.'
    default: 'sarif'
  verify:
    description: 'Set to "true" to verify findings with provider APIs.'
    default: 'false'
  version:
    description: |
      Published final KeyHog version v0.5.82 or newer to install from crates.io.
      Prereleases and build metadata are rejected. Leave unset to use the Action ref; branch and commit refs build from source.
    default: ''
  upload-sarif:
    description: 'Upload the report to GitHub Code Scanning when format is sarif.'
    default: 'true'
  analysis-category:
    description: |
      Stable lowercase identity for this scan. Use a distinct value for each
      monorepo or matrix partition. Allows 1-64 letters, digits, dots,
      underscores, or dashes, and must start and end with a letter or digit.
    default: 'keyhog'
  fail-on-findings:
    description: |
      Fail when the scanner's active evidence policy blocks findings. The
      default scanner policy blocks likely and confirmed findings while review
      findings remain visible. A verified-live credential always fails with
      exit code 10. Set to "false" to make non-live blocking findings advisory.
    default: 'true'
  evidence-policy:
    description: |
      Evidence tiers that block the scan: default blocks likely and confirmed;
      paranoid also blocks review. Findings remain visible under either policy.
      Published scanners without this flag retain their equivalent paranoid
      behavior for an explicit paranoid request and reject the default policy.
    default: 'default'
  baseline:
    description: |
      Committed baseline created with keyhog scan <PATH>
      --create-baseline <FILE>. Baseline findings are suppressed.
    default: ''
  backend:
    description: |
      Scan backend for a checked-out tree. Published refs use the lean CI build
      and accept auto or cpu. Portable branch and commit source refs require cpu.
    default: ''
  preset:
    description: 'Scan preset: default | fast | deep | precision.'
    default: 'default'
  lockdown:
    description: 'Set to "true" to enable lockdown protections independently of the scan preset.'
    default: 'false'

outputs:
  findings:
    description: 'Number of reported findings at or above `severity`.'
    value: ${{ steps.scan.outputs.findings }}
  exit-code:
    description: 'Raw KeyHog exit code. Common scan results are 0 policy success, 1 blocking findings, and 10 verified-live findings.'
    value: ${{ steps.scan.outputs.exit-code }}
  duration-ms:
    description: 'Scan duration in milliseconds.'
    value: ${{ steps.scan.outputs.duration-ms }}
  scan-status:
    description: 'Terminal coverage state: success, partial, cancelled, or failed; partial preserves the raw scan exit.'
    value: ${{ steps.scan.outputs.scan-status }}
  report-present:
    description: 'Whether a receipt-bound private report snapshot was published.'
    value: ${{ steps.scan.outputs.report-present }}
  report:
    description: 'Receipt-bound private report snapshot retained under RUNNER_TEMP until job cleanup.'
    value: ${{ steps.scan.outputs.report }}
  analysis-category:
    description: 'Validated report and Code Scanning partition identity.'
    value: ${{ steps.outfile.outputs.category }}

runs:
  using: 'composite'
  steps:
    - name: Initialize private Action runtime
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        if [[ -z "${RUNNER_TEMP:-}" || ! -d "$RUNNER_TEMP" || -L "$RUNNER_TEMP" ]]; then
          echo "::error title=KeyHog::RUNNER_TEMP must be a trusted non-symlink directory."
          exit 2
        fi
        runtime="$(mktemp -d "$RUNNER_TEMP/keyhog-action-runtime.XXXXXXXX")"
        if [[ ! -d "$runtime" || -L "$runtime" ]]; then
          echo "::error title=KeyHog::Could not create a private Action runtime."
          exit 2
        fi
        chmod 700 "$runtime"
        mkdir -- "$runtime/bin"
        chmod 700 "$runtime/bin"
        printf 'path=%s\n' "$runtime" >> "$GITHUB_OUTPUT"

    - name: Compute output filename
      id: outfile
      shell: bash
      env:
        ACTION_FORMAT: ${{ inputs.format }}
        ACTION_ANALYSIS_CATEGORY: ${{ inputs.analysis-category }}
      run: |
        set -euo pipefail
        category="${ACTION_ANALYSIS_CATEGORY:-}"
        if [[ -z "$category" || ${#category} -gt 64 || ! "$category" =~ ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$ ]]; then
          echo "::error title=KeyHog::Invalid analysis-category. Use 1-64 lowercase letters, digits, dot, underscore, or dash; start and end with a letter or digit."
          exit 2
        fi
        if [[ -n "${RUNNER_TEMP:-}" && -n "${GITHUB_RUN_ID:-}" && -n "${GITHUB_JOB:-}" ]]; then
          categories_root="${RUNNER_TEMP}/keyhog-analysis-categories"
          if [[ -e "$categories_root" || -L "$categories_root" ]]; then
            if [[ ! -d "$categories_root" || -L "$categories_root" ]]; then
              echo "::error title=KeyHog::Analysis-category identity root is unsafe."
              exit 2
            fi
          else
            mkdir -- "$categories_root"
          fi
          identity_root="${categories_root}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}-${GITHUB_JOB}"
          if [[ -e "$identity_root" || -L "$identity_root" ]]; then
            if [[ ! -d "$identity_root" || -L "$identity_root" ]]; then
              echo "::error title=KeyHog::Analysis-category job identity is unsafe."
              exit 2
            fi
          else
            mkdir -- "$identity_root"
          fi
          if ! mkdir -- "${identity_root}/${category}" 2>/dev/null; then
            echo "::error title=KeyHog::Conflicting analysis-category. Every KeyHog scan in one job must use a distinct category."
            exit 2
          fi
        fi
        ext="json"
        case "${ACTION_FORMAT:-sarif}" in
          sarif) ext="sarif" ;;
          jsonl) ext="jsonl" ;;
          text)  ext="txt" ;;
        esac
        printf 'category=%s\n' "$category" >> "$GITHUB_OUTPUT"
        printf 'name=keyhog-results-%s.%s\n' "$category" "$ext" >> "$GITHUB_OUTPUT"

    - name: Resolve KeyHog version
      id: version
      shell: bash
      env:
        ACTION_VERSION: ${{ inputs.version }}
        ACTION_SOURCE_ROOT: ${{ github.action_path }}
        ACTION_BACKEND: ${{ inputs.backend }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        set -euo pipefail
        if [[ ! -f "$ACTION_SOURCE_ROOT/Cargo.toml" || ! -f "$ACTION_SOURCE_ROOT/scripts/release-version.sh" ]]; then
          if [[ "${ACTION_REPOSITORY:-}" == "${GITHUB_REPOSITORY:-}" && -f "${GITHUB_WORKSPACE:-}/Cargo.toml" && -f "${GITHUB_WORKSPACE:-}/scripts/release-version.sh" ]]; then
            ACTION_SOURCE_ROOT="$GITHUB_WORKSPACE"
          else
            echo "::error title=KeyHog::Action source tree is unavailable or does not match this repository."
            exit 2
          fi
        fi
        # Always initialize under `set -u` (KH-1267): branch/SHA refs never set
        # `v` in older revisions and aborted with "v: unbound variable".
        v=""
        release_required=false
        workspace_version_from_cargo() {
          local manifest="$1"
          awk '
            $0 == "[workspace.package]" { in_workspace_package = 1; next }
            in_workspace_package && /^\[/ { exit }
            in_workspace_package && $1 == "version" {
              gsub(/\"/, "", $3)
              print $3
              exit
            }
          ' "$manifest"
        }
        if [[ -n "${ACTION_VERSION:-}" ]]; then
          if ! normalized_tag="$(bash "$ACTION_SOURCE_ROOT/scripts/release-version.sh" "$ACTION_VERSION")"; then
            echo "::error title=KeyHog::Invalid version. Explicit version must be MAJOR.MINOR.PATCH with an optional prerelease suffix."
            exit 2
          fi
          v="${normalized_tag#v}"
          release_required=true
        else
          # GITHUB_ACTION_REF is e.g. "v0.5.12", "main", a SHA, or a branch.
          ref="${GITHUB_ACTION_REF:-main}"
          if [[ "$ref" =~ ^v[0-9]+[.] ]]; then
            if ! normalized_tag="$(bash "$ACTION_SOURCE_ROOT/scripts/release-version.sh" "$ref")"; then
              echo "::error title=KeyHog::Invalid action ref. Release refs must be vMAJOR.MINOR.PATCH with an optional prerelease suffix."
              exit 2
            fi
            v="${normalized_tag#v}"
            release_required=true
          elif [[ "$ref" =~ ^v([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            manifest="$ACTION_SOURCE_ROOT/Cargo.toml"
            if [[ ! -f "$manifest" ]]; then
              echo "::error title=KeyHog::Floating release ref cannot resolve its exact version because Cargo.toml is unavailable."
              exit 2
            fi
            workspace_version="$(workspace_version_from_cargo "$manifest")"
            if ! normalized_tag="$(bash "$ACTION_SOURCE_ROOT/scripts/release-version.sh" "$workspace_version")"; then
              echo "::error title=KeyHog::Floating release ref found a noncanonical version in Cargo.toml."
              exit 2
            fi
            v="${normalized_tag#v}"
            if [[ "${v%%.*}" != "$major" ]]; then
              echo "::error title=KeyHog::Floating release ref does not match the exact version in Cargo.toml."
              exit 2
            fi
            release_required=true
          else
            # Branch / SHA / other non-release refs: source-build path. Record
            # the workspace package version for logs only; never require assets.
            manifest="$ACTION_SOURCE_ROOT/Cargo.toml"
            if [[ -f "$manifest" ]]; then
              v="$(workspace_version_from_cargo "$manifest")"
            fi
            if [[ -z "$v" ]]; then
              v="source"
            fi
            release_required=false
          fi
        fi
        case "$v" in
          "" | *[!A-Za-z0-9._/-]*)
            echo "::error title=KeyHog::Invalid version. Use only letters, digits, dot, dash, underscore, or slash."
            exit 2
            ;;
        esac
        if [[ "$release_required" == "true" ]]; then
          core_version="${v%%-*}"
          IFS='.' read -r version_major version_minor version_patch <<< "$core_version"
          if (( 10#$version_major == 0 && (10#$version_minor < 5 || (10#$version_minor == 5 && 10#$version_patch < 48)) )) || [[ "$v" == *-* ]]; then
            echo "::error title=KeyHog::Prereleases and release versions older than final v0.5.48 do not support this Action's stable runtime contract."
            exit 2
          fi
        fi
        if [[ "$release_required" == "true" ]]; then
          case "${ACTION_BACKEND:-}" in
            "" | auto | cpu) ;;
            *)
              echo "::error title=KeyHog::Published Action refs use the lean CI build. Choose backend: auto or backend: cpu. Run accelerator diagnostics on a self-hosted CLI installation."
              exit 2
              ;;
          esac
        fi
        if [[ "$release_required" == "false" && "${ACTION_BACKEND:-}" != "cpu" ]]; then
          echo "::error title=KeyHog::Portable branch and commit source refs require backend: cpu. Use an exact or floating published release ref for calibrated backend:auto."
          exit 2
        fi
        printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"
        printf 'release_required=%s\n' "$release_required" >> "$GITHUB_OUTPUT"
        printf 'source-root=%s\n' "$ACTION_SOURCE_ROOT" >> "$GITHUB_OUTPUT"
        printf 'Resolved keyhog version: %s\n' "$v"
        printf 'Published crate required: %s\n' "$release_required"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
      with:
        toolchain: '1.89.0'

    - name: Cache cargo registry/build
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

    - name: Install keyhog
      id: install
      shell: bash
      env:
        ACTION_SOURCE_ROOT: ${{ github.action_path }}
        ACTION_RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        ACTION_RELEASE_REQUIRED: ${{ steps.version.outputs.release_required }}
        ACTION_RUNTIME: ${{ steps.runtime.outputs.path }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_CACHE_HOME: ${{ steps.runtime.outputs.path }}/cache
      run: |
        set -euo pipefail
        version="${ACTION_RESOLVED_VERSION:-}"
        release_required="${ACTION_RELEASE_REQUIRED:-false}"
        if [[ -z "$version" ]]; then
          echo "::error title=KeyHog::Resolved version is missing."
          exit 2
        fi
        install_root="$ACTION_RUNTIME/install-$version"
        if [[ -e "$install_root" || -L "$install_root" ]] || ! mkdir -- "$install_root"; then
          echo "::error title=KeyHog::Private install directory already exists or is unsafe."
          exit 2
        fi
        chmod 700 "$install_root"
        case "${RUNNER_OS:-}" in
          Windows) bin_name="keyhog.exe" ;;
          *) bin_name="keyhog" ;;
        esac
        if [[ "$release_required" == "true" ]]; then
          cargo install --locked --version "=$version" --root "$install_root" --no-default-features --features ci keyhog
          published_binary="$install_root/bin/$bin_name"
        else
          if [[ ! -f "$ACTION_SOURCE_ROOT/Cargo.toml" || ! -f "$ACTION_SOURCE_ROOT/scripts/release-version.sh" ]]; then
            if [[ "${ACTION_REPOSITORY:-}" == "${GITHUB_REPOSITORY:-}" && -f "${GITHUB_WORKSPACE:-}/Cargo.toml" && -f "${GITHUB_WORKSPACE:-}/scripts/release-version.sh" ]]; then
              ACTION_SOURCE_ROOT="$GITHUB_WORKSPACE"
            else
              echo "::error title=KeyHog::Action source tree is unavailable or does not match this repository."
              exit 2
            fi
          fi
          cd "$ACTION_SOURCE_ROOT"
          source_features="portable"
          if [[ "${RUNNER_OS:-}" == "macOS" ]]; then source_features="portable,gpu"; fi
          cargo build --locked --release -p keyhog --no-default-features --features "$source_features"
          case "${RUNNER_OS:-}" in
            Windows) source_binary="target/release/keyhog.exe" ;;
            *) source_binary="target/release/keyhog" ;;
          esac
          if [[ ! -f "$source_binary" || -L "$source_binary" ]]; then
            echo "::error title=KeyHog::Source build did not produce a trusted regular binary."
            exit 2
          fi
          mkdir -- "$install_root/bin"
          published_binary="$install_root/bin/$bin_name"
          cat -- "$source_binary" > "$published_binary"
        fi
        if [[ ! -f "$published_binary" || -L "$published_binary" ]]; then
          echo "::error title=KeyHog::Cargo did not install a trusted regular KeyHog binary."
          exit 2
        fi
        chmod 500 "$published_binary"
        action_cache_home="${ACTION_CACHE_HOME:-${ACTION_RUNTIME:-${RUNNER_TEMP:-${TMPDIR:-/tmp}}}/cache}"
        case "${RUNNER_OS:-}" in
          macOS)
            export HOME="$action_cache_home/home"
            pack_root="$HOME/Library/Caches/keyhog/execution-packs"
            ;;
          Windows)
            export LOCALAPPDATA="$(cygpath -w "$action_cache_home/localappdata" 2>/dev/null || echo "$action_cache_home/localappdata")"
            pack_root="$action_cache_home/localappdata/keyhog/execution-packs"
            ;;
          Linux | "")
            export XDG_CACHE_HOME="$action_cache_home/xdg"
            pack_root="$XDG_CACHE_HOME/keyhog/execution-packs"
            ;;
          *) echo "::error title=KeyHog::Unsupported runner for the isolated Action cache."; exit 2 ;;
        esac
        mkdir -p "$pack_root"
        chmod 700 "$pack_root" 2>/dev/null || true
        key_path="$pack_root/signing.key"
        if [[ ! -f "$key_path" ]]; then
          if command -v openssl >/dev/null 2>&1; then
            openssl rand 32 > "$key_path"
          elif [[ -c /dev/urandom ]]; then
            head -c 32 /dev/urandom > "$key_path"
          fi
          chmod 600 "$key_path" 2>/dev/null || true
        fi
        if "$published_binary" compile-execution-packs --help >/dev/null 2>&1; then
          "$published_binary" compile-execution-packs --output-dir "$pack_root/current" --signing-key "$key_path"
        fi
        printf 'binary-dir=%s\nbinary-path=%s\n' "$install_root/bin" "$published_binary" >> "$GITHUB_OUTPUT"

    - name: Add keyhog to PATH
      shell: bash
      env:
        ACTION_BINARY_DIR: ${{ steps.install.outputs.binary-dir }}
      run: echo "$ACTION_BINARY_DIR" >> "$GITHUB_PATH"

    - name: Calibrate autoroute for this scan
      id: calibration
      if: inputs.backend == '' || inputs.backend == 'auto'
      shell: bash
      env:
        ACTION_SCAN_PATH: ${{ inputs.path }}
        ACTION_SEVERITY: ${{ inputs.severity }}
        ACTION_BASELINE: ${{ inputs.baseline }}
        ACTION_PRESET: ${{ inputs.preset }}
        ACTION_LOCKDOWN: ${{ inputs.lockdown }}
        ACTION_EVIDENCE_POLICY: ${{ inputs.evidence-policy }}
        ACTION_RELEASE_REQUIRED: ${{ steps.version.outputs.release_required }}
        ACTION_CACHE_HOME: ${{ steps.runtime.outputs.path }}/cache
        ACTION_KEYHOG: ${{ steps.install.outputs.binary-path }}
        ACTION_RUNTIME: ${{ steps.runtime.outputs.path }}
      run: |
        set -euo pipefail
        action_cache_home="${ACTION_CACHE_HOME:-${RUNNER_TEMP:-${TMPDIR:-/tmp}}/keyhog-action-cache}"
        case "${RUNNER_OS:-}" in
          macOS) export HOME="$action_cache_home/home" ;;
          Windows) export LOCALAPPDATA="$(cygpath -w "$action_cache_home/localappdata")" ;;
          Linux | "") export XDG_CACHE_HOME="$action_cache_home/xdg" ;;
          *) echo "::error title=KeyHog::Unsupported runner for the isolated Action cache."; exit 2 ;;
        esac
        preset_flag=""
        case "${ACTION_PRESET:-default}" in
          default) ;;
          fast | deep | precision) preset_flag="--$ACTION_PRESET" ;;
          *)
            echo "::error title=KeyHog::Invalid preset. Use one of: default, fast, deep, precision."
            exit 2
            ;;
        esac
        case "${ACTION_LOCKDOWN:-false}" in
          true | false) ;;
          *)
            echo "::error title=KeyHog::Invalid lockdown. Use 'true' or 'false'."
            exit 2
            ;;
        esac
        case "${ACTION_EVIDENCE_POLICY:-default}" in
          default | paranoid) ;;
          *)
            echo "::error title=KeyHog::Invalid evidence-policy. Use one of: default, paranoid."
            exit 2
            ;;
        esac
        evidence_policy="${ACTION_EVIDENCE_POLICY:-default}"
        evidence_policy_args=(--evidence-policy "$evidence_policy")
        if [[ "${ACTION_RELEASE_REQUIRED:-false}" == "true" ]]; then
          set +e
          evidence_help="$("$ACTION_KEYHOG" scan --help 2>&1)"
          evidence_help_exit=$?
          set -e
          if [[ "$evidence_help_exit" != "0" ]]; then
            echo "::error title=KeyHog::Published keyhog could not report whether it supports --evidence-policy."
            exit 2
          fi
          if [[ "$evidence_help" != *"--evidence-policy"* ]]; then
            if [[ "$evidence_policy" != "paranoid" ]]; then
              echo "::error title=KeyHog::Published keyhog lacks --evidence-policy and cannot implement the requested default blocking policy."
              exit 2
            fi
            evidence_policy_args=()
            echo "::notice title=KeyHog::Published keyhog predates --evidence-policy; its blocking behavior is equivalent to paranoid."
          fi
        fi
        if [[ "${ACTION_LOCKDOWN:-false}" == "true" && -n "${RUNNER_OS:-}" && "$RUNNER_OS" != "Linux" ]]; then
          echo "::error title=KeyHog::lockdown=true requires a Linux runner with sufficient locked-memory capacity. Configure a self-hosted Linux runner/container with a sufficient memlock limit (for example --cap-add IPC_LOCK or --ulimit memlock=-1:-1), or set lockdown:false."
          exit 2
        fi
        if [[ -z "${ACTION_RUNTIME:-}" || "$ACTION_RUNTIME" != "$RUNNER_TEMP"/* || ! -d "$ACTION_RUNTIME" || -L "$ACTION_RUNTIME" ]]; then
          echo "::error title=KeyHog::Private autoroute runtime is missing or untrusted."
          exit 2
        fi
        autoroute_dir="$ACTION_RUNTIME/autoroute"
        if [[ -e "$autoroute_dir" || -L "$autoroute_dir" ]] || ! mkdir -- "$autoroute_dir"; then
          echo "::error title=KeyHog::Private autoroute directory already exists or is unsafe."
          exit 2
        fi
        chmod 700 "$autoroute_dir"
        probe="$autoroute_dir/probe.json"
        route_cache="$autoroute_dir/route.json"
        for owned_path in "$probe" "$route_cache" "${route_cache}.lock"; do
          if [[ -e "$owned_path" || -L "$owned_path" ]]; then
            echo "::error title=KeyHog::Private autoroute destination was pre-existing or unsafe."
            exit 2
          fi
        done
        trap 'rm -f -- "$probe" "$route_cache" "${route_cache}.lock"' EXIT
        config_args=(
          config
          --effective
          --no-verify
          --path "$ACTION_SCAN_PATH"
          --severity "$ACTION_SEVERITY"
          --format json
          --autoroute-cache "$route_cache"
        )
        args=(
          scan
          --autoroute-calibrate
          --autoroute-gpu
          --no-verify
          --path "$ACTION_SCAN_PATH"
          --severity "$ACTION_SEVERITY"
          --format json
          --output "$probe"
          --autoroute-cache "$route_cache"
        )
        config_args+=("${evidence_policy_args[@]}")
        args+=("${evidence_policy_args[@]}")
        if [[ -n "$preset_flag" ]]; then
          config_args+=("$preset_flag")
          args+=("$preset_flag")
        fi
        if [[ "${ACTION_LOCKDOWN:-false}" == "true" ]]; then
          config_args+=(--lockdown)
          args+=(--lockdown)
        fi
        if [[ -n "${ACTION_BASELINE:-}" ]]; then
          config_args+=(--baseline "$ACTION_BASELINE")
          args+=(--baseline "$ACTION_BASELINE")
        fi
        set +e
        "$ACTION_KEYHOG" "${config_args[@]}" >/dev/null
        config_exit=$?
        set -e
        if [[ "$config_exit" != "0" ]]; then
          echo "::error title=KeyHog::Could not resolve the exact scan configuration before autoroute calibration. Run keyhog config --effective with the same path and policy inputs."
          exit "$config_exit"
        fi
        "$ACTION_KEYHOG" "${args[@]}"
        if [[ ! -s "$route_cache" || -L "$route_cache" ]]; then
          echo "::error title=KeyHog::Autoroute calibration did not publish a trusted routing receipt; set an explicit backend or fix calibration."
          exit 3
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          read -r route_sha256 _ < <(sha256sum < "$route_cache")
        elif command -v shasum >/dev/null 2>&1; then
          read -r route_sha256 _ < <(shasum -a 256 < "$route_cache")
        else
          echo "::error title=KeyHog::No SHA-256 implementation is available to bind the autoroute receipt."
          exit 2
        fi
        rm -f -- "$probe"
        if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
          printf 'cache=%s\n' "$route_cache" >> "$GITHUB_OUTPUT"
          printf 'cache-sha256=%s\n' "$route_sha256" >> "$GITHUB_OUTPUT"
          trap - EXIT
        fi

    - name: Run scan
      id: scan
      shell: bash
      # run-scan.sh fails when used alone, while the composite must still upload
      # its report before the receipt-driven final findings gate runs.
      continue-on-error: true
      env:
        ACTION_SOURCE_ROOT: ${{ steps.version.outputs.source-root }}
        ACTION_SCAN_PATH: ${{ inputs.path }}
        ACTION_SEVERITY: ${{ inputs.severity }}
        ACTION_FORMAT: ${{ inputs.format }}
        ACTION_VERIFY: ${{ inputs.verify }}
        ACTION_BASELINE: ${{ inputs.baseline }}
        ACTION_BACKEND: ${{ inputs.backend }}
        ACTION_PRESET: ${{ inputs.preset }}
        ACTION_LOCKDOWN: ${{ inputs.lockdown }}
        ACTION_OUTPUT: ${{ steps.outfile.outputs.name }}
        ACTION_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        ACTION_EVIDENCE_POLICY: ${{ inputs.evidence-policy }}
        ACTION_RELEASE_REQUIRED: ${{ steps.version.outputs.release_required }}
        ACTION_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        ACTION_CACHE_HOME: ${{ steps.runtime.outputs.path }}/cache
        ACTION_RUNTIME: ${{ steps.runtime.outputs.path }}
        KEYHOG_BIN: ${{ steps.install.outputs.binary-path }}
        ACTION_AUTOROUTE_CACHE: ${{ steps.calibration.outputs.cache }}
        ACTION_AUTOROUTE_CACHE_SHA256: ${{ steps.calibration.outputs.cache-sha256 }}
      run: |
        set -euo pipefail
        action_cache_home="${ACTION_CACHE_HOME:-${RUNNER_TEMP:-${TMPDIR:-/tmp}}/keyhog-action-cache}"
        case "${RUNNER_OS:-}" in
          macOS) export HOME="$action_cache_home/home" ;;
          Windows) export LOCALAPPDATA="$(cygpath -w "$action_cache_home/localappdata")" ;;
          Linux | "") export XDG_CACHE_HOME="$action_cache_home/xdg" ;;
          *) echo "::error title=KeyHog::Unsupported runner for the isolated Action cache."; exit 2 ;;
        esac
        if [[ "${ACTION_LOCKDOWN:-false}" == "true" && -n "${RUNNER_OS:-}" && "$RUNNER_OS" != "Linux" ]]; then
          echo "::error title=KeyHog::lockdown=true requires a Linux runner with sufficient locked-memory capacity. Configure a self-hosted Linux runner/container with a sufficient memlock limit (for example --cap-add IPC_LOCK or --ulimit memlock=-1:-1), or set lockdown:false."
          exit 2
        fi
        if [[ -n "${ACTION_AUTOROUTE_CACHE:-}" ]]; then
          case "$ACTION_AUTOROUTE_CACHE" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "::error title=KeyHog::Autoroute calibration receipt is outside RUNNER_TEMP."; exit 2 ;;
          esac
          if [[ ! -f "$ACTION_AUTOROUTE_CACHE" || -L "$ACTION_AUTOROUTE_CACHE" ]]; then
            echo "::error title=KeyHog::Autoroute calibration receipt is missing or untrusted; set an explicit backend or rerun calibration."
            exit 3
          fi
          trap 'rm -f -- "$ACTION_AUTOROUTE_CACHE"' EXIT
          if ! [[ "${ACTION_AUTOROUTE_CACHE_SHA256:-}" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo "::error title=KeyHog::Autoroute calibration receipt identity is missing or invalid."
            exit 3
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            read -r actual_route_sha256 _ < <(sha256sum < "$ACTION_AUTOROUTE_CACHE")
          elif command -v shasum >/dev/null 2>&1; then
            read -r actual_route_sha256 _ < <(shasum -a 256 < "$ACTION_AUTOROUTE_CACHE")
          else
            echo "::error title=KeyHog::No SHA-256 implementation is available to authenticate the autoroute receipt."
            exit 2
          fi
          if [[ "$actual_route_sha256" != "$ACTION_AUTOROUTE_CACHE_SHA256" ]]; then
            echo "::error title=KeyHog::Autoroute calibration receipt changed after calibration; refusing substituted routing state."
            exit 3
          fi
        fi
        args=(
          --print-effective-config
          --path "$ACTION_SCAN_PATH"
          --severity "$ACTION_SEVERITY"
          --format "$ACTION_FORMAT"
          --output "$ACTION_OUTPUT"
          --verify "$ACTION_VERIFY"
          --preset "$ACTION_PRESET"
          --lockdown "$ACTION_LOCKDOWN"
          --fail-on-findings "$ACTION_FAIL_ON_FINDINGS"
          --evidence-policy "${ACTION_EVIDENCE_POLICY:-default}"
          --upload-sarif "$ACTION_UPLOAD_SARIF"
        )
        if [[ -n "${ACTION_BASELINE:-}" ]]; then
          args+=(--baseline "$ACTION_BASELINE")
        fi
        if [[ -n "${ACTION_BACKEND:-}" ]]; then
          args+=(--backend "$ACTION_BACKEND")
        fi
        if [[ -n "${ACTION_AUTOROUTE_CACHE:-}" ]]; then
          args+=(--autoroute-cache "$ACTION_AUTOROUTE_CACHE")
          args+=(--cleanup-autoroute-cache)
        fi
        set +e
        bash "$ACTION_SOURCE_ROOT/.github/actions/keyhog/run-scan.sh" "${args[@]}"
        runner_exit=$?
        set -e
        printf 'runner-exit-code=%s\n' "$runner_exit" >> "$GITHUB_OUTPUT"
        exit "$runner_exit"

    - name: Check receipt-bound report snapshot before upload
      id: report-check
      if: always()
      shell: bash
      env:
        ACTION_REPORT_NAME: ${{ steps.scan.outputs.report }}
        ACTION_REPORT_SHA256: ${{ steps.scan.outputs.report-sha256 }}
        ACTION_SCAN_REPORT_PRESENT: ${{ steps.scan.outputs.report-present }}
        ACTION_RUNTIME: ${{ steps.runtime.outputs.path }}
      run: |
        set -euo pipefail
        trusted=false
        if [[ "${ACTION_SCAN_REPORT_PRESENT:-}" == "true" && "$ACTION_REPORT_NAME" == "$ACTION_RUNTIME"/report-snapshot.*/* && -f "$ACTION_REPORT_NAME" && ! -L "$ACTION_REPORT_NAME" && "$ACTION_REPORT_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]]; then
          if command -v sha256sum >/dev/null 2>&1; then read -r actual_sha256 _ < <(sha256sum < "$ACTION_REPORT_NAME"); else read -r actual_sha256 _ < <(shasum -a 256 < "$ACTION_REPORT_NAME"); fi
          [[ "$actual_sha256" == "$ACTION_REPORT_SHA256" ]] && trusted=true
        fi
        if [[ "$trusted" == "true" ]]; then
          printf 'exists=true\npath=%s\n' "$ACTION_REPORT_NAME" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          if [[ "${ACTION_SCAN_REPORT_PRESENT:-}" == "true" ]]; then
            echo "::error title=KeyHog::Receipt-bound private report snapshot is missing or changed after verification."
            exit 3
          fi
          echo "::warning title=KeyHog::Scan did not publish a receipt-bound private report snapshot; skipping SARIF + artifact upload."
        fi

    - name: Upload SARIF to code-scanning
      id: sarif-primary
      # The first attempt is tolerated so trusted jobs can retry transient
      # GitHub API failures. The enforcement step below fails closed when both
      # trusted attempts fail. Restricted fork PR failures remain advisory.
      if: inputs.format == 'sarif' && inputs.upload-sarif == 'true' && steps.report-check.outputs.exists == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
      with:
        sarif_file: ${{ steps.report-check.outputs.path }}
        category: ${{ steps.outfile.outputs.category }}

    - name: Retry trusted SARIF upload
      id: sarif-retry
      if: ${{ inputs.format == 'sarif' && inputs.upload-sarif == 'true' && steps.report-check.outputs.exists == 'true' && steps.sarif-primary.outcome == 'failure' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
      with:
        sarif_file: ${{ steps.report-check.outputs.path }}
        category: ${{ steps.outfile.outputs.category }}

    - name: Upload scan report as workflow artifact
      if: always() && steps.report-check.outputs.exists == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: keyhog-report-${{ steps.outfile.outputs.category }}-${{ github.job }}-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
        path: ${{ steps.report-check.outputs.path }}
        if-no-files-found: warn

    - name: Fail when trusted SARIF uploads are unavailable
      if: ${{ always() && inputs.format == 'sarif' && inputs.upload-sarif == 'true' && steps.report-check.outputs.exists == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && steps.sarif-primary.outcome == 'failure' && steps.sarif-retry.outcome != 'success' }}
      shell: bash
      run: |
        echo "::error title=KeyHog::Both trusted SARIF upload attempts failed. The report artifact remains available."
        exit 1

    - name: Fail when findings reported
      # The runner is tolerated long enough to upload its report. Re-emit every
      # terminal scanner or wrapper failure here after those always-run steps.
      if: always() && (steps.scan.outcome == 'failure' || (steps.scan.outputs.runner-exit-code != '' && (steps.scan.outputs.runner-exit-code != '0' || (steps.scan.outputs.findings != '' && steps.scan.outputs.exit-code != '' && ((inputs.fail-on-findings == 'true' && steps.scan.outputs.exit-code == '1') || steps.scan.outputs.exit-code == '10')))))
      shell: bash
      env:
        ACTION_RUNNER_EXIT_CODE: ${{ steps.scan.outputs.runner-exit-code }}
        ACTION_FINDINGS: ${{ steps.scan.outputs.findings }}
        ACTION_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        ACTION_SCAN_STATUS: ${{ steps.scan.outputs.scan-status }}
        ACTION_SEVERITY: ${{ inputs.severity }}
      run: |
        case "${ACTION_RUNNER_EXIT_CODE:-}" in
          "" | *[!0-9]*)
            echo "::error title=KeyHog::Invalid runner-exit-code output."
            exit 3
            ;;
        esac
        if [[ -z "${ACTION_FINDINGS:-}" || -z "${ACTION_EXIT_CODE:-}" ]]; then
          echo "::error title=KeyHog::Scan runner exited ${ACTION_RUNNER_EXIT_CODE} before publishing its receipt."
          exit "$ACTION_RUNNER_EXIT_CODE"
        fi
        case "$ACTION_RUNNER_EXIT_CODE" in
          0 | 1 | 10) ;;
          *)
            echo "::error title=KeyHog::Scan runner exited ${ACTION_RUNNER_EXIT_CODE} after publishing a failed receipt."
            exit "$ACTION_RUNNER_EXIT_CODE"
            ;;
        esac
        case "${ACTION_FINDINGS:-}" in
          "" | *[!0-9]*)
            echo "::error title=KeyHog::Invalid findings output."
            exit 3
            ;;
        esac
        case "${ACTION_EXIT_CODE:-}" in
          0 | 1 | 10) ;;
          "" | *[!0-9]*)
            echo "::error title=KeyHog::Invalid exit-code output."
            exit 3
            ;;
          *)
            echo "::error title=KeyHog::Unexpected scan exit code ${ACTION_EXIT_CODE}."
            exit "$ACTION_EXIT_CODE"
            ;;
        esac
        if [[ "${ACTION_SCAN_STATUS:-}" == "failed" && "$ACTION_EXIT_CODE" == "0" ]]; then
          echo "::error title=KeyHog::Scan wrapper failed while validating the clean report."
          exit 3
        fi
        if [[ "$ACTION_EXIT_CODE" == "10" ]]; then
          echo "::error title=KeyHog::LIVE credential(s) confirmed by --verify (exit 10)."
          exit 10
        fi
        if [[ "$ACTION_EXIT_CODE" == "1" && "$ACTION_FINDINGS" == "0" ]]; then
          echo "::error title=KeyHog::keyhog exited 1 (blocking findings) but the report count is 0; treating as a policy failure."
          exit 1
        fi
        echo "::error title=KeyHog::${ACTION_FINDINGS} finding(s) block the active evidence policy at or above '${ACTION_SEVERITY}' severity. Set fail-on-findings:false to make non-live blocking findings advisory."
        exit 1
