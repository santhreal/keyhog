schema_version = 1
detector_id = "sidekiq-secret"
service = "sidekiq"
severity = "high"

[[positive]]
text = "export BUNDLE_ENTERPRISE__CONTRIBSYS__COM=cafebabe:deadbeef"
credential = "cafebabe:deadbeef"
reason = "Sidekiq enterprise bundle license token."

[[positive]]
text = "BUNDLE_GEMS__CONTRIBSYS__COM: \"cafebabe:deadbeef\""
credential = "cafebabe:deadbeef"
reason = "Sidekiq gems bundle license token in YAML."

[[negative]]
text = "export BUNDLE_ENTERPRISE__CONTRIBSYS__COM=short"
reason = "Wrong shape."

[[negative]]
text = "BUNDLE_ENTERPRISE__CONTRIBSYS__COM=YOUR_KEY_HERE"
reason = "Placeholder."

[[evasion]]
text = "# export BUNDLE_ENTERPRISE__CONTRIBSYS__COM=cafebabe:deadbeef"
credential = "cafebabe:deadbeef"
reason = "Commented shell config."
