# Per-detector contract: oauth-client-secret

schema_version = 1
detector_id = "oauth-client-secret"
service = "generic"
severity = "high"

[[positive]]
text = "client_secret = C113nt53KR3TN6N90yVuAgICxIRwsObLi0E67/N8eRN="
credential = "C113nt53KR3TN6N90yVuAgICxIRwsObLi0E67/N8eRN="
reason = "Canonical OAuth client_secret assignment with a base64 credential."

[[positive]]
text = 'clientSecret: "0F12A345BB67C8D901EFG23H45IJKL67MNO89PQ12RST34UV"'
credential = "0F12A345BB67C8D901EFG23H45IJKL67MNO89PQ12RST34UV"
reason = "Camel-case key spelling with a long opaque value."

[[negative]]
text = "client_secret=${OAUTH_CLIENT_SECRET}"
reason = "Environment-variable templates are outside the credential alphabet."

[[negative]]
text = "client_secret=<secret>"
reason = "Angle-bracket templates are not concrete credentials."

[[negative]]
text = "client_secret=secret"
reason = "The value is below the detector length floor."

[[evasion]]
text = "client-secret: 'C113nt53KR3TN6N90yVuAgICxIRwsObLi0E67/N8eRN='"
credential = "C113nt53KR3TN6N90yVuAgICxIRwsObLi0E67/N8eRN="
reason = "Hyphenated key spelling and single-quoted credential."
