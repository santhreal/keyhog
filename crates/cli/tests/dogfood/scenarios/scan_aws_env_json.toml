description = "AWS access key in a .env: json output, exit 1, found at line 6"
corpus = [".env.aws-leak"]
args = ["scan", "--format", "json", "{corpus}/.env.aws-leak"]
exit_code = 1
max_ms = 20000

[[expect]]
detector_id = "aws-access-key"
line = 6

forbid = ["github-pat-fine-grained", "github-classic-pat"]
